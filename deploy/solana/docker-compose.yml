version: '3.8'
# Solana Test Validator — Local Development
#
# Image: registry.cn-shenzhen.aliyuncs.com/wl4g/anza_solana:3.1.14
#   (Built from anza-xyz/agave v3.1.14 release binaries)
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml logs -f
#   curl http://localhost:8899 -X POST -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
services:
  solana:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/anza_solana:3.1.14
    container_name: solana-test-validator
    restart: unless-stopped
    ports:
      - "8899:8899"
      - "8900:8900"
    networks:
      - solana-net
    volumes:
      - solana_ledger:/tmp/solana-ledger
    command:
      - --rpc-port=8899
      - --faucet-port=8900
      - --ledger=/tmp/solana-ledger
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json", "-d", '{"jsonrpc":"2.0","id":1,"method":"getHealth"}', "http://localhost:8899"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
networks:
  solana-net:
    driver: bridge
volumes:
  solana_ledger:
    name: solana_test_ledger
