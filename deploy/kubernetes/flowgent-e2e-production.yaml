# =============================================================================
# Flowgent — Full Production E2E Deployment on K3s
# Includes all microservices: API Server, Controller, JobManager, TaskManager,
# Wallet, Notification
#
# Prerequisites:
#   - K3s cluster with PG/EMQX/Redis accessible
#   - kubectl create secret generic flowgent-pg --from-literal=url="postgres://..."
#   - kubectl create secret generic flowgent-mqtt --from-literal=broker="tcp://..."
#
# Usage:
#   kubectl apply -f deploy/kubernetes/flowgent-e2e-production.yaml
#   kubectl get pods -l 'app in (flowgent-apiserver,flowgent-controller,flowgent-jobmanager,flowgent-taskmanager,flowgent-wallet,flowgent-notification)'
# =============================================================================

# ═══════════════════════════════════════════════════════════════════
# 1. API Server — Multi-tenant REST + A2A Gateway
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgent-apiserver
  labels:
    app: flowgent-apiserver
    component: apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowgent-apiserver
  template:
    metadata:
      labels:
        app: flowgent-apiserver
        component: apiserver
    spec:
      containers:
        - name: apiserver
          image: localhost/flowgent:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/flowgent"]
          args: ["apiserver", "start", "-c", "/etc/flowgent/flowgent.yaml", "-v"]
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowgent-pg
                  key: url
            - name: FLOWGENT_MQTT_BROKER
              valueFrom:
                secretKeyRef:
                  name: flowgent-mqtt
                  key: broker
                  optional: true
          ports:
            - name: rest
              containerPort: 9999
            - name: a2a
              containerPort: 9992
            - name: mgmt
              containerPort: 9991
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /_/healthz, port: 9991 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: flowgent-apiserver
  labels:
    app: flowgent-apiserver
spec:
  selector:
    app: flowgent-apiserver
  ports:
    - name: rest
      port: 9999
      targetPort: 9999
    - name: a2a
      port: 9992
      targetPort: 9992
    - name: mgmt
      port: 9991
      targetPort: 9991

# ═══════════════════════════════════════════════════════════════════
# 2. Controller — Distributed Sharded Flow Driver
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgent-controller
  labels:
    app: flowgent-controller
    component: controller
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flowgent-controller
  template:
    metadata:
      labels:
        app: flowgent-controller
        component: controller
    spec:
      serviceAccountName: flowgent-controller
      containers:
        - name: controller
          image: localhost/flowgent:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/flowgent"]
          args: ["controller", "start", "-c", "/etc/flowgent/flowgent.yaml", "-v"]
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowgent-pg
                  key: url
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FLOWGENT_JM_IMAGE
              value: "flowgent:latest"
          ports:
            - name: metrics
              containerPort: 9991
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flowgent-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flowgent-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flowgent-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flowgent-controller
subjects:
  - kind: ServiceAccount
    name: flowgent-controller

# ═══════════════════════════════════════════════════════════════════
# 3. JobManager — Session & Application Mode Control Plane
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgent-jobmanager
  labels:
    app: flowgent-jobmanager
    component: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowgent-jobmanager
  template:
    metadata:
      labels:
        app: flowgent-jobmanager
        component: jobmanager
    spec:
      containers:
        - name: jobmanager
          image: localhost/flowgent:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/flowgent"]
          args: ["jobmanager", "start", "-c", "/etc/flowgent/flowgent.yaml"]
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowgent-pg
                  key: url
            - name: FLOWGENT_MQTT_BROKER
              valueFrom:
                secretKeyRef:
                  name: flowgent-mqtt
                  key: broker
            # FLOWGENT_NAMESPACE unset → session mode (shared pool)
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: flowgent-jobmanager
  labels:
    app: flowgent-jobmanager
spec:
  selector:
    app: flowgent-jobmanager
  ports:
    - name: metrics
      port: 9991
      targetPort: 9991

# ═══════════════════════════════════════════════════════════════════
# 4. TaskManager — Elastic Worker Pool
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgent-taskmanager
  labels:
    app: flowgent-taskmanager
    component: taskmanager
spec:
  replicas: 4
  selector:
    matchLabels:
      app: flowgent-taskmanager
  template:
    metadata:
      labels:
        app: flowgent-taskmanager
        component: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: localhost/flowgent:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/flowgent"]
          args: ["taskmanager", "start", "-c", "/etc/flowgent/flowgent.yaml"]
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowgent-pg
                  key: url
            - name: FLOWGENT_MQTT_BROKER
              valueFrom:
                secretKeyRef:
                  name: flowgent-mqtt
                  key: broker
            - name: FLOWGENT_TM_SLOTS
              value: "4"
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 2, memory: 2Gi }

# ═══════════════════════════════════════════════════════════════════
# 5. Wallet — Secure Key Management & Payment Signing
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgent-wallet
  labels:
    app: flowgent-wallet
    component: wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowgent-wallet
  template:
    metadata:
      labels:
        app: flowgent-wallet
        component: wallet
    spec:
      containers:
        - name: wallet
          image: localhost/flowgent:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/flowgent"]
          args: ["wallet", "start", "--listen", "0.0.0.0:9901"]
          env:
            - name: FLOWGENT_MASTER_KEY_FILE
              value: "/var/secrets/master.key"
          ports:
            - name: api
              containerPort: 9901
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: flowgent-wallet
  labels:
    app: flowgent-wallet
spec:
  selector:
    app: flowgent-wallet
  ports:
    - name: api
      port: 9901
      targetPort: 9901

# ═══════════════════════════════════════════════════════════════════
# 6. Notification — WS Push + Multi-Channel Notifier
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgent-notification
  labels:
    app: flowgent-notification
    component: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowgent-notification
  template:
    metadata:
      labels:
        app: flowgent-notification
        component: notification
    spec:
      containers:
        - name: notification
          image: localhost/flowgent:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/flowgent"]
          args: ["notification", "start"]
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowgent-pg
                  key: url
            - name: FLOWGENT_MQTT_BROKER
              valueFrom:
                secretKeyRef:
                  name: flowgent-mqtt
                  key: broker
                  optional: true
          ports:
            - name: ws
              containerPort: 9993
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: flowgent-notification
  labels:
    app: flowgent-notification
spec:
  selector:
    app: flowgent-notification
  ports:
    - name: ws
      port: 9993
      targetPort: 9993
