apiVersion: v1
kind: Service
metadata:
  name: x402-facilitator
  namespace: flowgent
spec:
  selector:
    app: x402-facilitator
  ports:
    - port: 8085
      targetPort: 8085
      name: api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-facilitator
  namespace: flowgent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: x402-facilitator
  template:
    metadata:
      labels:
        app: x402-facilitator
    spec:
      containers:
        - name: facilitator
          image: registry.cn-shenzhen.aliyuncs.com/wl4g/x402_facilitator:1.4.9
          ports:
            - containerPort: 8085
              name: api
          env:
            - name: FACILITATOR_PORT
              value: "8085"
            - name: FACILITATOR_CHAIN
              value: base
            - name: FACILITATOR_SETTLEMENT
              value: x402
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
