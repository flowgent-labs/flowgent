apiVersion: v1
kind: Secret
metadata:
  name: flowgent-master-key
  namespace: flowgent
type: Opaque
data:
  master-key: "${FLOWGENT_MASTER_KEY_BASE64}"

---
apiVersion: v1
kind: Service
metadata:
  name: flowgent-wallet
  namespace: flowgent
spec:
  selector:
    app: flowgent-wallet
  ports:
    - port: 9901
      targetPort: 9901
      name: api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgent-wallet
  namespace: flowgent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowgent-wallet
  template:
    metadata:
      labels:
        app: flowgent-wallet
    spec:
      containers:
        - name: wallet
          image: flowgent/flowgent-wallet:latest
          args:
            - "--listen=0.0.0.0:9901"
            - "--db=/var/lib/flowgent/wallet/wallet.db"
            - "--master-key-file=/etc/flowgent/secrets/master-key"
          ports:
            - containerPort: 9901
              name: api
          env:
            - name: FLOWGENT_MASTER_KEY_FILE
              value: /etc/flowgent/secrets/master-key
          volumeMounts:
            - name: secrets
              mountPath: /etc/flowgent/secrets
              readOnly: true
            - name: wallet-data
              mountPath: /var/lib/flowgent/wallet
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9901
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: secrets
          secret:
            secretName: flowgent-master-key
        - name: wallet-data
          persistentVolumeClaim:
            claimName: wallet-pvc
