# Flowgent Controller — Distributed Sharded Flow Driver
# Runs as a K8s Deployment. Each pod discovers its peers via label selector
# and owns a hash-mod shard of the agentflow_definitions table.
#
# Usage:
#   kubectl apply -f deploy/kubernetes/flowgent-controller.yaml
#
# Scale: kubectl scale deploy/flowgent-controller --replicas=3
#   → flows automatically rebalance across pods via hash-mod sharding

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgent-controller
  labels:
    app: flowgent-controller
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flowgent-controller
  template:
    metadata:
      labels:
        app: flowgent-controller
    spec:
      serviceAccountName: flowgent-controller
      containers:
        - name: controller
          image: flowgent:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/flowgent"]
          args:
            - "controller"
            - "start"
            - "-c"
            - "/etc/flowgent/flowgent.yaml"
            - "-v"
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowgent-pg
                  key: url
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FLOWGENT_CONTROLLER_LABEL
              value: "app=flowgent-controller"
            - name: FLOWGENT_JM_IMAGE
              value: "flowgent:latest"
          ports:
            - name: metrics
              containerPort: 9991
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /_/healthz
              port: 9991
            initialDelaySeconds: 10
            periodSeconds: 30
---
# ServiceAccount for controller to query K8s API for pod discovery
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flowgent-controller
---
# Role for reading pods (service discovery)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flowgent-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flowgent-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flowgent-controller
subjects:
  - kind: ServiceAccount
    name: flowgent-controller
