apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowgent-apiserver
  namespace: flowgent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowgent-apiserver
  template:
    metadata:
      labels:
        app: flowgent-apiserver
    spec:
      containers:
        - name: apiserver
          image: flowgent/flowgent:latest
          args: ["apiserver", "--config", "/etc/flowgent/flowgent.yaml", "--verbose"]
          ports:
            - containerPort: 9999
              name: api
            - containerPort: 9991
              name: mgmt
          env:
            - name: FLOWGENT_CONFIG_FILE
              value: /etc/flowgent/flowgent.yaml
            - name: FLOWGENT_MASTER_KEY_FILE
              value: /etc/flowgent/secrets/master-key
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
              readOnly: true
            - name: secrets
              mountPath: /etc/flowgent/secrets
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /_/healthz
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /_/healthz
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: flowgent-config
        - name: secrets
          secret:
            secretName: flowgent-master-key

---
