# Dex OIDC provider — lightweight Go-based OIDC for e2e testing
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  responseTypes: ["code"]
  skipApprovalScreen: true

staticClients:
- id: flowgent-client
  secret: flowgent-secret
  name: Flowgent
  redirectURIs:
  - http://localhost:8080/auth/callback/oidc
  - http://127.0.0.1:8080/auth/callback/oidc
  - http://localhost:58080/auth/callback/oidc
  - http://127.0.0.1:58080/auth/callback/oidc

connectors:
- type: mockCallback
  id: mock
  name: Mock
