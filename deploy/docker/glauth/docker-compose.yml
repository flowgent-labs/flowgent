version: "3.8"
services:
  # ── GLAuth LDAP server ──────────────────────────────────────────
  glauth:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/glauth:v2.5.0
    container_name: glauth
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "256M" }
        reservations: { cpus: "0.25", memory: "128M" }
    ports:
      - "3389:389"    # host port >=443 to avoid rootless podman issue
    networks:
      - glauth-net
    volumes:
      - ./config.cfg:/app/config/config.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=example,dc=com -s base 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Init: verify the LDAP server is ready ────────────────────────
  glauth-init:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/alpine:3.21
    container_name: glauth-init
    depends_on:
      glauth:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">> Verifying GLAuth LDAP server..."
        apk add --no-cache openldap-clients > /dev/null 2>&1
        for i in $$(seq 1 10); do
          if ldapsearch -x -H ldap://glauth:389 -b "dc=example,dc=com" -D "cn=svc-flowgent,ou=Users,dc=example,dc=com" -w password123 "(cn=jdoe)" dn 2>/dev/null | grep -q "jdoe"; then
            echo "  LDAP server ready, user search OK"
            break
          fi
          echo "  waiting for LDAP... ($$i)"
          sleep 2
        done
        echo ""
        echo "=== Test users (password: password123) ==="
        echo "  jdoe    (corp)  - FlowgentAdmins → role: admin"
        echo "  asmith  (corp)  - FlowgentOps    → role: operator"
        echo "  bwilson (corp)  - no groups      → role: (none)"
        echo "  cjones  (eng)   - FlowgentAdmins → role: admin"
        echo "  dlee    (eng)   - FlowgentAdmins → role: admin"
        echo ""
        echo "  Service account: cn=svc-flowgent,ou=Users,dc=example,dc=com / password123"
        echo ">> GLAuth init complete."
    networks:
      - glauth-net

networks:
  glauth-net:
    driver: bridge
