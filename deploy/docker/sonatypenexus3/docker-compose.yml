version: '3.8'

services:
  sonatypenexus3:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/sonatype_nexus3:3.91.1
    container_name: sonatypenexus3
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 655350
        hard: 655350
    mem_limit: 3G
    memswap_limit: 3G
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1g -Xmx2g -XX:MaxRAMPercentage=75.0 -XX:MaxDirectMemorySize=1g -XX:+AlwaysPreTouch -Djava.util.prefs.userRoot=/nexus-data/javaprefs
      - NEXUS_CONTEXT=/
    ports:
      - "28081:8081"
    networks:
      - nexus3-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    volumes:
      - nexus3_data:/nexus-data

  # Auto-reset admin password to fixed value on first startup.
  nexus3-init:
    image: alpine:3.21
    container_name: sonatypenexus3-init
    depends_on:
      sonatypenexus3:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '>> Resetting Nexus admin password...'
        INIT_PASS=$$(cat /nexus-data/admin.password 2>/dev/null || echo '')
        if [ -z "$$INIT_PASS" ]; then
          echo 'WARN: No admin.password — already initialized.'
          exit 0
        fi
        echo '  Changing admin password...'
        curl -sf -u "admin:$$INIT_PASS" -X PUT \
          'http://sonatypenexus3:8081/service/rest/v1/security/users/admin/change-password' \
          -H 'Content-Type: text/plain' \
          -d 'Abcd1234@nexus3' \
          && echo '>> Nexus admin password set to: Abcd1234@nexus3' \
          || echo 'WARN: Password change failed — may already be set'
        echo '>> Nexus init done.'
    volumes:
      - nexus3_data:/nexus-data:ro
    networks:
      - nexus3-net

networks:
  nexus3-net:
    driver: bridge

volumes:
  nexus3_data:
    name: nexus3_data
