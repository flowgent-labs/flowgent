version: '3.8'
# x402 Facilitator — Local Development
# Fork: https://github.com/wl4g-blockchain/x402-rs (mirror of x402-rs/x402-rs)
#
# Image sources (in priority order):
#   1. registry.cn-shenzhen.aliyuncs.com/wl4g/x402_facilitator:1.4.9 (Aliyun mirror — official x402-rs/x402-rs v1.4.9)
#   2. ghcr.io/qntx/facilitator:latest (community fork, legacy)
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml logs -f
services:
  facilitator:
    image: registry.cn-shenzhen.aliyuncs.com/wl4g/x402_facilitator:1.4.9
    container_name: x402-facilitator
    restart: unless-stopped
    ports:
      - "8085:8080"
    networks:
      - facilitator-net
    volumes:
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
networks:
  facilitator-net:
    driver: bridge
