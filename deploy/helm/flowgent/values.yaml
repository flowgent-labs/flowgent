# ═══════════════════════════════════════════════════════════════
# Flowgent Helm Chart — Default Values
# ═══════════════════════════════════════════════════════════════

global:
  # Deployment mode: session | application
  mode: session

  # Application-mode settings (used by Controller when creating dedicated JMs)
  application:
    namespacePrefix: "flowgent"
    autoCleanup: true
    taskmanager:
      slots: 4
    sandbox:
      slots: 4

  image:
    repository: registry.cn-shenzhen.aliyuncs.com/wl4g/flowgent
    tag: latest
    pullPolicy: IfNotPresent

  # Credential file paths mounted in pods (K8s Secrets).
  # Hierarchy: flow-level overrides tenant-level.
  credentialPaths:
    basePath: "/var/secret/flowgent"

# ═══════════════════════════════════════════════════════════════
# Middleware — enabled=true deploys as part of this chart.
# enabled=false uses existing external middleware via K8s Secret.
# ═══════════════════════════════════════════════════════════════

postgresql:
  enabled: false          # true = deploy PG in-cluster
  externalSecret: ""      # name of existing secret with key "url"
  # When enabled, the secret is auto-created. Internal only — no passwords here.

emqx:
  enabled: false           # true = deploy EMQX in-cluster
  externalSecret: ""       # name of existing secret with key "broker"

redis:
  enabled: false           # true = deploy Redis in-cluster
  externalSecret: ""       # name of existing secret with key "nodes"

# ═══════════════════════════════════════════════════════════════
# Jaeger — Distributed Tracing (OTEL Collector)
# ═══════════════════════════════════════════════════════════════
jaeger:
  enabled: true             # true = deploy Jaeger all-in-one in-cluster
  mode: all-in-one          # all-in-one | distributed (TODO)
  image: registry.cn-shenzhen.aliyuncs.com/wl4g/jaegertracing_all-in-one:1.76.0
  service:
    otlpGrpc: 4317
    otlpHttp: 4318
    ui: 16686
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# Queue config
queue:
  type: mqtt
  topicPrefix: "flowgent/exec"

# ═══════════════════════════════════════════════════════════════
# API Server — [always] Multi-tenant REST Gateway
# ═══════════════════════════════════════════════════════════════
apiserver:
  enabled: true
  replicas: 2
  image: ""
  service:
    restPort: 9999
    mgmtPort: 9991
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  config:
    jwtAlgorithm: ES256
    jwtValidityAk: 3600
    jwtValidityRk: 86400
    anonymousPaths:
      - "/public/**"
      - "/static/**"
      - "/_/healthz/**"
      - "/a2a/**"

# ═══════════════════════════════════════════════════════════════
# A2A — [optional] Google Agent-to-Agent Protocol Server
# ═══════════════════════════════════════════════════════════════
a2a:
  enabled: false
  replicas: 2
  image: ""
  service:
    port: 9992
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# Controller — [application] Distributed Sharded Flow Driver
# ═══════════════════════════════════════════════════════════════
controller:
  replicas: 2
  image: ""
  pollInterval: "10s"
  serviceAccount:
    create: true
    name: flowgent-controller
  rbac:
    create: true
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# JobManager — [session] DAG Orchestration Control Plane
# ═══════════════════════════════════════════════════════════════
jobmanager:
  replicas: 2
  image: ""
  ha:
    enabled: true
    leaseDuration: "30s"
    renewDeadline: "15s"
    retryPeriod: "5s"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "1", memory: "1Gi" }

# ═══════════════════════════════════════════════════════════════
# TaskManager — [session] Elastic Worker Pool
# ═══════════════════════════════════════════════════════════════
taskmanager:
  replicas: 2
  image: ""
  slots: 4
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "2", memory: "2Gi" }

# ═══════════════════════════════════════════════════════════════
# Sandbox — [session] Secure Script Execution Worker
# ═══════════════════════════════════════════════════════════════
sandbox:
  enabled: true
  replicas: 2
  image: ""
  slots: 4
  workspace: "/var/flowgent/workspace"     # PVC mount path — shared across all sandbox pods
  workspaceSize: "10Gi"                    # PVC size
  # Credentials injected as env vars into sandbox pods for script access
  credentials:
    nexus3:
      url: "http://nexus3:8081"
      secret: "nexus3-creds"               # K8s secret with keys: username, password
    sonatypeiq:
      url: "http://sonatypeiq:8070"
      secret: "iq-creds"                   # K8s secret with keys: username, password (optional)
  policy:
    network:
      mode: "none"
      allowed: []
      denied: []
    allowedRuntimes: [python3, bash, node]
    bannedCommands: []
    defaultTimeout: "120s"
    maxTimeout: "600s"
    defaultResources:
      cpu: "500m"
      memory: "256Mi"
    maxResources:
      cpu: "2000m"
      memory: "1Gi"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "1", memory: "1Gi" }

# ═══════════════════════════════════════════════════════════════
# Wallet — [optional] x402 Key Management & Payment Signing
# ═══════════════════════════════════════════════════════════════
wallet:
  enabled: false
  replicas: 2
  image: ""
  service:
    port: 9901
  autoGenerateKey: true
  masterKey: ""
  keyFile: "/var/secrets/flowgent/master.key"
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }

# ═══════════════════════════════════════════════════════════════
# Notifier — [always] WS Push + Multi-Channel Notifier
# ═══════════════════════════════════════════════════════════════
notifier:
  enabled: true
  replicas: 2
  image: ""
  service:
    port: 9993
  channels: []
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
