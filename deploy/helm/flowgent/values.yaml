# ═══════════════════════════════════════════════════════════════
# Flowgent Helm Chart — Default Values
# ═══════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════
# Deployment Mode — determines which components Helm pre-deploys
# ═══════════════════════════════════════════════════════════════
# session:     Pre-deploy shared pool: apiserver, jobmanager, taskmanager,
#             sandbox, notifier. API Server handles triggers directly;
#             JM poller picks up PENDING runs. TM scaling is manual.
#
# application: Helm deploys apiserver + controller + notifier.
#             Controller polls PG, creates per-flow jobmanager/taskmanager/
#             sandbox dynamically (dedicated K8s namespace, auto-scale).
#             replicas/slots below are IGNORED in this mode.
#
# all-in-one:  Single-process dev mode — not applicable to Helm.
mode: session

# Application-mode settings (used by Controller when creating dedicated JMs)
application:
  namespacePrefix: "flowgent"
  autoCleanup: true       # delete JM Deployment when flow completes
  taskmanager:
    slots: 4              # slots per dynamically-created TM pod
  sandbox:
    slots: 4              # slots per dynamically-created sandbox pod

# =========================================================================
# NOTE: The following component sections are grouped by deployment scope.
# [always]  = deployed in BOTH session and application modes
# [session] = only pre-deployed in session mode (application: dynamic)
# [optional] = disabled by default, enable via --set <name>.enabled=true
# =========================================================================

# Global settings
global:
  image:
    repository: localhost/flowgent
    tag: latest
    pullPolicy: IfNotPresent
  # Shared secrets (overridden by --set or external secrets)
  databaseUrl: ""
  mqttBroker: ""

# ═══════════════════════════════════════════════════════════════
# Infrastructure Dependencies
# ═══════════════════════════════════════════════════════════════
postgresql:
  enabled: true
  host: ""
  port: 5432
  database: flowgent
  username: flowgent
  password: ""
  ssl: false
  poolMin: 2
  poolMax: 20

emqx:
  enabled: true
  broker: ""
  dashboardPort: 18083

# Queue config — embedded in flowgent.yaml
queue:
  type: mqtt
  topicPrefix: "flowgent/exec"

redis:
  enabled: true
  nodes: []
  password: ""

# ═══════════════════════════════════════════════════════════════
# API Server — [always] Multi-tenant REST Gateway
# ═══════════════════════════════════════════════════════════════
apiserver:
  enabled: true
  replicas: 2
  image: ""
  service:
    restPort: 9999
    mgmtPort: 9991
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  config:
    jwtAlgorithm: ES256
    jwtValidityAk: 3600
    jwtValidityRk: 86400
    anonymousPaths:
      - "/public/**"
      - "/static/**"
      - "/_/healthz/**"
      - "/a2a/**"

# ═══════════════════════════════════════════════════════════════
# A2A — [optional] Google Agent-to-Agent Protocol Server
# ═══════════════════════════════════════════════════════════════
a2a:
  enabled: false
  replicas: 2
  image: ""
  service:
    port: 9992
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# Controller — [application] Distributed Sharded Flow Driver
# ═══════════════════════════════════════════════════════════════
# Deployed by Helm only in application mode.
# Polls PG agentflow_definitions, creates dedicated JM Deployments via K8s API
# for grade-priority flows, and manages their lifecycle (create/cleanup).
# Not needed in session mode — API Server handles triggers directly.
controller:
  replicas: 2          # [application] controller pool for sharding
  image: ""
  pollInterval: "10s"
  serviceAccount:
    create: true
    name: flowgent-controller
  rbac:
    create: true
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# JobManager — [session] DAG Orchestration Control Plane
# ═══════════════════════════════════════════════════════════════
# Pre-deployed by Helm only in session mode.
# In application mode, Controller creates dedicated JMs dynamically.
jobmanager:
  replicas: 2          # [session] shared pool size
  image: ""
  # [session] JM HA: when replicas > 1, pods use leader election via K8s labels.
  # Standby JMs poll and take over if leader fails.
  ha:
    enabled: true
    leaseDuration: "30s"
    renewDeadline: "15s"
    retryPeriod: "5s"
  resources:           # [always] applies to both session and dynamic JMs
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "1", memory: "1Gi" }

# ═══════════════════════════════════════════════════════════════
# TaskManager — [session] Elastic Worker Pool
# ═══════════════════════════════════════════════════════════════
# Pre-deployed by Helm only in session mode (admin-managed scaling).
# In application mode, JM's K8s ResourceManager auto-scales TMs dynamically.
taskmanager:
  replicas: 2          # [session] admin-managed pool size
  image: ""
  slots: 4             # [session] slots per TM pod; application mode uses application.taskmanager.slots
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "2", memory: "2Gi" }

# ═══════════════════════════════════════════════════════════════
# Sandbox — [session] Secure Script Execution Worker
# ═══════════════════════════════════════════════════════════════
# Pre-deployed by Helm only in session mode.
# In application mode, sandbox workers are created dynamically with the JM.
sandbox:
  replicas: 1          # [session] shared sandbox pool size
  image: ""
  slots: 4             # [session] slots per sandbox pod; application mode uses application.sandbox.slots
  # [session] Shared workspace volume. Application mode uses per-flow PVCs.
  workspace: "/var/flowgent/workspace"
  policy:
    network:
      mode: "none"
      allowed: []
      denied: []
    allowedRuntimes:
      - python3
      - bash
      - node
    bannedCommands: []
    defaultTimeout: "120s"
    maxTimeout: "600s"
    defaultResources:
      cpu: "500m"
      memory: "256Mi"
    maxResources:
      cpu: "2000m"
      memory: "1Gi"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "1", memory: "1Gi" }

# ═══════════════════════════════════════════════════════════════
# Wallet — [optional] Stateless Key Management & Payment Signing
# ═══════════════════════════════════════════════════════════════
wallet:
  enabled: false
  replicas: 2
  image: ""
  service:
    port: 9901
  # Auto-generate root Ed25519 private key if not provided
  # The generated key is printed in NOTES.txt after install
  autoGenerateKey: true
  masterKey: ""        # leave empty to auto-generate
  keyFile: "/var/secrets/flowgent/master.key"
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }

# ═══════════════════════════════════════════════════════════════
# Notifier — [always] WS Push + Multi-Channel Notification
# ═══════════════════════════════════════════════════════════════
# Deployed in both modes. Session mode mounts a shared workspace volume;
# application mode uses a dedicated per-flow workspace.
notifier:
  enabled: true
  replicas: 2
  image: ""
  service:
    port: 9993
  channels: []
  # Example:
  # channels:
  #   - name: slack-ops
  #     type: slack
  #     config:
  #       webhook_url: "https://hooks.slack.com/..."
  #       channel: "#alerts"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
