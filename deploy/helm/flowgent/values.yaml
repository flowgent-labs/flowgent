# ═══════════════════════════════════════════════════════════════
# Flowgent Helm Chart — Default Values
# ═══════════════════════════════════════════════════════════════

# Global settings
global:
  image:
    repository: localhost/flowgent
    tag: latest
    pullPolicy: IfNotPresent
  # Shared secrets (overridden by --set or external secrets)
  databaseUrl: ""
  mqttBroker: ""

# ═══════════════════════════════════════════════════════════════
# Infrastructure Dependencies
# ═══════════════════════════════════════════════════════════════
postgresql:
  enabled: true
  host: ""
  port: 5432
  database: flowgent
  username: flowgent
  password: ""
  ssl: false
  poolMin: 2
  poolMax: 20

emqx:
  enabled: true
  broker: ""
  dashboardPort: 18083

redis:
  enabled: true
  nodes: []
  password: ""

# ═══════════════════════════════════════════════════════════════
# API Server — Multi-tenant REST + A2A Gateway
# ═══════════════════════════════════════════════════════════════
apiserver:
  enabled: true
  replicas: 2
  image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
  service:
    restPort: 9999
    a2aPort: 9992
    mgmtPort: 9991
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  config:
    jwtAlgorithm: ES256
    jwtValidityAk: 3600
    jwtValidityRk: 86400
    anonymousPaths:
      - "/public/**"
      - "/static/**"
      - "/_/healthz/**"
      - "/a2a/**"

# ═══════════════════════════════════════════════════════════════
# Controller — Distributed Sharded Flow Driver
# ═══════════════════════════════════════════════════════════════
controller:
  enabled: true
  replicas: 2
  image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
  pollInterval: "10s"
  serviceAccount:
    create: true
    name: flowgent-controller
  rbac:
    create: true
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# JobManager — Session + Application Mode Control Plane
# ═══════════════════════════════════════════════════════════════
jobmanager:
  enabled: true
  replicas: 2
  image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
  # HA mode: when replicas > 1, JM pods use IDiscoveryClient (K8s label selector)
  # to elect one active JM. Standby JMs poll and take over if leader fails.
  ha:
    enabled: true
    leaseDuration: "30s"
    renewDeadline: "15s"
    retryPeriod: "5s"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "1", memory: "1Gi" }

# ═══════════════════════════════════════════════════════════════
# TaskManager — Elastic Worker Pool
# ═══════════════════════════════════════════════════════════════
taskmanager:
  enabled: true
  replicas: 2
  image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
  slots: 4
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "2", memory: "2Gi" }

# ═══════════════════════════════════════════════════════════════
# Wallet — Stateless Key Management & Payment Signing
# ═══════════════════════════════════════════════════════════════
wallet:
  enabled: true
  replicas: 2
  image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
  service:
    port: 9901
  # Auto-generate root Ed25519 private key if not provided
  # The generated key is printed in NOTES.txt after install
  autoGenerateKey: true
  masterKey: ""        # leave empty to auto-generate
  keyFile: "/var/secrets/flowgent/master.key"
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }

# ═══════════════════════════════════════════════════════════════
# Notification — WS Push + Multi-Channel Notifier
# ═══════════════════════════════════════════════════════════════
notification:
  enabled: true
  replicas: 2
  image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
  service:
    port: 9993
  channels: []
  # Example:
  # channels:
  #   - name: slack-ops
  #     type: slack
  #     config:
  #       webhook_url: "https://hooks.slack.com/..."
  #       channel: "#alerts"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
