# ═══════════════════════════════════════════════════════════════
# Flowgent Helm Chart — Default Values
# ═══════════════════════════════════════════════════════════════

global:
  image:
    repository: ghcr.io/flowgent-labs/flowgent
    tag: ""                       # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

# Business workload lifecycle. Keep this true for ordinary Flowgent releases.
# A separately managed AuthGuard middleware release sets it to false so normal
# Flowgent upgrades cannot create, upgrade, or delete middleware resources.
application:
  enabled: true

# ═══════════════════════════════════════════════════════════════
# Middleware — enabled=true deploys as part of this chart.
# enabled=false uses existing external middleware via K8s Secret.
# ═══════════════════════════════════════════════════════════════

postgresql:
  enabled: false          # true = deploy PG in-cluster
  externalSecret: ""      # name of existing secret with key "url"
  # When enabled, the secret is auto-created. Internal only — no passwords here.

emqx:
  enabled: false           # true = deploy EMQX in-cluster
  externalSecret: ""       # name of existing secret with key "broker"
  maxPacketSize: "8MB"     # supports large DAG payloads such as source-file context

redis:
  enabled: false           # true = deploy Redis in-cluster
  externalSecret: ""       # name of existing secret with key "nodes"

# ═══════════════════════════════════════════════════════════════
# Jaeger — Distributed Tracing (OTEL Collector)
# ═══════════════════════════════════════════════════════════════
jaeger:
  enabled: true             # true = deploy Jaeger all-in-one in-cluster
  mode: all-in-one          # all-in-one | distributed (TODO)
  image: registry.cn-shenzhen.aliyuncs.com/wl4g/jaegertracing_all-in-one:1.76.0
  queryEndpoint: ""         # required when enabled=false, e.g. https://jaeger.example.com
  service:
    otlpGrpc: 4317
    otlpHttp: 4318
    ui: 16686
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Storage — persistent data backend
storage:
  type: SQLITE                 # SQLITE | POSTGRE
  postgres:
    # External DSN. The E2E deployer supplies this when PostgreSQL is external.
    dsn: ""
    # PostgreSQL schema boundary. Empty defaults to public.
    schema: ""
  artifacts:
    provider: default          # default | s3 | gcs
    inlineMaxBytes: 262144
    maxPayloadBytes: 67108864
    compression: gzip          # none | gzip
    prefix: flowgent/task-runs
    putTimeout: 30s
    getTimeout: 30s
    verifyChecksum: true
    s3:
      bucket: ""
      region: ""
      endpoint: ""
      forcePathStyle: false
    gcs:
      bucket: ""
      endpoint: ""
      credentialsFile: ""
      anonymous: false

# ── Distributed Lock Provider ───────────────────────────────
lock:
  provider: ""                  # empty = postgres when storage.type=POSTGRE, otherwise memory

# ── Inter-component Messaging (MQTT) ─────────────────────────
messaging:
  type: mqtt                     # mqtt | memory
  mqtt:
    broker: ""                   # set via FLOWGENT_MQTT_BROKER env or external secret

# ═══════════════════════════════════════════════════════════════
# API Server — [always] Multi-namespace REST Gateway
# ═══════════════════════════════════════════════════════════════
apiserver:
  enabled: true
  replicas: 2
  image: ""
  service:
    # External traffic enters through the AuthGuard-managed Envoy Gateway.
    # E2E may explicitly override this to NodePort.
    type: ClusterIP
    restPort: 9999
    internalPort: 9990
    mgmtPort: 9991
    nodePorts:
      rest: 30999
      internal: 30990
      mgmt: 30991
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# A2A — [optional] Google Agent-to-Agent Protocol Server
# ═══════════════════════════════════════════════════════════════
a2a:
  enabled: false
  replicas: 2
  image: ""
  service:
    type: NodePort
    port: 9992
    nodePort: 30992
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# Web — Nginx-served Operations Console
# ═══════════════════════════════════════════════════════════════
web:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/flowgent-labs/flowgent-web
    tag: ""                       # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  apiUpstream: ""                 # default: http://{release}-apiserver:{apiserver.service.restPort}
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30080
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "250m", memory: "256Mi" }

# ═══════════════════════════════════════════════════════════════
# Controller — Distributed Sharded Flow Driver
# ═══════════════════════════════════════════════════════════════
controller:
  replicas: 2
  image: ""
  pollInterval: "10s"
  serviceAccount:
    create: true
    name: flowgent-controller
  rbac:
    create: true
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# Sandbox — Secure Script Execution Policy
#   Policy is used by TM for inline sandbox execution.
#   K8sRM manages sandbox pods independently in distributed mode.
# ═══════════════════════════════════════════════════════════════
sandbox:
  workspace: "/var/flowgent"
  hostWorkspace: "/mnt/disk1/flowgent/e2e"
  slots: 4
  minReplicas: 0
  maxReplicas: 10
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
  policy:
    network:
      mode: "none"
      allowed: []
      denied: []
    allowedRuntimes: [python3, bash, node]
    bannedCommands: []
    defaultTimeout: "120s"
    maxTimeout: "600s"

# ═══════════════════════════════════════════════════════════════
# External Wallet client — optional x402 signing integration.
# Wallet server deployment and secret storage belong to the Wallet release.
# ═══════════════════════════════════════════════════════════════
wallet:
  enabled: false
  transport: mqtt
  clientIdPrefix: "flowgent-"
  keyId: ""
  publicAddress: ""
  signTimeout: "30s"
  localSocket: "/run/wallet/wallet.sock"
  policies:
    maxSinglePaymentUsd: 1
    maxDailyBudgetUsd: 50
    allowedDomains: []
    blockedDomains: ["*.unknown.xyz"]
    requireHumanApprovalAboveUsd: 5
    # x402 v2 asset identifiers are token contract addresses (USDC on Base).
    allowedAssets: ["0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"]
    allowedChains: ["eip155:8453"]
  httpTimeout: "30s"

# ═══════════════════════════════════════════════════════════════
# Notifier — [always] WS Push + Multi-Channel Notifier
# ═══════════════════════════════════════════════════════════════
notifier:
  enabled: true
  replicas: 2
  image: ""
  scanInterval: "5s"
  cleanupInterval: "30s"
  routeTimeout: "5m"
  secretEncryption:
    provider: "aesgcm"
    activeKeyId: "v1"
    # Production should point this at a KMS/HSM-managed, externally rotated
    # Kubernetes Secret. Empty creates and preserves a release-local key.
    existingSecret: ""
    keyName: "key-v1"
  service:
    port: 9993
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# Runtime — deploy-time operational parameters under runtime: in config.
# Includes runtime modes, namespace isolation, credential paths, and secrets.
#
# namespacePrefix MUST match between the apiserver (Trigger routing) and the
# Controller (per-namespace JM Deployment namespace placement — every flow's
# dedicated JM Deployment lives in its namespace's shared K8s namespace,
# "{namespacePrefix}{namespaceID}") — see pkg/controller/pkg/controller.go
# runtimeNamespace contract.
# ═══════════════════════════════════════════════════════════════
runtime:
  # Stable owner identity used in labels for controller-created JM/TM/Sandbox.
  # Give concurrent installations distinct values to prevent cross-release GC.
  resourceOwner: flowgent
  # Complete Flowgent runtime configuration mounted as /etc/flowgent/flowgent.yaml.
  # This block is rendered with Helm tpl, so it can reference chart values.
  flowgent-config: |
    service_name: {{ include "flowgent.name" . }}
    server:
      host: "0.0.0.0"
      port: {{ .Values.apiserver.service.restPort }}
      internal_port: {{ .Values.apiserver.service.internalPort }}
      shutdown_timeout: "15s"
    a2a:
      enabled: {{ .Values.a2a.enabled }}
      host: "0.0.0.0"
      port: {{ .Values.a2a.service.port }}
    mgmt:
      enabled: true
      host: "0.0.0.0"
      port: {{ .Values.apiserver.service.mgmtPort }}
      pprof:
        enabled: true
        server_bind: "0.0.0.0:6669"
      otel:
        enabled: true
        endpoint: "{{ include "flowgent.fullname" . }}-jaeger:{{ .Values.jaeger.service.otlpHttp }}"
        protocol: "http/protobuf"
        sample_rate: 1.0
        {{- if .Values.jaeger.enabled }}
        query_endpoint: "http://{{ include "flowgent.fullname" . }}-jaeger:{{ .Values.jaeger.service.ui }}"
        {{- else }}
        query_endpoint: {{ .Values.jaeger.queryEndpoint | quote }}
        {{- end }}
        query_timeout: 10000
        query_lookback: "24h"
        query_limit: 20
      metrics:
        enabled: false
    logging:
      mode: JSON
      level: DEBUG
    authguard_adapter:
      {{- $middleware := index .Values "authguard-middleware" }}
      enabled: {{ or $middleware.enabled $middleware.adapter.enabled }}
      partition: {{ $middleware.adapter.resource.partition | quote }}
      service: {{ $middleware.adapter.resource.service | quote }}
      region: {{ $middleware.adapter.resource.region | quote }}
      tenant: {{ $middleware.adapter.resource.tenant | quote }}
    cache:
      provider: Memory
      memory:
        initial_capacity: 32
        max_capacity: 65535
        ttl: 3600000
        eviction_policy: LRU
    storage:
      type: {{ .Values.storage.type | default "SQLITE" | quote }}
      {{- if eq (.Values.storage.type | default "SQLITE") "SQLITE" }}
      sqlite:
        dir: .flowgent/sqlite
      {{- end }}
      {{- if .Values.storage.postgres.dsn }}
      postgres:
        dsn: {{ .Values.storage.postgres.dsn | quote }}
        {{- if .Values.storage.postgres.schema }}
        schema: {{ .Values.storage.postgres.schema | quote }}
        {{- end }}
      {{- else if .Values.postgresql.enabled }}
      postgres:
        host: "{{ include "flowgent.fullname" . }}-postgresql"
        port: 5432
        database: flowgent
        {{- if .Values.storage.postgres.schema }}
        schema: {{ .Values.storage.postgres.schema | quote }}
        {{- end }}
        username: flowgent
        password: flowgent
        min_connections: 2
        max_connections: 20
      {{- end }}
      artifacts:
        provider: {{ .Values.storage.artifacts.provider | default "default" | quote }}
        inline_max_bytes: {{ int64 .Values.storage.artifacts.inlineMaxBytes }}
        max_payload_bytes: {{ int64 .Values.storage.artifacts.maxPayloadBytes }}
        compression: {{ .Values.storage.artifacts.compression | default "gzip" | quote }}
        prefix: {{ .Values.storage.artifacts.prefix | default "flowgent/task-runs" | quote }}
        put_timeout: {{ .Values.storage.artifacts.putTimeout | default "30s" | quote }}
        get_timeout: {{ .Values.storage.artifacts.getTimeout | default "30s" | quote }}
        verify_checksum: {{ .Values.storage.artifacts.verifyChecksum }}
        s3:
          bucket: {{ .Values.storage.artifacts.s3.bucket | default "" | quote }}
          region: {{ .Values.storage.artifacts.s3.region | default "" | quote }}
          endpoint: {{ .Values.storage.artifacts.s3.endpoint | default "" | quote }}
          force_path_style: {{ .Values.storage.artifacts.s3.forcePathStyle }}
        gcs:
          bucket: {{ .Values.storage.artifacts.gcs.bucket | default "" | quote }}
          endpoint: {{ .Values.storage.artifacts.gcs.endpoint | default "" | quote }}
          credentials_file: {{ .Values.storage.artifacts.gcs.credentialsFile | default "" | quote }}
          anonymous: {{ .Values.storage.artifacts.gcs.anonymous }}
    orchestration:
      max_concurrent_flows: 10
      flow_execution_timeout: "30m"
      max_node_retries: 3
    messager:
      type: {{ .Values.messaging.type | quote }}
      mqtt:
        broker: "tcp://{{ include "flowgent.fullname" . }}-emqx:1883"
        client_id: "flowgent"
    lock:
      provider: {{ .Values.lock.provider | default (ternary "postgres" "memory" (eq (.Values.storage.type | default "SQLITE") "POSTGRE")) | quote }}
    notifier:
      enabled: {{ .Values.notifier.enabled }}
      scan_interval: {{ .Values.notifier.scanInterval | quote }}
      cleanup_interval: {{ .Values.notifier.cleanupInterval | quote }}
      route_timeout: {{ .Values.notifier.routeTimeout | quote }}
      secret_encryption:
        provider: {{ .Values.notifier.secretEncryption.provider | quote }}
        active_key_id: {{ .Values.notifier.secretEncryption.activeKeyId | quote }}
        keys:
          {{ .Values.notifier.secretEncryption.activeKeyId }}: "${FLOWGENT_NOTIFICATION_KEY_V1}"
    runtime:
      api_server_url: "http://{{ include "flowgent.fullname" . }}-apiserver:{{ .Values.apiserver.service.internalPort }}"
      resource_owner: {{ .Values.runtime.resourceOwner | default "flowgent" | quote }}
      system_namespace: {{ .Values.runtime.systemNamespace | default "flowgent-system" | quote }}
      k8s_namespace: {{ .Values.runtime.k8sNamespace | default .Release.Namespace | quote }}
      mode: "session"
      runtime_cluster_id: {{ .Values.runtime.session.clusterId | default "session" | quote }}
      session_cluster_id: {{ .Values.runtime.session.clusterId | default "session" | quote }}
      tm_orphan_timeout: {{ .Values.runtime.tmOrphanTimeout | default "3m" | quote }}
      credential_env_secret: {{ .Values.runtime.credentialEnvSecret | default "" | quote }}
      jm_image: "{{ include "flowgent.image" . }}"
      tm_image: "{{ include "flowgent.image" . }}"
      tm_deploy: {{ printf "%s-session-taskmanager" (include "flowgent.fullname" .) | quote }}
      sandbox_deploy: {{ printf "%s-session-sandbox" (include "flowgent.fullname" .) | quote }}
      tm_replicas: {{ .Values.runtime.session.taskmanager.replicas | default 1 }}
      tm_slots: {{ .Values.runtime.session.taskmanager.slots | default 4 }}
      jm_config_map: {{ printf "%s-config" (include "flowgent.fullname" .) | quote }}
      session:
        cluster_id: {{ .Values.runtime.session.clusterId | default "session" | quote }}
        jobmanager:
          resources:
            cpu: {{ .Values.runtime.session.jobmanager.resources.limits.cpu | default "500m" | quote }}
            memory: {{ .Values.runtime.session.jobmanager.resources.limits.memory | default "512Mi" | quote }}
        taskmanager:
          replicas: {{ .Values.runtime.session.taskmanager.replicas | default 1 }}
          slots: {{ .Values.runtime.session.taskmanager.slots | default 4 }}
          resources:
            cpu: {{ .Values.runtime.session.taskmanager.resources.limits.cpu | default "2" | quote }}
            memory: {{ .Values.runtime.session.taskmanager.resources.limits.memory | default "2Gi" | quote }}
        sandbox:
          min_replicas: {{ .Values.runtime.session.sandbox.minReplicas | default 0 }}
          max_replicas: {{ .Values.runtime.session.sandbox.maxReplicas | default 10 }}
          slots: {{ .Values.runtime.session.sandbox.slots | default 4 }}
          resources:
            cpu: {{ .Values.runtime.session.sandbox.resources.limits.cpu | default "2" | quote }}
            memory: {{ .Values.runtime.session.sandbox.resources.limits.memory | default "2Gi" | quote }}
      application:
        jobmanager:
          resources:
            cpu: {{ .Values.runtime.application.jobmanager.resources.limits.cpu | default "" | quote }}
            memory: {{ .Values.runtime.application.jobmanager.resources.limits.memory | default "" | quote }}
        taskmanager:
          replicas: {{ .Values.runtime.application.taskmanager.replicas | default 1 }}
          slots: {{ .Values.runtime.application.taskmanager.slots | default 4 }}
          resources:
            cpu: {{ .Values.runtime.application.taskmanager.resources.limits.cpu | default "" | quote }}
            memory: {{ .Values.runtime.application.taskmanager.resources.limits.memory | default "" | quote }}
        sandbox:
          min_replicas: {{ .Values.runtime.application.sandbox.minReplicas | default 0 }}
          max_replicas: {{ .Values.runtime.application.sandbox.maxReplicas | default 10 }}
          slots: {{ .Values.runtime.application.sandbox.slots | default 4 }}
          resources:
            cpu: {{ .Values.runtime.application.sandbox.resources.limits.cpu | default "" | quote }}
            memory: {{ .Values.runtime.application.sandbox.resources.limits.memory | default "" | quote }}
      namespace:
        default_namespace: {{ .Values.runtime.namespace.defaultNamespace | default "default" | quote }}
        namespace_prefix: {{ .Values.runtime.namespace.namespacePrefix | default "flowgent-" | quote }}
      credential_paths:
        base_path: {{ .Values.runtime.credentialPaths.basePath | default "/var/flowgent" | quote }}
    wallet:
      enabled: {{ .Values.wallet.enabled | default false }}
      transport: {{ .Values.wallet.transport | default "mqtt" | quote }}
      client_id_prefix: {{ .Values.wallet.clientIdPrefix | default "flowgent-" | quote }}
      key_id: {{ .Values.wallet.keyId | default "" | quote }}
      public_address: {{ .Values.wallet.publicAddress | default "" | quote }}
      sign_timeout: {{ .Values.wallet.signTimeout | default "30s" | quote }}
      local_socket: {{ .Values.wallet.localSocket | default "/run/wallet/wallet.sock" | quote }}
      policies:
        max_single_payment_usd: {{ .Values.wallet.policies.maxSinglePaymentUsd }}
        max_daily_budget_usd: {{ .Values.wallet.policies.maxDailyBudgetUsd }}
        allowed_domains: {{ .Values.wallet.policies.allowedDomains | toJson }}
        blocked_domains: {{ .Values.wallet.policies.blockedDomains | toJson }}
        require_human_approval_above_usd: {{ .Values.wallet.policies.requireHumanApprovalAboveUsd }}
        allowed_assets: {{ .Values.wallet.policies.allowedAssets | toJson }}
        allowed_chains: {{ .Values.wallet.policies.allowedChains | toJson }}
      x402:
        timeout: {{ .Values.wallet.httpTimeout | default "30s" | quote }}
    sandbox:
      workspace: {{ .Values.sandbox.workspace | default "/var/flowgent" | quote }}
      host_workspace: {{ .Values.sandbox.hostWorkspace | default "/mnt/disk1/flowgent/e2e" | quote }}
      policy:
        network:
          mode: {{ .Values.sandbox.policy.network.mode | default "none" | quote }}
        allowed_runtimes: {{ .Values.sandbox.policy.allowedRuntimes | toJson }}
        banned_commands: {{ .Values.sandbox.policy.bannedCommands | toJson }}
        default_timeout: {{ .Values.sandbox.policy.defaultTimeout | default "120s" | quote }}
        max_timeout: {{ .Values.sandbox.policy.maxTimeout | default "600s" | quote }}
      deployment:
        enabled: true
        image: "{{ include "flowgent.image" . }}"
        min_replicas: {{ .Values.sandbox.minReplicas | default 0 }}
        max_replicas: {{ .Values.sandbox.maxReplicas | default 10 }}
        resources:
          cpu: {{ .Values.sandbox.resources.limits.cpu | default "2" | quote }}
          memory: {{ .Values.sandbox.resources.limits.memory | default "2Gi" | quote }}
        slots_per_pod: {{ .Values.sandbox.slots | default 4 }}

  systemNamespace: "flowgent-system"
  k8sNamespace: ""
  tmOrphanTimeout: "3m"
  credentialEnvSecret: ""
  namespace:
    defaultNamespace: "default"
    namespacePrefix: "flowgent-"
  # Credential file paths mounted in pods (K8s Secrets).
  # Hierarchy: flow-level overrides namespace-level.
  credentialPaths:
    basePath: "/var/flowgent"

  # Session Runtime — Helm-deployed Flink-style shared runtime cluster.
  # Flows with runtime_mode=session are consumed by this JobManager and execute
  # only on TM/Sandbox pods carrying this clusterId.
  session:
    enabled: true
    clusterId: session
    serviceAccount:
      create: true
      name: ""
    rbac:
      create: true
    jobmanager:
      replicas: 1
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits:   { cpu: "500m", memory: "512Mi" }
    taskmanager:
      replicas: 1
      slots: 4
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
    sandbox:
      minReplicas: 0
      maxReplicas: 10
      slots: 4
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"

  # Application Runtime Defaults — per-FlowRun runtime clusters created by the
  # Controller. Flow YAML top-level resources may override only pod sizes.
  application:
    jobmanager:
      resources:
        limits:
          cpu: ""
          memory: ""
    taskmanager:
      replicas: 1
      slots: 4
      resources:
        limits:
          cpu: ""
          memory: ""
    sandbox:
      minReplicas: 0
      maxReplicas: 10
      slots: 4
      resources:
        limits:
          cpu: ""
          memory: ""

  # Secrets — runtime credential providers and K8s-native Secret env injection.
  secrets:
    serviceAccount:
      annotations: {}
      # iam.gke.io/gcp-service-account: "flowgent@PROJECT.iam.gserviceaccount.com"

    # AWS Secrets Manager via CSI Secret Store Driver.
    aws:
      enabled: false
      mountPath: "/var/flowgent"
      region: ""
      secrets: []
      # secrets:
      #   - objectName: "github-token"
      #     objectType: "secretsmanager"

    # GCP Secret Manager via CSI Secret Store Driver.
    gcp:
      enabled: false
      mountPath: "/var/flowgent"
      secrets: []
      # secrets:
      #   - resourceName: "projects/my-project/secrets/github-token/versions/latest"
      #     fileName: "github-token"

    # HashiCorp Vault via Vault Agent Injector (annotation-based, not CSI).
    vault:
      enabled: false
      # When true, Vault agent annotations are added to Deployment pod templates.
      # The Vault Injector webhook must be installed in the cluster.
      injectAnnotations: true
      vaultAddress: ""
      vaultRole: ""
      secrets: []
      # secrets:
      #   - secretPath: "secret/data/flowgent/github"
      #     secretKey: "token"
      #     fileName: "github-token"

    # Kubernetes native Secret env injection for engine pods
    # (apiserver, controller, jobmanager, taskmanager, sandbox, notifier, a2a).
    kubernetes:
      env: []
      # env:
      #   - name: "flowgent-llm-deepseek"
      #     optional: true
      #     mappings:
      #       - key: apikey
      #         env: DEEPSEEK_APIKEY
# ───────────────────────────────────────────────────────────────
# AuthGuard — opt-in enterprise authentication and authorization middleware.
# Keep enabled=false for ordinary Flowgent releases. Deploy the middleware as a
# separately managed release with application.enabled=false, or enable both in
# one designated E2E release. adapter.enabled lets an ordinary Flowgent release
# consume signed access context from that separate release without owning it.
# When both flags are false, repositories use the no-op FlowgentSqlScope.
# ───────────────────────────────────────────────────────────────
authguard-middleware:
  enabled: false
  adapter:
    enabled: false
    existingSecret: ""           # key must contain a random value of at least 32 bytes
    hmacKey: AUTHGUARD_ACCESS_CONTEXT_HMAC_KEY
    resource:
      partition: prod
      service: flowgent
      region: global
      tenant: example-corp
  envoy_gateway:
    enabled: true
    nameOverride: flowgent-envoy-gateway
    ext_authz:
      enabled: true
      gateway:
        create: true
        name: flowgent-authguard
        className: flowgent-authguard
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      authguardRoute:
        enabled: true
        name: flowgent-api
        hostnames: [flowgent.wl4g.com]
        backend:
          name: flowgent-apiserver
          port: 9999
      authnRoute:
        enabled: true
        name: flowgent-authn
        hostnames: [flowgent.wl4g.com]
  authguard:
    authn:
      enabled: true
      applications:
        flowgent:
          hosts: [flowgent.wl4g.com]
          displayName: Flowgent
          returnUris: [https://flowgent.wl4g.com/**]
    web:
      enabled: true
      route:
        enabled: true
        hostnames: [flowgent.wl4g.com]
        console:
          enabled: false
          hostnames: []
    authz:
      enabled: true
