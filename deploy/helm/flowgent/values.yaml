# ═══════════════════════════════════════════════════════════════
# Flowgent Helm Chart — Default Values
# ═══════════════════════════════════════════════════════════════

global:
  image:
    repository: registry.cn-shenzhen.aliyuncs.com/wl4g/flowgent
    tag: latest
    pullPolicy: IfNotPresent

# ═══════════════════════════════════════════════════════════════
# Middleware — enabled=true deploys as part of this chart.
# enabled=false uses existing external middleware via K8s Secret.
# ═══════════════════════════════════════════════════════════════

postgresql:
  enabled: false          # true = deploy PG in-cluster
  externalSecret: ""      # name of existing secret with key "url"
  # When enabled, the secret is auto-created. Internal only — no passwords here.

emqx:
  enabled: false           # true = deploy EMQX in-cluster
  externalSecret: ""       # name of existing secret with key "broker"

redis:
  enabled: false           # true = deploy Redis in-cluster
  externalSecret: ""       # name of existing secret with key "nodes"

# ═══════════════════════════════════════════════════════════════
# Jaeger — Distributed Tracing (OTEL Collector)
# ═══════════════════════════════════════════════════════════════
jaeger:
  enabled: true             # true = deploy Jaeger all-in-one in-cluster
  mode: all-in-one          # all-in-one | distributed (TODO)
  image: registry.cn-shenzhen.aliyuncs.com/wl4g/jaegertracing_all-in-one:1.76.0
  service:
    otlpGrpc: 4317
    otlpHttp: 4318
    ui: 16686
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Storage — persistent data backend
storage:
  type: SQLITE                 # SQLITE | POSTGRE

# ── Distributed Lock Provider ───────────────────────────────
lock:
  provider: memory              # memory | postgres | redis

# ── Inter-component Messaging (MQTT) ─────────────────────────
messaging:
  type: mqtt                     # mqtt | memory
  mqtt:
    broker: ""                   # set via FLOWGENT_MQTT_BROKER env or external secret

# ═══════════════════════════════════════════════════════════════
# API Server — [always] Multi-namespace REST Gateway
# ═══════════════════════════════════════════════════════════════
apiserver:
  enabled: true
  replicas: 2
  image: ""
  service:
    restPort: 9999
    mgmtPort: 9991
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  config:
    jwtAlgorithm: ES256
    jwtValidityAk: 3600
    jwtValidityRk: 86400
    anonymousPaths:
      - "/public/**"
      - "/static/**"
      - "/_/healthz/**"
      - "/a2a/**"

# ═══════════════════════════════════════════════════════════════
# A2A — [optional] Google Agent-to-Agent Protocol Server
# ═══════════════════════════════════════════════════════════════
a2a:
  enabled: false
  replicas: 2
  image: ""
  service:
    port: 9992
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# Controller — Distributed Sharded Flow Driver
# ═══════════════════════════════════════════════════════════════
controller:
  replicas: 2
  image: ""
  pollInterval: "10s"
  serviceAccount:
    create: true
    name: flowgent-controller
  rbac:
    create: true
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# Secrets — External K8s Secret references for credentials.
# extraSecrets injects env vars from K8s Secrets into all engine pods
# (taskmanager, sandbox, jobmanager). Each mapping extracts a key from
# the named Secret and exposes it as an env var.
# ═══════════════════════════════════════════════════════════════
secrets:
  extraSecrets: []
  # Example:
  # extraSecrets:
  #   - name: "flowgent-llm-deepseek"
  #     optional: true
  #     mappings:
  #       - key: apikey
  #         env: DEEPSEEK_APIKEY
  #   - name: "flowgent-github-token"
  #     optional: true
  #     mappings:
  #       - key: token
  #         env: GITHUB_TOKEN

# ═══════════════════════════════════════════════════════════════
# Credential Providers — CSI Secret Store Driver / Vault Injector
#
# GCP and AWS use the Kubernetes CSI Secret Store Driver
# (secrets-store.csi.k8s.io) with SecretProviderClass resources.
# Secrets are mounted at the specified mountPath and loaded by the
# Go config loader from {mountPath}/{namespace}/secret/.credentials.
#
# Vault uses the HashiCorp Vault Agent Injector (annotation-based).
# When vault.injectAnnotations=true, Vault annotations are added to
# Deployment pod templates; the Vault webhook injects init/sidecar
# containers that render secrets to files.
#
# Each provider uses a map structure because their configuration
# fields differ significantly.
# ═══════════════════════════════════════════════════════════════
credentialProviders:
  # Shared ServiceAccount annotations (e.g. workload identity for GCP)
  serviceAccount:
    annotations: {}
    # iam.gke.io/gcp-service-account: "flowgent@PROJECT.iam.gserviceaccount.com"

  # GCP Secret Manager via CSI Secret Store Driver
  gcp:
    enabled: false
    mountPath: "/var/flowgent"
    secrets: []
    # secrets:
    #   - resourceName: "projects/my-project/secrets/github-token/versions/latest"
    #     fileName: "github-token"

  # AWS Secrets Manager via CSI Secret Store Driver
  aws:
    enabled: false
    mountPath: "/var/flowgent"
    region: ""
    secrets: []
    # secrets:
    #   - objectName: "github-token"
    #     objectType: "secretsmanager"

  # HashiCorp Vault via Vault Agent Injector (annotation-based, not CSI)
  vault:
    enabled: false
    # When true, Vault agent annotations are added to Deployment pod templates.
    # The Vault Injector webhook must be installed in the cluster.
    injectAnnotations: true
    vaultAddress: ""
    vaultRole: ""
    secrets: []
    # secrets:
    #   - secretPath: "secret/data/flowgent/github"
    #     secretKey: "token"
    #     fileName: "github-token"

# ═══════════════════════════════════════════════════════════════
# Sandbox — Secure Script Execution Policy
#   Policy is used by TM for inline sandbox execution.
#   K8sRM manages sandbox pods independently in distributed mode.
# ═══════════════════════════════════════════════════════════════
sandbox:
  workspace: "/var/flowgent/workspace"
  slots: 4
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
  policy:
    network:
      mode: "none"
      allowed: []
      denied: []
    allowedRuntimes: [python3, bash, node]
    bannedCommands: []
    defaultTimeout: "120s"
    maxTimeout: "600s"

# ═══════════════════════════════════════════════════════════════
# Wallet — [optional] x402 Key Management & Payment Signing
#
# Master key is configured in flowgent.yaml under wallet.secret_store:
#   master_key_file  — path to a key file (e.g. K8s Secret mount).
#
# The K8s Secret auto-generated by Helm (wallet.autoGenerateKey)
# is mounted and referenced via master_key_file when enabled.
# ═══════════════════════════════════════════════════════════════
wallet:
  enabled: false
  replicas: 2
  image: ""
  service:
    port: 9901
  autoGenerateKey: true
  keyFile: "/var/secrets/flowgent/master.key"
  db: ""                # SQLite path (default: $HOME/.flowgent/wallet.db)
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }

# ═══════════════════════════════════════════════════════════════
# Notifier — [always] WS Push + Multi-Channel Notifier
# ═══════════════════════════════════════════════════════════════
notifier:
  enabled: true
  replicas: 2
  image: ""
  service:
    port: 9993
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ═══════════════════════════════════════════════════════════════
# Orchestration — runtime execution settings
# ═══════════════════════════════════════════════════════════════
orchestration:
  maxConcurrentFlows: 10
  flowExecutionTimeout: "30m"
  maxNodeRetries: 3

# ═══════════════════════════════════════════════════════════════
# Runtime — deploy-time operational parameters under runtime: in config.
# Includes namespace isolation, credential paths, and other runtime settings.
#
# namespacePrefix MUST match between the apiserver (Trigger routing) and the
# Controller (per-namespace JM Deployment namespace placement — every flow's
# dedicated JM Deployment lives in its namespace's shared K8s namespace,
# "{namespacePrefix}{namespaceID}") — see pkg/controller/pkg/controller.go
# applicationNamespace doc comment.
# ═══════════════════════════════════════════════════════════════
runtime:
  namespace:
    defaultNamespace: "default"
    namespacePrefix: "flowgent-"
  # Credential file paths mounted in pods (K8s Secrets).
  # Hierarchy: flow-level overrides namespace-level.
  credentialPaths:
    basePath: "/var/flowgent"
