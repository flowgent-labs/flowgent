{{- if .Values.apiserver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-apiserver
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  replicas: {{ .Values.apiserver.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: apiserver
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: apiserver
{{ if and .Values.credentialProviders.vault.enabled .Values.credentialProviders.vault.injectAnnotations }}
      annotations:
        {{- include "flowgent.vaultAnnotations" . | nindent 8 }}
{{ end }}
    spec:
      containers:
        - name: apiserver
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args: ["apiserver", "start", "-c", "/etc/flowgent/flowgent.yaml"]
          ports:
            - name: rest
              containerPort: {{ .Values.apiserver.service.restPort }}
            - name: mgmt
              containerPort: {{ .Values.apiserver.service.mgmtPort }}
          env:
            {{- include "flowgent.internalEnv" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
{{ if or .Values.credentialProviders.gcp.enabled .Values.credentialProviders.aws.enabled }}
            {{- include "flowgent.credentialVolumeMounts" . | nindent 12 }}
{{ end }}
          resources:
            {{- toYaml .Values.apiserver.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /_/healthz
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
{{ if or .Values.credentialProviders.gcp.enabled .Values.credentialProviders.aws.enabled }}
        {{- include "flowgent.credentialVolumes" . | nindent 8 }}
{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowgent.fullname" . }}-apiserver
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  selector:
    {{- include "flowgent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
  ports:
    - name: rest
      port: {{ .Values.apiserver.service.restPort }}
    - name: mgmt
      port: {{ .Values.apiserver.service.mgmtPort }}
{{- end }}
