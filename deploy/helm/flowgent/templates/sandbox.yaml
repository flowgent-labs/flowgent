{{- if .Values.sandbox.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flowgent.fullname" . }}-sandbox-workspace
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: {{ .Values.sandbox.workspaceSize | default "10Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-sandbox
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  replicas: {{ .Values.sandbox.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sandbox
    spec:
      containers:
        - name: sandbox
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args: ["sandbox", "start"]
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowgent.pgSecretName" . }}
                  key: url
            - name: FLOWGENT_MQTT_BROKER
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowgent.mqttSecretName" . }}
                  key: broker
                  optional: true
            - name: FLOWGENT_CONFIG_FILE
              value: /etc/flowgent/flowgent.yaml
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # ── Credential injection for sandbox scripts ──
            - name: NEXUS3_URL
              value: {{ .Values.sandbox.credentials.nexus3.url | default "http://nexus3:8081" | quote }}
            - name: NEXUS3_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sandbox.credentials.nexus3.secret | default "nexus3-creds" }}
                  key: username
                  optional: true
            - name: NEXUS3_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sandbox.credentials.nexus3.secret | default "nexus3-creds" }}
                  key: password
                  optional: true
            - name: SONATYPEIQ_URL
              value: {{ .Values.sandbox.credentials.sonatypeiq.url | default "http://sonatypeiq:8070" | quote }}
            - name: SONATYPEIQ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sandbox.credentials.sonatypeiq.secret | default "iq-creds" }}
                  key: username
                  optional: true
            - name: SONATYPEIQ_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sandbox.credentials.sonatypeiq.secret | default "iq-creds" }}
                  key: password
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
            - name: sandbox-workspace
              mountPath: {{ .Values.sandbox.workspace }}
          resources:
            {{- toYaml .Values.sandbox.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
        - name: sandbox-workspace
          persistentVolumeClaim:
            claimName: {{ include "flowgent.fullname" . }}-sandbox-workspace
{{- end }}
