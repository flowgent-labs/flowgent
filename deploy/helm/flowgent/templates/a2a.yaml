{{- if .Values.application.enabled }}
{{- if .Values.a2a.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-a2a
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
{{ if and .Values.runtime.secrets.vault.enabled .Values.runtime.secrets.vault.injectAnnotations }}
      annotations:
        {{- include "flowgent.vaultAnnotations" . | nindent 8 }}
{{ end }}
    spec:
      containers:
        - name: a2a
          image: {{ include "flowgent.image" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args: ["a2a", "start", "-c", "/etc/flowgent/flowgent.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.port }}
          env:
            {{- include "flowgent.internalEnv" . | nindent 12 }}
            {{- include "flowgent.authguardAdapterEnv" . | nindent 12 }}
            - name: FLOWGENT__CONFIG__FILE
              value: /etc/flowgent/flowgent.yaml
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
{{ if or .Values.runtime.secrets.gcp.enabled .Values.runtime.secrets.aws.enabled }}
            {{- include "flowgent.credentialVolumeMounts" . | nindent 12 }}
{{ end }}
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /_/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
{{ if or .Values.runtime.secrets.gcp.enabled .Values.runtime.secrets.aws.enabled }}
        {{- include "flowgent.credentialVolumes" . | nindent 8 }}
{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowgent.fullname" . }}-a2a
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  type: {{ .Values.a2a.service.type | default "ClusterIP" }}
  selector:
    {{- include "flowgent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  ports:
    - name: http
      port: {{ .Values.a2a.service.port }}
      targetPort: http
{{- if and (eq (.Values.a2a.service.type | default "ClusterIP") "NodePort") .Values.a2a.service.nodePort }}
      nodePort: {{ .Values.a2a.service.nodePort }}
{{- end }}
{{- end }}
{{- end }}
