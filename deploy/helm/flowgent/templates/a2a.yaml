{{- if .Values.a2a.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-a2a
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      containers:
        - name: a2a
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args: ["a2a", "start", "-c", "/etc/flowgent/flowgent.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.port }}
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowgent.fullname" . }}-pg
                  key: url
            - name: FLOWGENT_CONFIG_FILE
              value: /etc/flowgent/flowgent.yaml
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /_/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowgent.fullname" . }}-a2a
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  selector:
    {{- include "flowgent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
  ports:
    - name: http
      port: {{ .Values.a2a.service.port }}
{{- end }}
