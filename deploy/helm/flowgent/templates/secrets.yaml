{{/*
Secrets — Conditionally created when middleware is deployed in-cluster.
When postgresql.enabled=false, the secret must exist externally (see NOTES.txt).
*/}}
---
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowgent.fullname" . }}-pg
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ include "flowgent.databaseUrl" . | quote }}
{{- end }}
---
{{- if not .Values.notifier.secretEncryption.existingSecret }}
{{- $secretName := include "flowgent.notificationSecretName" . }}
{{- $keyName := .Values.notifier.secretEncryption.keyName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $keyName }}: {{ if and $existing (hasKey $existing.data $keyName) }}{{ index $existing.data $keyName | b64dec | quote }}{{ else }}{{ randBytes 32 | quote }}{{ end }}
{{- end }}
---
{{- if not .Values.authorization.existingSecret }}
{{- $secretName := include "flowgent.authorizationSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.authorization.bootstrapKey }}: {{ if and $existing (hasKey $existing.data .Values.authorization.bootstrapKey) }}{{ index $existing.data .Values.authorization.bootstrapKey | b64dec | quote }}{{ else }}{{ randBytes 32 | quote }}{{ end }}
  {{ .Values.authorization.controllerKey }}: {{ if and $existing (hasKey $existing.data .Values.authorization.controllerKey) }}{{ index $existing.data .Values.authorization.controllerKey | b64dec | quote }}{{ else }}{{ randBytes 32 | quote }}{{ end }}
  {{ .Values.authorization.notifierKey }}: {{ if and $existing (hasKey $existing.data .Values.authorization.notifierKey) }}{{ index $existing.data .Values.authorization.notifierKey | b64dec | quote }}{{ else }}{{ randBytes 32 | quote }}{{ end }}
  {{ .Values.authorization.a2aKey }}: {{ if and $existing (hasKey $existing.data .Values.authorization.a2aKey) }}{{ index $existing.data .Values.authorization.a2aKey | b64dec | quote }}{{ else }}{{ randBytes 32 | quote }}{{ end }}
{{- end }}
---
{{- if not .Values.authorization.runtimeExistingSecret }}
{{- $secretName := include "flowgent.runtimeAuthorizationSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.authorization.jobmanagerKey }}: {{ if and $existing (hasKey $existing.data .Values.authorization.jobmanagerKey) }}{{ index $existing.data .Values.authorization.jobmanagerKey | b64dec | quote }}{{ else }}{{ randBytes 32 | quote }}{{ end }}
  {{ .Values.authorization.taskmanagerKey }}: {{ if and $existing (hasKey $existing.data .Values.authorization.taskmanagerKey) }}{{ index $existing.data .Values.authorization.taskmanagerKey | b64dec | quote }}{{ else }}{{ randBytes 32 | quote }}{{ end }}
{{- end }}
---
{{- if .Values.emqx.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowgent.fullname" . }}-mqtt
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  broker: {{ include "flowgent.mqttBroker" . | quote }}
{{- end }}
---
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowgent.fullname" . }}-redis
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ randAlphaNum 16 | quote }}
  nodes: {{ printf "%s-redis:6379" (include "flowgent.fullname" .) | quote }}
{{- end }}
---
