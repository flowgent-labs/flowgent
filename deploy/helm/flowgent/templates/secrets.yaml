{{/*
Secrets — Conditionally created when middleware is deployed in-cluster.
When postgresql.enabled=false, the secret must exist externally (see NOTES.txt).
*/}}
---
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowgent.fullname" . }}-pg
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ include "flowgent.databaseUrl" . | quote }}
{{- end }}
---
{{- if .Values.emqx.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowgent.fullname" . }}-mqtt
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  broker: {{ include "flowgent.mqttBroker" . | quote }}
{{- end }}
---
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowgent.fullname" . }}-redis
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ randAlphaNum 16 | quote }}
  nodes: {{ printf "%s-redis:6379" (include "flowgent.fullname" .) | quote }}
{{- end }}
---
{{- if .Values.wallet.autoGenerateKey }}
{{- $generatedKey := include "flowgent.generateWalletKey" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowgent.fullname" . }}-wallet-key
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  master.key: {{ $generatedKey }}
{{- end }}
