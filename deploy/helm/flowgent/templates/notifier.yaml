{{- if .Values.notifier.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-notifier
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifier
spec:
  replicas: {{ .Values.notifier.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notifier
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notifier
    spec:
      containers:
        - name: notifier
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args: ["notifier", "start"]
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowgent.pgSecretName" . }}
                  key: url
            - name: FLOWGENT_MQTT_BROKER
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowgent.mqttSecretName" . }}
                  key: broker
                  optional: true
            - name: FLOWGENT_CONFIG_FILE
              value: /etc/flowgent/flowgent.yaml
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
            {{- if eq .Values.global.mode "session" }}
            - name: workspace
              mountPath: /var/flowgent/workspace
            {{- end }}
          ports:
            - name: ws
              containerPort: {{ .Values.notifier.service.port }}
          resources:
            {{- toYaml .Values.notifier.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
        {{- if eq .Values.global.mode "session" }}
        - name: workspace
          hostPath:
            path: {{ .Values.taskmanager.sandbox.workspace }}
            type: DirectoryOrCreate
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowgent.fullname" . }}-notifier
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifier
spec:
  selector:
    {{- include "flowgent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notifier
  ports:
    - name: ws
      port: {{ .Values.notifier.service.port }}
{{- end }}
