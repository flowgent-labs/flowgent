{{- if .Values.notifier.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-notifier
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifier
spec:
  replicas: {{ .Values.notifier.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notifier
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notifier
{{ if and .Values.credentialProviders.vault.enabled .Values.credentialProviders.vault.injectAnnotations }}
      annotations:
        {{- include "flowgent.vaultAnnotations" . | nindent 8 }}
{{ end }}
    spec:
      containers:
        - name: notifier
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args: ["notifier", "start"]
          env:
            {{- include "flowgent.internalEnv" . | nindent 12 }}
            - name: FLOWGENT__CONFIG__FILE
              value: /etc/flowgent/flowgent.yaml
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
            {{- if eq .Values.global.mode "session" }}
            - name: workspace
              mountPath: /var/flowgent/workspace
            {{- end }}
{{ if or .Values.credentialProviders.gcp.enabled .Values.credentialProviders.aws.enabled }}
            {{- include "flowgent.credentialVolumeMounts" . | nindent 12 }}
{{ end }}
          ports:
            - name: ws
              containerPort: {{ .Values.notifier.service.port }}
          resources:
            {{- toYaml .Values.notifier.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
        {{- if eq .Values.global.mode "session" }}
        - name: workspace
          hostPath:
            path: {{ .Values.sandbox.workspace | default "/var/flowgent/workspace" }}
            type: DirectoryOrCreate
        {{- end }}
{{ if or .Values.credentialProviders.gcp.enabled .Values.credentialProviders.aws.enabled }}
        {{- include "flowgent.credentialVolumes" . | nindent 8 }}
{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowgent.fullname" . }}-notifier
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifier
spec:
  selector:
    {{- include "flowgent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notifier
  ports:
    - name: ws
      port: {{ .Values.notifier.service.port }}
{{- end }}
