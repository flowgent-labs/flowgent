{{- if .Values.wallet.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-wallet
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: wallet
spec:
  replicas: {{ .Values.wallet.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wallet
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: wallet
{{ if and .Values.credentialProviders.vault.enabled .Values.credentialProviders.vault.injectAnnotations }}
      annotations:
        {{- include "flowgent.vaultAnnotations" . | nindent 8 }}
{{ end }}
    spec:
      containers:
        - name: wallet
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args:
            - "wallet"
            - "start"
            - "-c"
            - "/etc/flowgent/flowgent.yaml"
            - "--listen"
            - "0.0.0.0:{{ .Values.wallet.service.port }}"
            {{- if .Values.wallet.db }}
            - "--db"
            - {{ .Values.wallet.db | quote }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.wallet.service.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
            {{- if and .Values.wallet.autoGenerateKey .Values.wallet.keyFile }}
            - name: master-key
              mountPath: {{ dir .Values.wallet.keyFile }}
              readOnly: true
            {{- end }}
            - name: wallet-data
              mountPath: /tmp/wallet
{{ if or .Values.credentialProviders.gcp.enabled .Values.credentialProviders.aws.enabled }}
            {{- include "flowgent.credentialVolumeMounts" . | nindent 12 }}
{{ end }}
          env:
            - name: HOME
              value: /tmp/wallet
            {{- include "flowgent.extraSecretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.wallet.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
        {{- if and .Values.wallet.autoGenerateKey .Values.wallet.keyFile }}
        - name: master-key
          secret:
            secretName: {{ include "flowgent.fullname" . }}-wallet-key
        {{- end }}
        - name: wallet-data
          emptyDir: {}
{{ if or .Values.credentialProviders.gcp.enabled .Values.credentialProviders.aws.enabled }}
        {{- include "flowgent.credentialVolumes" . | nindent 8 }}
{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowgent.fullname" . }}-wallet
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: wallet
spec:
  selector:
    {{- include "flowgent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: wallet
  ports:
    - name: api
      port: {{ .Values.wallet.service.port }}
{{- end }}
