{{- if .Values.redis.enabled }}
{{- $name := printf "%s-redis" (include "flowgent.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := randAlphaNum 32 }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
stringData:
  password: {{ $password | quote }}
  nodes: {{ printf "redis://%s-0.%s:6379,redis://%s-1.%s:6379,redis://%s-2.%s:6379" $name $name $name $name $name $name | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: {{ $name }}}
  ports:
    - {name: redis, port: 6379}
    - {name: cluster, port: 16379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
spec:
  podManagementPolicy: Parallel
  serviceName: {{ $name }}
  replicas: 3
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              if [[ "$HOSTNAME" == *-0 ]]; then export REDIS_CLUSTER_CREATOR=yes; fi
              exec /opt/bitnami/scripts/redis-cluster/entrypoint.sh /opt/bitnami/scripts/redis-cluster/run.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $name }}, key: password}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: {{ $name }}, key: password}
            - name: REDIS_NODES
              value: {{ printf "%s-0.%s %s-1.%s %s-2.%s" $name $name $name $name $name $name | quote }}
            - {name: REDIS_CLUSTER_REPLICAS, value: "0"}
            - {name: REDIS_CLUSTER_DYNAMIC_IPS, value: "yes"}
          ports:
            - {name: redis, containerPort: 6379}
            - {name: cluster, containerPort: 16379}
          readinessProbe:
            exec:
              command: ["/bin/bash", "-ec", "redis-cli ping | grep -q PONG"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /bitnami/redis/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
{{- end }}
