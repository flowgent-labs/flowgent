{{- if .Values.application.enabled }}
{{- /* GCP Secret Manager CSI SecretProviderClass */ -}}
{{- if .Values.runtime.secrets.gcp.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "flowgent.fullname" . }}-gcp-secrets
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-provider
spec:
  provider: gcp
  parameters:
    secrets: |
{{- range .Values.runtime.secrets.gcp.secrets }}
      - resourceName: {{ .resourceName | quote }}
        fileName: {{ .fileName | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- /* AWS Secrets Manager CSI SecretProviderClass */ -}}
{{- if .Values.runtime.secrets.aws.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "flowgent.fullname" . }}-aws-secrets
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-provider
spec:
  provider: aws
  parameters:
    region: {{ .Values.runtime.secrets.aws.region | quote }}
    objects: |
{{- range .Values.runtime.secrets.aws.secrets }}
      - objectName: {{ .objectName | quote }}
        objectType: {{ .objectType | quote }}
{{- end }}
{{- end }}
