{{- if .Values.application.enabled }}
{{- if .Values.jaeger.enabled }}
{{- if eq .Values.jaeger.mode "all-in-one" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowgent.fullname" . }}-jaeger
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  ports:
    - name: otlp-grpc
      port: {{ .Values.jaeger.service.otlpGrpc }}
    - name: otlp-http
      port: {{ .Values.jaeger.service.otlpHttp }}
    - name: ui
      port: {{ .Values.jaeger.service.ui }}
  selector:
    app.kubernetes.io/component: jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-jaeger
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/component: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.jaeger.image | quote }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: {{ .Values.jaeger.service.otlpGrpc }}
              name: otlp-grpc
            - containerPort: {{ .Values.jaeger.service.otlpHttp }}
              name: otlp-http
            - containerPort: {{ .Values.jaeger.service.ui }}
              name: ui
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
