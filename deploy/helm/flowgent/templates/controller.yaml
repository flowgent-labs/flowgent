{{- if .Values.controller.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccount.name }}
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
  annotations:
    {{- include "flowgent.credentialServiceAccountAnnotations" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.controller.serviceAccount.name }}
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.controller.serviceAccount.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.controller.serviceAccount.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
# Dedicated per-flow JM Deployments (Application mode) land in their
# tenant's namespace (flowgent-{tenantID} — every flow of the same tenant
# shares one namespace), so the Controller needs a ClusterRole to
# create/list/delete Deployments across namespaces (buildJMDeployment /
# gcOrphanedJMDeployments in pkg/controller), plus get/create on namespaces
# themselves — ensureApplicationInfra lazily creates the tenant namespace on
# first dispatch of any of its flows, since Helm does not pre-create it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.controller.serviceAccount.name }}-cluster
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.controller.serviceAccount.name }}-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.controller.serviceAccount.name }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-controller
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
{{ if and .Values.credentialProviders.vault.enabled .Values.credentialProviders.vault.injectAnnotations }}
      annotations:
        {{- include "flowgent.vaultAnnotations" . | nindent 8 }}
{{ end }}
    spec:
      serviceAccountName: {{ .Values.controller.serviceAccount.name }}
      containers:
        - name: controller
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args: ["controller", "start", "-c", "/etc/flowgent/flowgent.yaml"]
          env:
            {{- include "flowgent.internalEnv" . | nindent 12 }}
            - name: FLOWGENT__RUNTIME__CONTROLLER_LABEL
              value: "app.kubernetes.io/component=controller"
            - name: FLOWGENT__RUNTIME__JM_IMAGE
              value: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
            - name: FLOWGENT__RUNTIME__JM_CONFIG_MAP
              value: "{{ include "flowgent.fullname" . }}-config"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
{{ if or .Values.credentialProviders.gcp.enabled .Values.credentialProviders.aws.enabled }}
            {{- include "flowgent.credentialVolumeMounts" . | nindent 12 }}
{{ end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
{{ if or .Values.credentialProviders.gcp.enabled .Values.credentialProviders.aws.enabled }}
        {{- include "flowgent.credentialVolumes" . | nindent 8 }}
{{ end }}
