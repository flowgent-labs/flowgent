{{- /* Shared ServiceAccount for credential provider workload identity.
  Created when credentialProviders are enabled and controller RBAC is active.
  Controller SA is created in controller.yaml with its own RBAC.
  This SA provides workload identity for other engine components. */ -}}
{{- if or .Values.credentialProviders.gcp.enabled .Values.credentialProviders.aws.enabled .Values.credentialProviders.vault.enabled }}
{{- if .Values.controller.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flowgent.fullname" . }}-engine
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
  annotations:
    {{- include "flowgent.credentialServiceAccountAnnotations" . | nindent 4 }}
{{- end }}
{{- end }}
