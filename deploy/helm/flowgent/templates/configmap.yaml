apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flowgent.fullname" . }}-config
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
data:
  flowgent.yaml: |
    service-name: {{ include "flowgent.name" . }}
    server:
      host: "0.0.0.0"
      port: {{ .Values.apiserver.service.restPort }}
      shutdown-timeout: "15s"
    a2a:
      enabled: {{ .Values.a2a.enabled }}
      host: "0.0.0.0"
      port: {{ .Values.a2a.service.port }}
    mgmt:
      enabled: true
      host: "0.0.0.0"
      port: {{ .Values.apiserver.service.mgmtPort }}
      pprof: { enabled: true, server-bind: "0.0.0.0:6669" }
      otel:
        enabled: true
        endpoint: "{{ include "flowgent.fullname" . }}-jaeger:{{ .Values.jaeger.service.otlpHttp }}"
        protocol: "http"
        sample_rate: 1.0
      metrics: { enabled: false }
    logging:
      mode: JSON
      level: DEBUG
    auth:
      jwt-validity-ak: {{ .Values.apiserver.config.jwtValidityAk }}
      jwt-validity-rk: {{ .Values.apiserver.config.jwtValidityRk }}
      jwt-algorithm: {{ .Values.apiserver.config.jwtAlgorithm }}
      anonymous-paths:
        {{- range .Values.apiserver.config.anonymousPaths }}
        - {{ . | quote }}
        {{- end }}
    cache:
      provider: Memory
      memory:
        initial-capacity: 32
        max-capacity: 65535
        ttl: 3600000
        eviction-policy: LRU
    storage:
      type: {{ .Values.storage.type | default "SQLITE" | quote }}
      {{- if eq (.Values.storage.type | default "SQLITE") "SQLITE" }}
      sqlite:
        dir: .flowgent/sqlite
      {{- end }}
    {{- if .Values.postgresql.enabled }}
      postgres:
        host: "{{ include "flowgent.fullname" . }}-postgresql"
        port: 5432
        database: flowgent
        username: flowgent
        password: flowgent
        min-connections: 2
        max-connections: 20
    {{- end }}
    orchestration:
      max-concurrent-flows: {{ .Values.orchestration.maxConcurrentFlows | default 10 }}
      flow-execution-timeout: {{ .Values.orchestration.flowExecutionTimeout | default "30m" | quote }}
      max-node-retries: {{ .Values.orchestration.maxNodeRetries | default 3 }}
    messager:
      type: {{ .Values.messaging.type | quote }}
      mqtt:
        broker: "tcp://{{ include "flowgent.fullname" . }}-emqx:1883"
        client_id: "flowgent"
    lock:
      provider: {{ .Values.lock.provider | default "memory" | quote }}
    notifier:
      enabled: {{ .Values.notifier.enabled }}
    credential-paths:
      base-path: {{ .Values.global.credentialPaths.basePath | default "/var/flowgent" | quote }}
    wallet:
      enabled: {{ .Values.wallet.enabled | default false }}
      secret_store:
        provider: default
        master_key_file: {{ .Values.wallet.keyFile | default "/var/secrets/flowgent/master.key" | quote }}
    sandbox:
      workspace: {{ .Values.sandbox.workspace | default "/var/flowgent/workspace" | quote }}
      policy:
        network:
          mode: {{ .Values.sandbox.policy.network.mode | default "none" | quote }}
        allowed_runtimes: {{ .Values.sandbox.policy.allowedRuntimes | toJson }}
        banned_commands: {{ .Values.sandbox.policy.bannedCommands | toJson }}
        default_timeout: {{ .Values.sandbox.policy.defaultTimeout | default "120s" | quote }}
        max_timeout: {{ .Values.sandbox.policy.maxTimeout | default "600s" | quote }}
      deployment:
        enabled: true
        min_replicas: {{ .Values.sandbox.replicas | default 2 }}
        max_replicas: {{ add (.Values.sandbox.replicas | default 2) 5 }}
        resources:
          cpu: {{ .Values.sandbox.resources.limits.cpu | default "2" | quote }}
          memory: {{ .Values.sandbox.resources.limits.memory | default "2Gi" | quote }}
        slots_per_pod: {{ .Values.sandbox.slots | default 4 }}
