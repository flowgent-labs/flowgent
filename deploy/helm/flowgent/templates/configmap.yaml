apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flowgent.fullname" . }}-config
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
data:
  flowgent.yaml: |
    service-name: {{ include "flowgent.name" . }}
    deployment:
      mode: {{ .Values.global.mode | quote }}
    server:
      host: "0.0.0.0"
      port: {{ .Values.apiserver.service.restPort }}
      shutdown-timeout: "15s"
    a2a:
      enabled: {{ .Values.a2a.enabled }}
      host: "0.0.0.0"
      port: {{ .Values.a2a.service.port }}
    mgmt:
      enabled: true
      host: "0.0.0.0"
      port: {{ .Values.apiserver.service.mgmtPort }}
      pprof: { enabled: true, server-bind: "0.0.0.0:6669" }
      otel:
        enabled: true
        endpoint: "{{ include "flowgent.fullname" . }}-jaeger:{{ .Values.jaeger.service.otlpHttp }}"
        protocol: "http"
        sample_rate: 1.0
      metrics: { enabled: false }
    logging:
      mode: JSON
      level: DEBUG
    auth:
      jwt-validity-ak: {{ .Values.apiserver.config.jwtValidityAk }}
      jwt-validity-rk: {{ .Values.apiserver.config.jwtValidityRk }}
      jwt-algorithm: {{ .Values.apiserver.config.jwtAlgorithm }}
      anonymous-paths:
        {{- range .Values.apiserver.config.anonymousPaths }}
        - {{ . | quote }}
        {{- end }}
    cache:
      provider: Memory
      memory:
        initial-capacity: 32
        max-capacity: 65535
        ttl: 3600000
        eviction-policy: LRU
    storage:
      type: POSTGRE
    {{- if .Values.postgresql.enabled }}
      postgres:
        host: "{{ include "flowgent.fullname" . }}-postgresql"
        port: 5432
        database: flowgent
        username: flowgent
        password: flowgent
        min-connections: 2
        max-connections: 20
    {{- end }}
    llm:
      request-timeout: "120s"
      providers: {}
    orchestration:
      max-concurrent-flows: 10
      flow-execution-timeout: "30m"
      max-node-retries: 3
      mcps: []
      agents:
        static: { enabled: false }
        standard: { enabled: true }
      skills:
        static: { enabled: false }
        standard: { enabled: false }
      agentflows:
        static: { enabled: false }
        standard: { enabled: true }
    messaging:
      type: {{ .Values.queue.type | quote }}
      mqtt:
        broker: "tcp://{{ include "flowgent.fullname" . }}-emqx:1883"
        topic_prefix: {{ .Values.queue.topicPrefix | quote }}
    lock:
      provider: postgres
    notifier:
      enabled: {{ .Values.notifier.enabled }}
      {{- if .Values.notifier.channels }}
      channels:
        {{- toYaml .Values.notifier.channels | nindent 8 }}
      {{- end }}
    credential-paths:
      base-path: {{ .Values.global.credentialPaths.basePath | default "/var/secret/flowgent" | quote }}
    sandbox:
      workspace: {{ .Values.taskmanager.sandbox.workspace | default "/var/flowgent/workspace" | quote }}
      policy:
        network:
          mode: {{ .Values.taskmanager.sandbox.policy.network.mode | default "none" | quote }}
        allowed_runtimes: {{ .Values.taskmanager.sandbox.policy.allowedRuntimes | toJson }}
        banned_commands: {{ .Values.taskmanager.sandbox.policy.bannedCommands | toJson }}
        default_timeout: {{ .Values.taskmanager.sandbox.policy.defaultTimeout | default "120s" | quote }}
        max_timeout: {{ .Values.taskmanager.sandbox.policy.maxTimeout | default "600s" | quote }}
