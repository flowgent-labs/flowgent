{{- if .Values.application.enabled }}
{{- $flowgentConfig := index .Values.runtime "flowgent-config" | default "" -}}
{{- if not $flowgentConfig -}}
{{- fail "runtime.flowgent-config must contain the full flowgent.yaml content" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flowgent.fullname" . }}-config
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
data:
  flowgent.yaml: |
{{ tpl $flowgentConfig . | nindent 4 }}
{{- end }}
