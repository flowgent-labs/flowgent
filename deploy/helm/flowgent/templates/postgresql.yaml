{{- if .Values.postgresql.enabled }}
{{- $pg := .Values.postgresql }}
{{- $name := $pg.name | default (printf "%s-postgresql" (include "flowgent.fullname" .)) }}
{{- $ns := $pg.namespace | default .Release.Namespace }}
{{- $labels := merge (dict "app.kubernetes.io/instance" $name "app.kubernetes.io/component" "postgresql") ($pg.labels | default dict) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | toJson }}
  namespace: {{ $ns | toJson }}
  labels: {{ $labels | toJson }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $pg.username | toJson }}
  POSTGRES_PASSWORD: {{ $pg.password | toJson }}
  POSTGRES_DB: {{ $pg.database | toJson }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | toJson }}
  namespace: {{ $ns | toJson }}
  labels: {{ $labels | toJson }}
spec:
  type: {{ $pg.service.type }}
  selector:
    app.kubernetes.io/instance: {{ $name | toJson }}
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    {{- if eq $pg.service.type "NodePort" }}
    nodePort: {{ $pg.service.nodePort }}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name | toJson }}
  namespace: {{ $ns | toJson }}
  labels: {{ $labels | toJson }}
spec:
  serviceName: {{ $name | toJson }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $name | toJson }}
  template:
    metadata:
      labels: {{ $labels | toJson }}
    spec:
      containers:
      - name: postgres
        image: {{ $pg.containerImage | toJson }}
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: {{ $name | toJson }}
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        # Initdb and crash recovery must finish before liveness can restart PG.
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 100
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 5
          periodSeconds: 3
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 750m
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
      labels: {{ $labels | toJson }}
    spec:
      {{- with $pg.persistence.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ $pg.persistence.size }}
{{- end }}
