{{- if eq .Values.global.mode "session" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-taskmanager
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: taskmanager
spec:
  replicas: {{ .Values.taskmanager.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: taskmanager
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args: ["taskmanager", "start", "-c", "/etc/flowgent/flowgent.yaml"]
          env:
            {{- include "flowgent.internalEnv" . | nindent 12 }}
            - name: FLOWGENT__TM__SLOTS
              value: {{ .Values.taskmanager.slots | quote }}
            - name: FLOWGENT__SANDBOX__WORKSPACE
              value: {{ .Values.sandbox.workspace | default "/var/flowgent/workspace" | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "flowgent.extraSecretEnv" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
            - name: sandbox-workspace
              mountPath: {{ .Values.sandbox.workspace | default "/var/flowgent/workspace" }}
          resources:
            {{- toYaml .Values.taskmanager.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
        - name: sandbox-workspace
          emptyDir: {}
{{- end }}
