{{- if eq .Values.global.mode "session" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flowgent.fullname" . }}-sandbox-workspace
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: taskmanager
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: {{ .Values.taskmanager.workspaceSize | default "10Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowgent.fullname" . }}-taskmanager
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
    app.kubernetes.io/component: taskmanager
spec:
  replicas: {{ .Values.taskmanager.replicas }}
  selector:
    matchLabels:
      {{- include "flowgent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: taskmanager
  template:
    metadata:
      labels:
        {{- include "flowgent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/app/flowgent"]
          args: ["taskmanager", "start", "-c", "/etc/flowgent/flowgent.yaml"]
          env:
            - name: FLOWGENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowgent.pgSecretName" . }}
                  key: url
            - name: FLOWGENT_MQTT_BROKER
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowgent.mqttSecretName" . }}
                  key: broker
                  optional: true
            - name: FLOWGENT_TM_SLOTS
              value: {{ .Values.taskmanager.slots | quote }}
            - name: FLOWGENT_SANDBOX_WORKSPACE
              value: {{ .Values.taskmanager.workspace | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # ── Credential injection for inline sandbox scripts ──
            - name: NEXUS3_URL
              value: {{ .Values.taskmanager.credentials.nexus3.url | default "http://nexus3:8081" | quote }}
            - name: NEXUS3_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskmanager.credentials.nexus3.secret | default "nexus3-creds" }}
                  key: username
                  optional: true
            - name: NEXUS3_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskmanager.credentials.nexus3.secret | default "nexus3-creds" }}
                  key: password
                  optional: true
            - name: SONATYPEIQ_URL
              value: {{ .Values.taskmanager.credentials.sonatypeiq.url | default "http://sonatypeiq:8070" | quote }}
            - name: SONATYPEIQ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskmanager.credentials.sonatypeiq.secret | default "iq-creds" }}
                  key: username
                  optional: true
            - name: SONATYPEIQ_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskmanager.credentials.sonatypeiq.secret | default "iq-creds" }}
                  key: password
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/flowgent
            - name: sandbox-workspace
              mountPath: {{ .Values.taskmanager.workspace }}
          resources:
            {{- toYaml .Values.taskmanager.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flowgent.fullname" . }}-config
        - name: sandbox-workspace
          persistentVolumeClaim:
            claimName: {{ include "flowgent.fullname" . }}-sandbox-workspace
{{- end }}
