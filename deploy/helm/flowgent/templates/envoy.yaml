{{- if and .Values.application.enabled .Values.envoy.enabled (not (index .Values "authguard-middleware").enabled) (not (index .Values "authguard-middleware").adapter.enabled) }}
{{- $name := printf "%s-envoy" (include "flowgent.fullname" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: http
        address:
          socket_address: {address: 0.0.0.0, port_value: 8080}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: flowgent
              route_config:
                name: flowgent
                virtual_hosts:
                - name: flowgent
                  domains: ["*"]
                  routes:
                  - match: {prefix: /api/}
                    route: {cluster: api}
                  - match: {prefix: /}
                    route: {cluster: web}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: api
        type: STRICT_DNS
        connect_timeout: 2s
        load_assignment:
          cluster_name: api
          endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: {{ include "flowgent.fullname" . }}-apiserver, port_value: 9999}}}}]}]
      - name: web
        type: STRICT_DNS
        connect_timeout: 2s
        load_assignment:
          cluster_name: web
          endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: {{ include "flowgent.fullname" . }}-web, port_value: 8080}}}}]}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "flowgent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: envoy
          image: {{ .Values.envoy.image | quote }}
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: http}
          resources: {{ toYaml .Values.envoy.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/envoy, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: {app: {{ $name }}}
  ports: [{name: http, port: {{ .Values.envoy.service.port }}, targetPort: http}]
{{- end }}
