# ═══════════════════════════════════════════════════════════════
# Flowgent — Security Autonomy Fixer V2 Override Values
#
# Usage:
#   helm upgrade flowgent . -f values.yaml -f values-v2.yaml
# ═══════════════════════════════════════════════════════════════

global:
  mode: application
  image:
    tag: latest

# Enable in-cluster middleware
postgresql:
  enabled: true

emqx:
  enabled: true

jaeger:
  enabled: true

# External K8s Secret references for credentials
secrets:
  extraSecrets:
    - name: "flowgent-llm-deepseek"
      optional: true
      mappings:
        - key: apikey
          env: DEEPSEEK_APIKEY
    - name: "flowgent-github-token"
      optional: true
      mappings:
        - key: token
          env: GITHUB_TOKEN
    - name: "flowgent-sonarqube-token"
      optional: true
      mappings:
        - key: token
          env: SONARQUBE_TOKEN

# LLM Providers — loaded from database via apiserver (standard mode)
llm: {}

# MCP Servers — GitHub + SonarQube tools
orchestration:
  maxConcurrentFlows: 10
  flowExecutionTimeout: "30m"
  maxNodeRetries: 3
  agents:
    standard:
      enabled: false
  skills:
    standard:
      enabled: false
  agentflows:
    standard:
      enabled: false

# Component replica counts for v2
apiserver:
  replicas: 2

a2a:
  enabled: true
  replicas: 2

jobmanager:
  replicas: 2

taskmanager:
  replicas: 2
  slots: 4

notifier:
  enabled: true
  replicas: 2

sandbox:
  replicas: 2
  slots: 4
