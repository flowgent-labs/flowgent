openapi: "3.1.0"
info:
  title: Flowgent Orchestration API
  version: "2.0.0"
  description: >
    Namespace-scoped orchestration, immutable revisions, execution, unified
    approvals, published knowledge, integrations, and notification management.
servers:
  - url: /api/v1
paths:
  /{namespace}/agent-graphs:
    get:
      operationId: listAgentGraphs
      summary: List stable AgentGraphs at their current revision
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      responses:
        '200': { $ref: '#/components/responses/AgentGraphList' }
    post:
      operationId: createAgentGraph
      summary: Create a AgentGraph and immutable revision 1
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody: { $ref: '#/components/requestBodies/AgentGraph' }
      responses:
        '201': { $ref: '#/components/responses/AgentGraph' }
  /{namespace}/agent-graphs/{agent_graph_name}:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/AgentGraphName' }
    get:
      operationId: getAgentGraph
      summary: Get a AgentGraph by its namespace-local name
      responses:
        '200': { $ref: '#/components/responses/AgentGraph' }
    put:
      operationId: reviseAgentGraph
      summary: Save a new immutable AgentGraph revision
      requestBody: { $ref: '#/components/requestBodies/AgentGraph' }
      responses:
        '200': { $ref: '#/components/responses/AgentGraph' }
    delete:
      operationId: deleteAgentGraph
      summary: Retire a AgentGraph
      responses:
        '204': { description: AgentGraph retired }
  /{namespace}/agent-graphs/{agent_graph_name}/trigger:
    post:
      operationId: triggerAgentGraph
      summary: Create a GraphRun locked to the current AgentGraph revision
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { $ref: '#/components/parameters/AgentGraphName' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerRequest' }
      responses:
        '200':
          description: GraphRun accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerResult' }

  /{namespace}/graph-runs:
    get:
      operationId: listGraphRuns
      summary: List Runs
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: status, in: query, schema: { type: string } }
        - { name: runtime_mode, in: query, schema: { type: string, enum: [application, session] } }
        - { name: k8s_namespace, in: query, schema: { type: string } }
        - { name: agent_graph_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated Runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunPage' }
    post:
      operationId: createGraphRun
      summary: Create a GraphRun using explicit stable AgentGraph and revision IDs
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GraphRun' }
      responses:
        '201':
          description: GraphRun created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphRun' }
  /{namespace}/graph-runs/metrics:
    get:
      operationId: getGraphRunMetrics
      summary: Aggregate GraphRun status and duration buckets
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { name: hours, in: query, schema: { type: integer, minimum: 1, maximum: 720, default: 24 } }
        - { name: buckets, in: query, schema: { type: integer, minimum: 1, maximum: 120, default: 12 } }
      responses:
        '200':
          description: GraphRun metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphRunMetrics' }
  /{namespace}/graph-runs/{graph_run_id}:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
    get:
      operationId: getGraphRun
      summary: Get a GraphRun and its locked context snapshot
      responses:
        '200': { $ref: '#/components/responses/GraphRun' }
    put:
      operationId: updateGraphRunLifecycle
      summary: Persist a narrow JobManager lifecycle transition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GraphRunLifecycleUpdate' }
      responses:
        '200': { description: GraphRun lifecycle updated }
    delete:
      operationId: deleteGraphRun
      summary: Delete a GraphRun owned by the namespace
      responses:
        '204': { description: GraphRun deleted }
  /{namespace}/graph-runs/{graph_run_id}/cancel:
    post:
      operationId: cancelGraphRun
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { $ref: '#/components/parameters/GraphRunID' }
      responses:
        '200': { description: Cancellation recorded }
  /{namespace}/graph-runs/{graph_run_id}/node-runs:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
    get:
      operationId: listNodeRuns
      summary: List all node attempts for a GraphRun
      responses:
        '200':
          description: NodeRun attempts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NodeRun' } }
    post:
      operationId: createNodeRun
      summary: Persist one node attempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeRun' }
      responses:
        '201': { $ref: '#/components/responses/NodeRun' }
  /{namespace}/graph-runs/{graph_run_id}/node-runs/{node_run_id}:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
      - { $ref: '#/components/parameters/NodeRunID' }
    get:
      operationId: getNodeRun
      responses:
        '200': { $ref: '#/components/responses/NodeRun' }
    put:
      operationId: updateNodeRun
      summary: Update one fenced node attempt/checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeRun' }
      responses:
        '200': { description: NodeRun updated }
  /{namespace}/graph-runs/{graph_run_id}/approvals:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
    get:
      operationId: listRunApprovals
      summary: List pending approvals owned by a GraphRun
      responses:
        '200':
          description: Pending approvals
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Approval' } }
    post:
      operationId: createGraphRunApproval
      summary: Create a frozen, hash-bound approval request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Approval' }
      responses:
        '201': { $ref: '#/components/responses/Approval' }
  /{namespace}/graph-runs/{graph_run_id}/approvals/{approval_id}/{decision}:
    post:
      operationId: resolveRunApproval
      summary: Make an immutable approval decision
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { $ref: '#/components/parameters/GraphRunID' }
        - { $ref: '#/components/parameters/ApprovalID' }
        - { name: decision, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      responses:
        '200': { description: Approval resolved or identical callback replayed }
        '404': { description: Approval is outside the owned GraphRun }
        '409': { description: Conflicting terminal decision or stale publication baseline }
        '410': { description: Approval expired }
  /{namespace}/approvals:
    get:
      operationId: listNamespaceApprovals
      summary: List namespace approval work queue
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      responses:
        '200':
          description: Pending approvals
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Approval' } }

  /{namespace}/agents:
    get:
      operationId: listAgents
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      responses:
        '200': { $ref: '#/components/responses/AgentPage' }
    post:
      operationId: createAgent
      summary: Create an Agent and immutable revision 1
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody: { $ref: '#/components/requestBodies/Agent' }
      responses:
        '201': { $ref: '#/components/responses/Agent' }
  /{namespace}/agents/{name}:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/ResourceName' }
    get:
      operationId: getAgent
      responses:
        '200': { $ref: '#/components/responses/Agent' }
    put:
      operationId: reviseAgent
      summary: Save a new immutable Agent revision
      requestBody: { $ref: '#/components/requestBodies/Agent' }
      responses:
        '200': { $ref: '#/components/responses/Agent' }
    delete:
      operationId: deleteAgent
      responses:
        '204': { description: Agent retired }

  /{namespace}/skill-definitions:
    get:
      operationId: listSkillDefinitions
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      responses:
        '200': { $ref: '#/components/responses/SkillPage' }
    post:
      operationId: createSkillDefinition
      summary: Create a reusable Skill and immutable revision 1
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody: { $ref: '#/components/requestBodies/Skill' }
      responses:
        '201': { $ref: '#/components/responses/Skill' }
  /{namespace}/skill-definitions/{name}:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/ResourceName' }
    get:
      operationId: getSkillDefinition
      responses:
        '200': { $ref: '#/components/responses/Skill' }
    put:
      operationId: reviseSkillDefinition
      summary: Save a new immutable Skill revision
      requestBody: { $ref: '#/components/requestBodies/Skill' }
      responses:
        '200': { $ref: '#/components/responses/Skill' }
    delete:
      operationId: deleteSkillDefinition
      responses:
        '204': { description: Skill retired }
  /{namespace}/skill-definitions/{name}/assets:
    post:
      operationId: uploadSkillAsset
      summary: Upload an allowlisted knowledge asset and create a new Skill revision
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { $ref: '#/components/parameters/ResourceName' }
      requestBody: { $ref: '#/components/requestBodies/FileUpload' }
      responses:
        '201': { $ref: '#/components/responses/Skill' }
  /{namespace}/skill-definitions/{name}/scripts:
    post:
      operationId: uploadSkillScript
      summary: Upload a helper script and create a new Skill revision
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { $ref: '#/components/parameters/ResourceName' }
      requestBody: { $ref: '#/components/requestBodies/FileUpload' }
      responses:
        '201': { $ref: '#/components/responses/Skill' }

  /{namespace}/mcp:
    get:
      operationId: listMcpServers
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      responses:
        '200': { $ref: '#/components/responses/McpList' }
    post:
      operationId: createMcpServer
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody: { $ref: '#/components/requestBodies/Mcp' }
      responses:
        '201': { $ref: '#/components/responses/Mcp' }
  /{namespace}/mcp/{name}:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/ResourceName' }
    get:
      operationId: getMcpServer
      responses:
        '200': { $ref: '#/components/responses/Mcp' }
    put:
      operationId: updateMcpServer
      requestBody: { $ref: '#/components/requestBodies/Mcp' }
      responses:
        '200': { $ref: '#/components/responses/Mcp' }
    delete:
      operationId: deleteMcpServer
      responses:
        '204': { description: MCP server deleted }

  /{namespace}/llm/providers:
    get:
      operationId: listLlmProviders
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      responses:
        '200': { $ref: '#/components/responses/LlmList' }
    post:
      operationId: createLlmProvider
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody: { $ref: '#/components/requestBodies/Llm' }
      responses:
        '201': { $ref: '#/components/responses/Llm' }
  /{namespace}/llm/providers/{id}:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getLlmProvider
      responses:
        '200': { $ref: '#/components/responses/Llm' }
    put:
      operationId: updateLlmProvider
      requestBody: { $ref: '#/components/requestBodies/Llm' }
      responses:
        '200': { $ref: '#/components/responses/Llm' }
    delete:
      operationId: deleteLlmProvider
      responses:
        '204': { description: LLM provider deleted }

  /{namespace}/notifications/channels:
    get:
      operationId: listNotificationChannels
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      responses:
        '200': { $ref: '#/components/responses/NotificationPage' }
    post:
      operationId: createNotificationChannel
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody: { $ref: '#/components/requestBodies/NotificationChannel' }
      responses:
        '201': { $ref: '#/components/responses/NotificationChannel' }
  /{namespace}/notifications/channels/{id}:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getNotificationChannel
      responses:
        '200': { $ref: '#/components/responses/NotificationChannel' }
    put:
      operationId: updateNotificationChannel
      requestBody: { $ref: '#/components/requestBodies/NotificationChannel' }
      responses:
        '200': { $ref: '#/components/responses/NotificationChannel' }
    delete:
      operationId: deleteNotificationChannel
      responses:
        '204': { description: Notification channel deleted }
  /{namespace}/notifications/test:
    post:
      operationId: testNotificationChannel
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, message]
              properties:
                channel_id: { type: string }
                delivery_id: { type: string }
                message: { type: string }
      responses:
        '202': { description: Delivery queued }

  /{namespace}/knowledge:
    get:
      operationId: listPublishedKnowledge
      summary: List only approved, published Knowledge
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { name: scope, in: query, schema: { type: string, enum: [namespace, graph, run] } }
        - { name: tags, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { $ref: '#/components/responses/KnowledgePage' }
  /{namespace}/knowledge/{id}:
    get:
      operationId: getPublishedKnowledge
      summary: Get one published immutable document revision
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Knowledge' }
  /{namespace}/knowledge/candidates:
    post:
      operationId: createKnowledgeCandidate
      summary: Freeze a candidate and create its unified human approval
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeCandidate' }
      responses:
        '201':
          description: Candidate and pending approval
          content:
            application/json:
              schema:
                type: object
                required: [candidate, approval]
                properties:
                  candidate: { $ref: '#/components/schemas/KnowledgeCandidate' }
                  approval: { $ref: '#/components/schemas/Approval' }
  /{namespace}/knowledge/search:
    post:
      operationId: searchPublishedKnowledge
      summary: Search with backend-enforced scope, ACL, profile, and dimension isolation
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeSearch' }
      responses:
        '200':
          description: Authorized published results
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Knowledge' } }

  /{namespace}/runtime-config:
    get:
      operationId: getNamespaceRuntimeConfig
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      responses:
        '200': { $ref: '#/components/responses/RuntimeConfig' }
  /{namespace}/runtime-config/environment:
    put:
      operationId: updateNamespaceEnvironment
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody: { $ref: '#/components/requestBodies/RuntimeEnvironment' }
      responses:
        '200': { $ref: '#/components/responses/RuntimeConfig' }
  /{namespace}/runtime-config/secrets:
    put:
      operationId: updateNamespaceSecrets
      parameters: [{ $ref: '#/components/parameters/Namespace' }]
      requestBody: { $ref: '#/components/requestBodies/RuntimeSecrets' }
      responses:
        '200': { $ref: '#/components/responses/RuntimeConfig' }
  /{namespace}/agent-graphs/{agent_graph_id}/runtime-config:
    get:
      operationId: getGraphRuntimeConfig
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { $ref: '#/components/parameters/AgentGraphID' }
      responses:
        '200': { $ref: '#/components/responses/RuntimeConfig' }
  /{namespace}/agent-graphs/{agent_graph_id}/runtime-config/environment:
    put:
      operationId: updateAgentGraphEnvironment
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { $ref: '#/components/parameters/AgentGraphID' }
      requestBody: { $ref: '#/components/requestBodies/RuntimeEnvironment' }
      responses:
        '200': { $ref: '#/components/responses/RuntimeConfig' }
  /{namespace}/agent-graphs/{agent_graph_id}/runtime-config/secrets:
    put:
      operationId: updateAgentGraphSecrets
      parameters:
        - { $ref: '#/components/parameters/Namespace' }
        - { $ref: '#/components/parameters/AgentGraphID' }
      requestBody: { $ref: '#/components/requestBodies/RuntimeSecrets' }
      responses:
        '200': { $ref: '#/components/responses/RuntimeConfig' }

  /webhook/{provider}:
    post:
      operationId: receiveWebhook
      summary: Normalize an SCM webhook and trigger matching AgentGraphs
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [github, gitlab, gitea] } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '202': { description: Webhook accepted }

  /{namespace}/graph-runs/{graph_run_id}/snapshot:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
    get:
      operationId: getGraphRunSnapshot
      summary: Get the immutable closed AgentGraph snapshot
      responses:
        '200':
          description: Get the immutable closed AgentGraph snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentGraph' }
  /{namespace}/graph-runs/{graph_run_id}/checkpoints:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
    post:
      operationId: createGraphCheckpoint
      summary: Commit a consistent GraphCheckpoint
      responses:
        '201':
          description: Commit a consistent GraphCheckpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphCheckpoint' }
  /{namespace}/graph-runs/{graph_run_id}/recovery:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
    get:
      operationId: getGraphRecovery
      summary: Recover the latest valid checkpoint and committed NodeRun state
      responses:
        '200':
          description: Recover the latest valid checkpoint and committed NodeRun state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphRecovery' }
  /{namespace}/graph-runs/{graph_run_id}/graph-patches:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
    post:
      operationId: applyGraphPatch
      summary: Atomically commit a SubGraph patch at the expected GraphRevision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GraphPatch' }
      responses:
        '200':
          description: Atomically commit a SubGraph patch at the expected GraphRevision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubGraph' }
  /{namespace}/graph-runs/{graph_run_id}/subgraphs/initialize:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
    post:
      operationId: initializeSubGraph
      summary: Initialize a pinned static or adaptive SubGraph
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubGraphInitialize' }
      responses:
        '200':
          description: Initialize a pinned static or adaptive SubGraph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubGraph' }
  /{namespace}/graph-runs/{graph_run_id}/agents/{agent_name}:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
      - { name: agent_name, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGraphRunAgentSnapshot
      summary: Get the immutable agent revision pinned to this GraphRun
      responses:
        '200':
          description: Get the immutable agent revision pinned to this GraphRun
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
  /{namespace}/graph-runs/{graph_run_id}/node-runs/{node_run_id}/checkpoint:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
      - { $ref: '#/components/parameters/NodeRunID' }
    put:
      operationId: commitNodeCheckpoint
      summary: Commit an owned NodeRun context and workspace checkpoint
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeCheckpointCommit' }
      responses:
        '204':
          description: Commit an owned NodeRun context and workspace checkpoint
  /{namespace}/graph-runs/{graph_run_id}/node-runs/{node_run_id}/sandbox-dispatch:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
      - { $ref: '#/components/parameters/NodeRunID' }
    post:
      operationId: dispatchSandbox
      summary: Persist a Sandbox handoff and transactional Outbox
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxDispatch' }
      responses:
        '204':
          description: Persist a Sandbox handoff and transactional Outbox
  /{namespace}/graph-runs/{graph_run_id}/node-runs/{node_run_id}/sandbox-result:
    parameters:
      - { $ref: '#/components/parameters/Namespace' }
      - { $ref: '#/components/parameters/GraphRunID' }
      - { $ref: '#/components/parameters/NodeRunID' }
    post:
      operationId: commitSandboxResult
      summary: Commit a verified workspace result before notification
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeResult' }
      responses:
        '204':
          description: Commit a verified workspace result before notification

components:
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,63}$' }
    ResourceName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
    AgentGraphName:
      name: agent_graph_name
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
    AgentGraphID:
      name: agent_graph_id
      in: path
      required: true
      schema: { type: string }
    GraphRunID:
      name: graph_run_id
      in: path
      required: true
      schema: { type: string }
    NodeRunID:
      name: node_run_id
      in: path
      required: true
      schema: { type: string }
    ApprovalID:
      name: approval_id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, default: 50 }

  requestBodies:
    AgentGraph:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AgentGraph' }
    Agent:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Agent' }
    Skill:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Skill' }
    Mcp:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/McpServer' }
    Llm:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LlmProvider' }
    NotificationChannel:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NotificationChannel' }
    FileUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
    RuntimeEnvironment:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeEnvironmentUpdate' }
    RuntimeSecrets:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeSecretUpdate' }

  responses:
    AgentGraph:
      description: AgentGraph at its current revision
      content: { application/json: { schema: { $ref: '#/components/schemas/AgentGraph' } } }
    AgentGraphList:
      description: AgentGraph list
      content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgentGraph' } } } }
    GraphRun:
      description: GraphRun
      content: { application/json: { schema: { $ref: '#/components/schemas/GraphRun' } } }
    NodeRun:
      description: NodeRun
      content: { application/json: { schema: { $ref: '#/components/schemas/NodeRun' } } }
    Approval:
      description: Unified approval
      content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } }
    Agent:
      description: Agent current revision
      content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
    AgentPage:
      description: Agent page
      content: { application/json: { schema: { $ref: '#/components/schemas/AgentPage' } } }
    Skill:
      description: Skill current revision and file metadata
      content: { application/json: { schema: { $ref: '#/components/schemas/Skill' } } }
    SkillPage:
      description: Skill page
      content: { application/json: { schema: { $ref: '#/components/schemas/SkillPage' } } }
    Mcp:
      description: MCP server
      content: { application/json: { schema: { $ref: '#/components/schemas/McpServer' } } }
    McpList:
      description: MCP servers
      content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/McpServer' } } } }
    Llm:
      description: LLM provider
      content: { application/json: { schema: { $ref: '#/components/schemas/LlmProvider' } } }
    LlmList:
      description: LLM providers
      content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LlmProvider' } } } }
    NotificationChannel:
      description: Redacted notification channel
      content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannel' } } }
    NotificationPage:
      description: Notification channel page
      content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } }
    Knowledge:
      description: Published Knowledge projection
      content: { application/json: { schema: { $ref: '#/components/schemas/Knowledge' } } }
    KnowledgePage:
      description: Published Knowledge page
      content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgePage' } } }
    RuntimeConfig:
      description: Redacted local, inherited, and effective configuration
      content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeConfigView' } } }

  schemas:
    AuditFields:
      type: object
      properties:
        id: { type: string, readOnly: true }
        namespace_id: { type: string, readOnly: true }
        status: { type: string }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        created_by: { type: string, readOnly: true }
        updated_by: { type: string, readOnly: true }
        row_version: { type: integer, format: int64, readOnly: true }
        metadata: { type: object }
    AgentGraph:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [name, kind, runtime_mode, nodes, edges]
          properties:
            name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
            revision: { type: integer, format: int64, minimum: 1, readOnly: true }
            summarize_enabled: { type: boolean, default: false }
            kind: { type: string, enum: [graph] }
            description: { type: string }
            input_schema: { type: object }
            output_schema: { type: object }
            vars: { type: object }
            nodes: { type: array, items: { $ref: '#/components/schemas/GraphNode' } }
            edges: { type: array, items: { type: object } }
            runtime_mode: { type: string, enum: [application, session] }
            resources: { type: object }
    TriggerRequest:
      type: object
      additionalProperties: false
      properties:
        input: { type: object }
        trigger:
          type: object
          properties:
            type: { type: string }
            source: { type: string }
            payload: { type: object }
    TriggerResult:
      type: object
      required: [graph_run_id, agent_graph_id, status, namespace]
      properties:
        graph_run_id: { type: string }
        agent_graph_id: { type: string, description: Namespace-local AgentGraph name }
        status: { type: string, enum: [PENDING] }
        namespace: { type: string }
    GraphRun:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [agent_graph_id, agent_graph_revision_id, status, context_snapshot, summarize_enabled]
          properties:
            snapshot: { $ref: '#/components/schemas/AgentGraph' }
            node_runs: { type: array, items: { $ref: '#/components/schemas/NodeRun' } }
            subgraphs: { type: object, additionalProperties: { $ref: '#/components/schemas/SubGraph' } }
            state_version: { type: integer, format: int64 }
            last_event_seq: { type: integer, format: int64 }
            agent_graph_id: { type: string, description: Stable AgentGraph ID }
            agent_graph_name: { type: string, readOnly: true }
            agent_graph_revision_id: { type: string }
            agent_graph_revision: { type: integer, format: int64, readOnly: true }
            status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, PAUSED, CANCELLED] }
            input: { type: object }
            output: { type: object }
            error: { type: string }
            run_instruction: { type: string }
            summarize_enabled: { type: boolean }
            summarize_override: { type: [boolean, 'null'], writeOnly: true }
            context_snapshot: { type: object, readOnly: true }
            started_at: { type: [string, 'null'], format: date-time }
            finished_at: { type: [string, 'null'], format: date-time }
            runtime_mode: { type: string, enum: [application, session] }
    GraphRunLifecycleUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, PAUSED, CANCELLED] }
        error: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    NodeRun:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [graph_run_id, node_instance_id, attempt, status]
          properties:
            graph_node_id: { type: string }
            subgraph_instance_id: { type: string }
            graph_revision: { type: integer, format: int64 }
            dispatch_epoch: { type: integer, format: int64 }
            workspace_snapshot: { $ref: '#/components/schemas/WorkspaceSnapshot' }
            graph_run_id: { type: string }
            node_instance_id: { type: string }
            attempt: { type: integer, minimum: 1 }
            agent_revision_id: { type: string }
            status: { type: string }
            input: { type: object }
            output: { type: object }
            error: { type: string }
            execution_memory: { type: object }
            checkpoint: { type: object }
            workspace_version: { type: string }
            execution_id: { type: string }
            lease_owner: { type: string }
            lease_expires_at: { type: [string, 'null'], format: date-time }
            fencing_token: { type: integer, format: int64 }
            parent_node_run_id: { type: string }
            started_at: { type: [string, 'null'], format: date-time }
            finished_at: { type: [string, 'null'], format: date-time }
    Approval:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [type, subject_type, subject_id, request, request_hash, status, idempotency_key]
          properties:
            graph_run_id: { type: string }
            node_run_id: { type: string }
            type: { type: string, enum: [human_gate, tool_call, payment, knowledge_publish, instruction_publish] }
            subject_type: { type: string }
            subject_id: { type: string }
            request: { type: object }
            request_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
            status: { type: string, enum: [pending, approved, rejected, expired, cancelled] }
            decision: { type: object }
            decided_by: { type: string, readOnly: true }
            decided_at: { type: [string, 'null'], format: date-time, readOnly: true }
            expires_at: { type: [string, 'null'], format: date-time }
            consumed_at: { type: [string, 'null'], format: date-time, readOnly: true }
            idempotency_key: { type: string }
    Agent:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [name, model, soul, instruction]
          properties:
            name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
            model: { type: string }
            soul: { type: string }
            instruction: { type: string }
            input_schema: { type: object }
            output_schema: { type: object }
            revision: { type: integer, format: int64, minimum: 1, readOnly: true }
            temperature: { type: number }
            max_tokens: { type: integer }
            labels: { type: object, additionalProperties: { type: string } }
    Skill:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [name, instruction]
          properties:
            name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
            instruction: { type: string }
            model: { type: string }
            tools: { type: array, items: { type: string } }
            revision: { type: integer, format: int64, minimum: 1, readOnly: true }
            assets: { type: array, readOnly: true, items: { $ref: '#/components/schemas/SkillFile' } }
            scripts: { type: array, readOnly: true, items: { $ref: '#/components/schemas/SkillFile' } }
    SkillFile:
      type: object
      required: [id, kind, relative_path, media_type, size_bytes, content_hash]
      properties:
        id: { type: string }
        kind: { type: string, enum: [asset, script] }
        relative_path: { type: string }
        media_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        content_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        metadata: { type: object }
    McpServer:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [name, transport, rpc_url, enabled]
          properties:
            name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
            transport: { type: string, enum: [http] }
            rpc_url: { type: string, format: uri }
            enabled: { type: boolean }
            header_refs: { type: object, additionalProperties: { type: string } }
            env_refs: { type: object, additionalProperties: { type: string } }
            labels: { type: object, additionalProperties: { type: string } }
    LlmProvider:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [name, type, base_uri, default_model, enabled]
          properties:
            name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
            type: { type: string, enum: [openai, anthropic, gemini] }
            base_uri: { type: string, format: uri }
            default_model: { type: string }
            enabled: { type: boolean }
            timeout_ms: { type: integer, minimum: 0 }
            credential_ref: { type: string }
            api_key_env: { type: string, writeOnly: true }
            key_configured: { type: boolean, readOnly: true }
            env_refs: { type: object, additionalProperties: { type: string } }
            models: { type: array, items: { type: object } }
            labels: { type: object, additionalProperties: { type: string } }
    NotificationChannel:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [name, provider, config, enabled]
          properties:
            name: { type: string }
            provider: { type: string, enum: [webhook, slack, dingtalk, telegram, email] }
            config:
              type: object
              description: Provider secret fields are write-only and never returned.
              writeOnly: true
            enabled: { type: boolean }
            labels: { type: object, additionalProperties: { type: string } }
            configured_secret_fields: { type: array, readOnly: true, items: { type: string } }
            clear_secret_fields: { type: array, writeOnly: true, items: { type: string } }
    Knowledge:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [revision, title, content, content_type, source, scope]
          properties:
            document_revision_id: { type: string }
            revision: { type: integer, format: int64 }
            content_id: { type: string }
            parent_content_id: { type: string }
            title: { type: string }
            content: { type: string }
            content_type: { type: string }
            content_kind: { type: string, enum: [section, chunk, summary] }
            source: { type: string }
            source_ref: { type: string }
            source_revision: { type: string }
            scope: { type: string, enum: [namespace, graph, run] }
            agent_graph_id: { type: string }
            agent_graph_name: { type: string }
            graph_run_id: { type: string }
            acl_ref: { type: string }
            classification: { type: string }
            heading_path: { type: string }
            provenance: { type: object }
            tags: { type: array, items: { type: string } }
            profile_key: { type: string }
            distance: { type: number }
    KnowledgeCandidate:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [source_graph_run_id, target_scope, type, content, provenance, expected_revision, idempotency_key]
          properties:
            source_graph_run_id: { type: string }
            target_scope: { type: string, enum: [namespace, graph] }
            target_agent_graph_id: { type: string }
            target_agent_graph_name: { type: string }
            target_document_id: { type: string }
            type: { type: string, enum: [knowledge, instruction] }
            content: { type: string }
            content_hash: { type: string, readOnly: true }
            provenance: { type: object }
            expected_revision: { type: integer, format: int64, minimum: 0 }
            approval_id: { type: string, readOnly: true }
            idempotency_key: { type: string }
    KnowledgeSearch:
      type: object
      properties:
        query: { type: string }
        embedding: { type: array, items: { type: number, format: float } }
        profile_key: { type: string }
        top_k: { type: integer, minimum: 1 }
        tags: { type: array, items: { type: string } }
        scope: { type: string, enum: [namespace, graph, run] }
        agent_graph_id: { type: string }
        agent_graph_name: { type: string }
        graph_run_id: { type: string }
    GraphRunMetricBucket:
      type: object
      properties:
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        running: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        average_duration_ms: { type: integer, format: int64 }
    GraphRunMetrics:
      type: object
      properties:
        total: { type: integer }
        running: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }
        success_rate: { type: number }
        failure_rate: { type: number }
        average_duration_ms: { type: integer, format: int64 }
        buckets: { type: array, items: { $ref: '#/components/schemas/GraphRunMetricBucket' } }
    PageEnvelope:
      type: object
      properties:
        total_count: { type: integer, format: int64 }
        request: { type: object }
        total_pages: { type: integer }
    RunPage:
      allOf:
        - { $ref: '#/components/schemas/PageEnvelope' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/GraphRun' } } }
    AgentPage:
      allOf:
        - { $ref: '#/components/schemas/PageEnvelope' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Agent' } } }
    SkillPage:
      allOf:
        - { $ref: '#/components/schemas/PageEnvelope' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Skill' } } }
    NotificationPage:
      allOf:
        - { $ref: '#/components/schemas/PageEnvelope' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } } }
    KnowledgePage:
      allOf:
        - { $ref: '#/components/schemas/PageEnvelope' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Knowledge' } } }
    RuntimeConfigLayer:
      type: object
      required: [environment, secret_keys]
      properties:
        environment: { type: object, additionalProperties: { type: string } }
        secret_keys: { type: array, items: { type: string } }
    RuntimeConfigView:
      type: object
      required: [local, inherited, effective]
      properties:
        local: { $ref: '#/components/schemas/RuntimeConfigLayer' }
        inherited: { $ref: '#/components/schemas/RuntimeConfigLayer' }
        effective: { $ref: '#/components/schemas/RuntimeConfigLayer' }
    RuntimeEnvironmentUpdate:
      type: object
      additionalProperties: false
      required: [environment]
      properties:
        environment: { type: object, additionalProperties: { type: string, maxLength: 65536 } }
    RuntimeSecretUpdate:
      type: object
      additionalProperties: false
      properties:
        secrets: { type: object, writeOnly: true, additionalProperties: { type: string, minLength: 1, maxLength: 65536 } }
        clear_secret_keys: { type: array, uniqueItems: true, items: { type: string } }

    GraphNode:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, enum: [agent, tool, skill, map, subgraph, condition, committee, human, supervisor, sandbox, join, noop] }
        subgraph: { $ref: '#/components/schemas/SubGraphConfig' }
        args: { type: object }
        retry: { type: object }
        script: { type: string }
        runtime: { type: string }
        workspace: { type: string }
        agent: { type: string }
        tool: { type: string }
    SubGraphConfig:
      type: object
      required: [ref]
      properties:
        ref: { type: string }
        mode: { type: string, enum: [static, adaptive], default: static }
        supervisor: { type: string }
        contract: { type: object }
        mutation: { type: object }
        limits: { type: object }
        safepoint: { type: object }
        definition_snapshot: { $ref: '#/components/schemas/AgentGraph', readOnly: true }
        definition_revision_id: { type: string, readOnly: true }
    SubGraph:
      type: object
      required: [instance_id, revision, config, graph, sealed]
      properties:
        instance_id: { type: string }
        revision: { type: integer, format: int64, description: Runtime GraphRevision of this SubGraph }
        config: { $ref: '#/components/schemas/SubGraphConfig' }
        graph: { $ref: '#/components/schemas/AgentGraph' }
        sealed: { type: boolean }
    SubGraphInitialize:
      type: object
      additionalProperties: false
      required: [instance_id]
      properties:
        instance_id: { type: string }
    GraphPatch:
      type: object
      additionalProperties: false
      required: [id, graph_run_id, subgraph_instance_id, expected_revision, operations]
      properties:
        id: { type: string }
        graph_run_id: { type: string }
        subgraph_instance_id: { type: string }
        expected_revision: { type: integer, format: int64 }
        operations:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [append, replace_pending, cancel_pending, update_pending_edges, seal] }
              node_instance_id: { type: string }
              node: { $ref: '#/components/schemas/GraphNode' }
              from: { type: string }
              to: { type: string }
              remove: { type: boolean }
    WorkspaceSnapshot:
      type: object
      required: [id, ref, sha256, created_at]
      properties:
        id: { type: string }
        ref: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        base_commit: { type: string }
        created_at: { type: string, format: date-time }
    GraphCheckpoint:
      type: object
      required: [id, graph_run_id, event_seq, state_version, snapshot, node_runs, sha256]
      properties:
        id: { type: string }
        graph_run_id: { type: string }
        event_seq: { type: integer, format: int64 }
        state_version: { type: integer, format: int64 }
        snapshot: { $ref: '#/components/schemas/AgentGraph' }
        subgraphs: { type: object, additionalProperties: { $ref: '#/components/schemas/SubGraph' } }
        node_runs: { type: array, items: { $ref: '#/components/schemas/NodeRun' } }
        sha256: { type: string }
        created_at: { type: string, format: date-time }
    GraphRecovery:
      type: object
      properties:
        checkpoint: { $ref: '#/components/schemas/GraphCheckpoint' }
        snapshot: { $ref: '#/components/schemas/AgentGraph' }
        node_runs: { type: array, items: { $ref: '#/components/schemas/NodeRun' } }
        subgraphs: { type: object, additionalProperties: { $ref: '#/components/schemas/SubGraph' } }
        rejected_checkpoints: { type: array, items: { type: string } }
    NodeCheckpointCommit:
      type: object
      additionalProperties: false
      required: [dispatch_epoch, checkpoint]
      properties:
        dispatch_epoch: { type: integer, format: int64 }
        checkpoint: { type: object }
    SandboxDispatch:
      type: object
      required: [namespace_id, graph_run_id, node_run_id, dispatch_epoch, script_path]
      properties:
        namespace_id: { type: string }
        agent_graph_id: { type: string }
        agent_graph_name: { type: string }
        graph_run_id: { type: string }
        node_run_id: { type: string }
        dispatch_epoch: { type: integer, format: int64 }
        script_path: { type: string }
        checkpoint: { type: object }
    NodeResult:
      type: object
      required: [node_run_id, dispatch_epoch]
      properties:
        node_run_id: { type: string }
        dispatch_epoch: { type: integer, format: int64 }
        error: { type: string }
        output: { type: object }
        checkpoint: { type: object }
        workspace_snapshot: { $ref: '#/components/schemas/WorkspaceSnapshot' }
