openapi: "3.1.0"
info:
  title: Flowgent AgentFlow Orchestration API
  version: "1.0.0"
  description: Autonomous agentflow orchestration engine with DAG execution, human approval, and AI agent orchestration.
servers:
  - url: /api/v1
paths:
  /flows:
    get:
      summary: List agentflow definitions
      operationId: listAgentFlows
      responses:
        '200': { description: AgentFlow definitions }
  /flows/trigger:
    post:
      summary: Trigger an agentflow
      operationId: triggerAgentFlow
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agentflow_id]
              properties:
                agentflow_id: { type: string }
                vars: { type: object }
      responses:
        '200': { description: AgentFlow triggered }
  /runs:
    get:
      summary: List agentflow runs
      parameters:
        - name: agentflow_id
          in: query
          schema: { type: string }
      responses:
        '200': { description: List of agentflow runs }
  /runs/{id}:
    get:
      summary: Get agentflow run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: AgentFlow run details }
  /runs/{run_id}/tasks:
    get:
      summary: Get task runs for an agentflow run
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task runs }
  /{namespace}/runtime-config:
    get:
      summary: Read redacted namespace runtime configuration
      operationId: getNamespaceRuntimeConfig
      parameters:
        - $ref: '#/components/parameters/Namespace'
      responses:
        '200':
          description: Local and effective namespace configuration; secret values are never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfigView' }
  /{namespace}/runtime-config/environment:
    put:
      summary: Replace namespace environment variables
      operationId: updateNamespaceEnvironment
      parameters:
        - $ref: '#/components/parameters/Namespace'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeEnvironmentUpdate' }
      responses:
        '200':
          description: Updated redacted configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfigView' }
  /{namespace}/runtime-config/secrets:
    put:
      summary: Merge or clear write-only namespace secrets
      operationId: updateNamespaceSecrets
      parameters:
        - $ref: '#/components/parameters/Namespace'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeSecretUpdate' }
      responses:
        '200':
          description: Updated redacted configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfigView' }
  /{namespace}/flows/{flow_id}/runtime-config:
    get:
      summary: Read redacted Flow runtime configuration with namespace inheritance
      operationId: getFlowRuntimeConfig
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/FlowID'
      responses:
        '200':
          description: Local, inherited, and effective Flow configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfigView' }
  /{namespace}/flows/{flow_id}/runtime-config/environment:
    put:
      summary: Replace Flow-local environment variable overrides
      operationId: updateFlowEnvironment
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/FlowID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeEnvironmentUpdate' }
      responses:
        '200':
          description: Updated redacted configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfigView' }
  /{namespace}/flows/{flow_id}/runtime-config/secrets:
    put:
      summary: Merge or clear write-only Flow secret overrides
      operationId: updateFlowSecrets
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/FlowID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeSecretUpdate' }
      responses:
        '200':
          description: Updated redacted configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfigView' }
  /{namespace}/flows/{flow_id}/runtime-config/resolved:
    get:
      summary: Resolve effective Flow runtime configuration for the controller workload
      description: Workload-only endpoint; human and ordinary API-key roles must not receive this permission.
      operationId: resolveFlowRuntimeConfig
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/FlowID'
      responses:
        '200':
          description: Effective environment and secret values for Kubernetes materialization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedRuntimeConfig' }
  /{namespace}/resource-pools:
    get:
      summary: List namespace resource pools
      operationId: listResourcePools
      parameters:
        - $ref: '#/components/parameters/Namespace'
      responses:
        '200':
          description: Resource pools available to Flows in this namespace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ResourcePool' }
    post:
      summary: Create a namespace resource pool
      operationId: createResourcePool
      parameters:
        - $ref: '#/components/parameters/Namespace'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourcePool' }
      responses:
        '201':
          description: Resource pool created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePool' }
        '409': { description: A case-insensitive name collision exists }
  /{namespace}/resource-pools/{pool_name}:
    get:
      summary: Get a namespace resource pool
      operationId: getResourcePool
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/ResourcePoolName'
      responses:
        '200':
          description: Resource pool
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePool' }
        '404': { description: Resource pool not found }
    put:
      summary: Update resource-pool capacity and placement
      operationId: updateResourcePool
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/ResourcePoolName'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourcePool' }
      responses:
        '200':
          description: Resource pool updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePool' }
    delete:
      summary: Delete an unused resource pool
      operationId: deleteResourcePool
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/ResourcePoolName'
      responses:
        '204': { description: Resource pool deleted }
        '409': { description: A Flow or active run still references the pool }
  /webhook/{provider}:
    post:
      summary: Receive an SCM (GitHub/GitLab/Gitea) webhook and trigger matching flows
      description: >
        Global (non namespace-scoped) endpoint. The per-provider request body is
        normalized into a canonical event; every flow whose triggers declare a
        matching {provider, event} gets a new PENDING run created under its own
        namespace. Returns 202 with the list of triggered run IDs (empty list is
        not an error — most deliveries match no configured trigger).
      operationId: receiveWebhook
      parameters:
        - name: provider
          in: path
          required: true
          description: One of github, gitlab, gitea
          schema: { type: string, enum: [github, gitlab, gitea] }
      requestBody:
        description: Raw provider webhook payload (GitHub/Gitea or GitLab schema)
        content:
          application/json:
            schema: { type: object }
      responses:
        '202': { description: Webhook accepted; body contains triggered run IDs }
        '400': { description: Unsupported provider or unparseable body }
  /human/{token}/approve:
    post:
      summary: Approve human task
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Approved }
  /human/{token}/reject:
    post:
      summary: Reject human task
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rejected }
components:
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,31}$' }
    FlowID:
      name: flow_id
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,31}$' }
    ResourcePoolName:
      name: pool_name
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,31}$' }
  schemas:
    ResourceQuantity:
      type: object
      additionalProperties: false
      properties:
        cpu: { type: string, example: 500m }
        memory: { type: string, example: 512Mi }
    ResourcePool:
      type: object
      required: [name, replicas, slots_per_pod, sandbox_replicas, sandbox_slots_per_pod]
      properties:
        name: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_-]{0,31}$' }
        description: { type: string }
        replicas: { type: integer, minimum: 1, maximum: 100 }
        slots_per_pod: { type: integer, minimum: 1, maximum: 256 }
        resources: { $ref: '#/components/schemas/ResourceQuantity' }
        sandbox_replicas: { type: integer, minimum: 0, maximum: 100 }
        sandbox_slots_per_pod: { type: integer, minimum: 1, maximum: 256 }
        sandbox_resources: { $ref: '#/components/schemas/ResourceQuantity' }
        priority_class_name: { type: string }
        node_selector:
          type: object
          additionalProperties: { type: string }
    RuntimeConfigLayer:
      type: object
      required: [environment, secret_keys]
      properties:
        environment:
          type: object
          additionalProperties: { type: string }
        secret_keys:
          type: array
          items: { type: string }
          description: Configured names only; values are write-only.
    RuntimeConfigView:
      type: object
      required: [local, inherited, effective]
      properties:
        local: { $ref: '#/components/schemas/RuntimeConfigLayer' }
        inherited: { $ref: '#/components/schemas/RuntimeConfigLayer' }
        effective: { $ref: '#/components/schemas/RuntimeConfigLayer' }
    RuntimeEnvironmentUpdate:
      type: object
      required: [environment]
      additionalProperties: false
      properties:
        environment:
          type: object
          additionalProperties: { type: string, maxLength: 65536 }
    RuntimeSecretUpdate:
      type: object
      additionalProperties: false
      properties:
        secrets:
          type: object
          writeOnly: true
          additionalProperties: { type: string, minLength: 1, maxLength: 65536 }
        clear_secret_keys:
          type: array
          uniqueItems: true
          items: { type: string }
    ResolvedRuntimeConfig:
      type: object
      required: [environment, secrets]
      properties:
        environment:
          type: object
          additionalProperties: { type: string }
        secrets:
          type: object
          writeOnly: true
          additionalProperties: { type: string }
