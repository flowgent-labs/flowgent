# =============================================================================
#  GLAuth — LDAP Test Server Configuration
#  Simulates multi-domain AD for Flowgent integration testing.
#  Reference: https://github.com/glauth/glauth
# =============================================================================

[ldap]
  enabled = true
  listen = "0.0.0.0:389"

[ldaps]
  enabled = false

[behaviors]
  IgnoreCapabilities = true

[backend]
  datastore = "config"
  baseDN = "dc=example,dc=com"
  nameformat = "cn"
  groupformat = "ou"

# ── Service Account (used for bind-dn) ────────────────────────────
[[users]]
  name = "svc-flowgent"
  givenname = "Flowgent"
  sn = "Service"
  mail = "svc-flowgent@example.com"
  uidnumber = 5000
  primarygroup = 5500
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = [5501]

# ── Domain: corp.example.com ──────────────────────────────────────
# Simulates the corporate AD domain (sAMAccountName format)

[[users]]
  name = "jdoe"
  givenname = "John"
  sn = "Doe"
  mail = "jdoe@corp.example.com"
  uidnumber = 1001
  primarygroup = 5501
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = [5501, 5502]   # FlowgentAdmins
  attrs = { sAMAccountName = "jdoe", department = "Engineering" }

[[users]]
  name = "asmith"
  givenname = "Alice"
  sn = "Smith"
  mail = "asmith@corp.example.com"
  uidnumber = 1002
  primarygroup = 5502
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = [5502]         # FlowgentOps
  attrs = { sAMAccountName = "asmith", department = "Operations" }

[[users]]
  name = "bwilson"
  givenname = "Bob"
  sn = "Wilson"
  mail = "bwilson@corp.example.com"
  uidnumber = 1003
  primarygroup = 5503
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = []             # No special role
  attrs = { sAMAccountName = "bwilson", department = "Sales" }

# ── Domain: eng.example.com ───────────────────────────────────────
# Simulates the engineering AD domain (uid format)

[[users]]
  name = "cjones"
  givenname = "Carol"
  sn = "Jones"
  mail = "cjones@eng.example.com"
  uidnumber = 2001
  primarygroup = 5501
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = [5501]         # FlowgentAdmins
  attrs = { uid = "cjones", department = "Platform" }

[[users]]
  name = "dlee"
  givenname = "David"
  sn = "Lee"
  mail = "dlee@eng.example.com"
  uidnumber = 2002
  primarygroup = 5501
  passsha256 = "ef92b778bafe771e89245b89ecbc08a44a4e166c06659911881f383d4473e94f"  # "password123"
  othergroups = [5501]         # FlowgentAdmins
  attrs = { uid = "dlee", department = "Infrastructure" }

# ── Groups (mapped to Flowgent roles) ─────────────────────────────

[[groups]]
  name = "FlowgentAdmins"
  gidnumber = 5501
  description = "Full Flowgent administrator access"

[[groups]]
  name = "FlowgentOps"
  gidnumber = 5502
  description = "Flowgent operator access (manage flows/runs)"

[[groups]]
  name = "Users"
  gidnumber = 5503
  description = "Default user group"
