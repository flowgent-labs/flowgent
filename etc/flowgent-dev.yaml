# =============================================================================
#  Flowgent — Fully Annotated Sample Configuration
#  Copy this file and adjust for your environment.
# =============================================================================
service-name: flowgent

# ── REST API Server ──────────────────────────────────────────────────────────
server:
  host: 0.0.0.0
  port: 9999
  context-path: "/"
  shutdown-timeout: 15s
  max-body-bytes: 10485760   # 10 MiB
  read-timeout: 30s
  write-timeout: 60s

# ── A2A Protocol Server (Google Agent-to-Agent) ──────────────────────────────
a2a:
  enabled: true
  host: 0.0.0.0
  port: 9992

# ── Management Endpoints (pprof, OTEL, metrics) ──────────────────────────────
mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  pprof:
    enabled: true
    server-bind: "0.0.0.0:6669"
  otel:
    enabled: true
    endpoint: "localhost:4317"
    protocol: grpc                # http/protobuf | http/json | grpc
    timeout: 10000
    sample_rate: 1.0
  metrics:
    enabled: false                # prometheus metrics (otel SDK)
    prometheus: true
    export_interval: 30s
    histogram_boundaries:
      task:  [0.1, 0.5, 1, 2, 5, 10, 30, 60, 120]
      llm:   [0.5, 1, 2, 5, 10, 30, 60, 120, 300]
      queue: [0.01, 0.05, 0.1, 0.5, 1, 5, 10, 30]
    labels: {}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  mode: JSON                      # HUMAN | JSON
  level: DEBUG                    # DEBUG | INFO | WARN | ERROR

# ── Authentication ───────────────────────────────────────────────────────────
auth:
  jwt-validity-ak: 3600
  jwt-validity-rk: 86400
  jwt-algorithm: "ES256"          # ES256 | RS256 | EdDSA
  jwt-private-key: "<YOUR_PRIVATE_KEY>"
  jwt-public-key: "<YOUR_PUBLIC_KEY>"
  anonymous-paths:
    - "/public/**"
    - "/static/**"
    - "/_/healthz"
    - "/_/healthz/**"
    - "/swagger-ui/**"
    - "/.well-known/**"
    - "/a2a/**"
  oidc:
    enabled: false
    client-id: "<YOUR_OIDC_CLIENT_ID>"
    issue-url: "https://iam.wl4g.com/realms/master"
    redirect-url: "http://wl4g.local:10000/serve/auth/callback/oidc"
    scope: "openid profile email"
  github:
    enabled: true
    client-id: "<YOUR_GITHUB_CLIENT_ID>"
    client-secret: "<YOUR_GITHUB_CLIENT_SECRET>"
    auth-url: "https://github.com/login/oauth/authorize"
    token-url: "https://github.com/login/oauth/access_token"
    redirect-url: "http://wl4g.local:10000/serve/auth/callback/github"
    scope: "user"
    user-info-url: "https://api.github.com/user"

# ── Cache ────────────────────────────────────────────────────────────────────
#    Provider: Memory (all-in-one/dev) | Redis (production/distributed)
cache:
  provider: Memory                # Memory | Redis
  memory:
    initial-capacity: 32
    max-capacity: 65535
    ttl: 3600000
    eviction-policy: LRU
  redis:
    nodes: ["redis://127.0.0.1:6379"]
    username: "default"
    password: "bitnami"
    connection-timeout: 3000
    response-timeout: 6000
    retries: 1
    max-retry-wait: 65536
    min-retry-wait: 1280
    read-from-replica: true
    use-ssl: false

# ── Storage ──────────────────────────────────────────────────────────────────
#    Type: SQLITE (all-in-one/dev) | POSTGRE (production/distributed)
storage:
  type: "SQLITE"                  # SQLITE | POSTGRE
  sqlite:
    dir: ".flowgent/sqlite"
  postgres:
    host: "127.0.0.1"
    port: 5432
    database: "flowgent"
    schema: "public"
    username: postgres
    password: "changeit"
    min-connections: 2
    max-connections: 20
    use-ssl: false

# ── Messaging ──────────────────────────────────────────────────────────────────
#    Type: memory (all-in-one/dev) | mqtt (production/distributed)
messaging:
  type: memory                    # memory | mqtt
  mqtt:
    broker: "tcp://127.0.0.1:1883"
    client_id: "flowgent"
    topic_prefix: "flowgent/exec"
    username: ""
    password: ""

# ── Distributed Lock ─────────────────────────────────────────────────────────
#    Provider: memory (all-in-one/dev) | postgres | redis
lock:
  provider: memory                # memory | postgres | redis
  redis:
    nodes: ["redis://127.0.0.1:6379"]
    password: "bitnami"

# ── LLM Providers ────────────────────────────────────────────────────────────
llm:
  request-timeout: 120s
  providers:
    static:
      - id: bailian
        type: dashscope
        enabled: true
        endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
        rate_limit: 60
        credentials:
          apikey: "${BAILIAN_APIKEY}"
        models:
          - name: qwen-plus
            temperature: 0.3
            topk: 5
            modalities:
              input: [text]
              output: [text]
            thinking:
              type: enabled
              budget_tokens: 8192
          - name: qwen3.5-coder
            temperature: 0.3
            topk: 5
            modalities:
              input: [text]
              output: [text]
            thinking:
              type: enabled
              budget_tokens: 8192

      - id: deepseek
        type: deepseek
        enabled: true
        endpoint: https://api.deepseek.com/v1/chat/completions
        rate_limit: 60
        credentials:
          apikey: "${DEEPSEEK_APIKEY}"
        models:
          - name: deepseek-chat
            temperature: 0.3

#      - id: anthropic
#        type: anthropic
#        enabled: false
#        endpoint: https://api.anthropic.com/v1/messages
#        rate_limit: 30
#        credentials:
#          apikey: "<YOUR_ANTHROPIC_API_KEY>"
#        models:
#          - name: claude-sonnet-4-6
#            temperature: 0.3

    standard:
      enabled: false                # DB-backed providers (future Flowgent UI)

# ── Orchestration Engine ─────────────────────────────────────────────────────
orchestration:
  max-concurrent-flows: 10
  flow-execution-timeout: 30m
  max-node-retries: 3

  # -- MCP Server Definitions -------------------------------------------------
  #     These are EXAMPLE MCPs for e2e testing. For production, use dedicated
  #     MCP implementations with proper authentication and reliability.
  #     Environment variables set here override inherited proxy/etc. settings
  #     for the MCP subprocess. Use ALL_PROXY="" to bypass proxy for localhost.
  mcps:
    - name: github
      enabled: true
      type: local
      command: ["sh", "-c", "/usr/local/bin/github-mcp"]
      args: ["--transport", "stdio", "-v", "10"]
      env:
        MCP_UPSTREAM_TOKEN_FILE: /path/to/.credentials
        ALL_PROXY: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""

    - name: sonarqube
      enabled: true
      type: local
      command: ["sh", "-c", "/usr/local/bin/sonarqube-mcp"]
      args: ["--transport", "stdio", "-v", "10"]
      env:
        SONARQUBE_URL: "http://localhost:9000"
        SONARQUBE_TOKEN: "squ_eab3ac9428573619417b0b3bd90ca986e87cbd11"
        SONARQUBE_PASSWORD: "<YOUR_SONARQUBE_PASSWORD>"
        ALL_PROXY: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""

    - name: nexus3
      enabled: false
      type: local
      command: ["/bin/nexus3-mcp"]
      args: ["--transport", "stdio"]
      env:
        MCP_UPSTREAM_TOKEN_FILE: /path/to/.credentials

    - name: confluence
      enabled: true
      type: local
      command: ["sh", "-c", "/bin/confluence-mcp"]
      args: ["--transport", "stdio", "-v", "10"]
      env:
        CONFLUENCE_BASE_URL: "https://your-domain.atlassian.net/wiki"
        CONFLUENCE_API_TOKEN: "<YOUR_ATLASSIAN_API_TOKEN>"
        CONFLUENCE_USER_EMAIL: "<YOUR_EMAIL>"
        ALL_PROXY: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""

  # -- Agent Definitions -------------------------------------------------------
  agents:
    static:
      enabled: true
      load-dir: "../examples/security-autonomy-fixer/agents/"
      refresh: 30s                  # hot-reload interval
    standard:
      enabled: false                # DB-backed agents (future Flowgent UI)

  # -- Skill Definitions -------------------------------------------------------
  skills:
    static:
      enabled: true
      load-dir: "../examples/security-autonomy-fixer/skills/"
      refresh: 30s
    standard:
      enabled: false

  # -- AgentFlow Definitions (Layer 2) -----------------------------------------
  agentflows:
    static:
      enabled: true
      load-dir: "../examples/security-autonomy-fixer/flows/"
      refresh: 1m
    standard:
      enabled: false                # DB-backed agentflows (future Flowgent UI)

# ── Sandbox (inline in TaskManager) ────────────────────────────────────────────
#    Secure script execution runs inside TM pods — no separate deployment.
#    Resource limits come from the TM pod spec, not from sandbox policy.
sandbox:
  workspace: "/var/flowgent/workspace"   # shared PVC, per-{tenant}/{flow_id} subdirs
  policy:
    network:
      mode: none                   # none | allowlist | denylist
      allowed: []
      denied: []
    allowed_runtimes: [python3, bash, node]
    banned_commands: []            # e.g. ["curl", "wget"]
    default_timeout: 120s
    max_timeout: 600s

# ── Notifier Service ─────────────────────────────────────────────────────
notifier:
  enabled: false                    # set true to enable
  channels:
    - name: telegram-ops
      type: telegram
      enabled: false
      config:
        bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "-1001234567890"
    - name: dingtalk-ops
      type: dingtalk
      enabled: false
      config:
        webhook_url: "${DINGTALK_WEBHOOK_URL}"
        secret: "${DINGTALK_SECRET}"
    - name: slack-ops
      type: slack
      enabled: false
      config:
        webhook_url: "${SLACK_WEBHOOK_URL}"
        channel: "#flowgent-alerts"
    # - name: email-ops
    #   type: email
    #   enabled: false
    #   config:
    #     smtp_host: "smtp.example.com"
    #     smtp_port: 587
    #     username: "flowgent@example.com"
    #     password: "<YOUR_SMTP_PASSWORD>"
    #     from: "flowgent@example.com"
    # - name: webhook-generic
    #   type: webhook
    #   enabled: false
    #   config:
    #     url: "https://hooks.example.com/flowgent"
    #     headers:
    #       X-Custom: "value"

# ── Multi-Tenant ─────────────────────────────────────────────────────────────
tenant:
  default_tenant: "default"
  namespace_prefix: "flowgent-"

# ── Payments (x402) ──────────────────────────────────────────────────────────
#    Optional economic layer. Disabled by default — flowgent runs as a pure
#    orchestration engine without payment features.
payments:
  enabled: false
  policies:
    max_single_payment_usd: 1
    max_daily_budget_usd: 50
    allowed_domains: ["*.googleapis.com", "*.openai.com"]
    blocked_domains: ["*.unknown.xyz"]
    require_human_approval_above_usd: 5
    allowed_assets: [USDC]
    allowed_chains: [base, solana]
  wallet:
    endpoint: "http://localhost:9901"
    auth_token: ""
    auth_token_file: ""
    default_wallet: "default"
    secret_store:
      provider: default                  # default | vault
      master_key: ""
      master_key_file: /var/secrets/master.key
  x402:
    default_facilitator: "http://localhost:8085"
    timeout: 30s
    max_retries: 3
