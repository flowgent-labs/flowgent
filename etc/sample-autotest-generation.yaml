id: autotest-generation
description: |
  Enterprise auto test code generation agentflow:
  1. FETCH — Retrieves requirements from Confluence via its REST API.
  2. ANALYZE — Analyzes and extracts structured, detailed requirements.
  3. PLAN — Generates a development planning document with test scenarios.
  4. GENERATE — Creates Cucumber .feature files and step definitions per project type
     (Spring Boot, Flask, React.js with Jest/Cucumber).
  5. REVIEW — Security, quality, and architecture review of generated test code.
  6. VOTE — Deterministic majority vote on test code quality.
  7. SUPERVISOR — Controlled autonomy with allowed_actions guard rails.
  8. COMMIT — Pushes generated test code to a dedicated branch and opens a PR.
  9. NOTIFY — Reports results via PR comment, email, and Teams webhook.

# ─── Triggers ──────────────────────────────────────────────
triggers:
  - type: schedule
    cron: "0 8 * * 1-5"  # Every weekday at 8am
  - type: webhook
    provider: github
    events: [pull_request]

# ─── Variables ─────────────────────────────────────────────
vars:
  confluence_space: "ENG"
  confluence_page_id: ""
  project_types:
    - spring-boot
    - flask
    - react
  notify_email_to: "qa-team@company.com"
  notify_webhook_url: "https://outlook.office.com/webhook/xxxxx"

nodes:
  # ┌─────────────────────────────────────────────────┐
  # PHASE 1: FETCH requirements from Confluence       │
  # └─────────────────────────────────────────────────┘
  - id: fetch-confluence
    type: tool
    tool: confluence
    input:
      action: "get_page"
      space_key: "${vars.confluence_space}"
      page_id: "${vars.confluence_page_id}"

  # ┌─────────────────────────────────────────────────┐
  # PHASE 2: ANALYZE — Extract structured requirements│
  # └─────────────────────────────────────────────────┘
  - id: analyze-requirements
    type: agent
    agent: requirement-analyst
    input:
      confluence_content: "${fetch-confluence.content}"
      instruction: |
        Parse the Confluence page content and extract:
        1. Feature requirements (user stories, acceptance criteria)
        2. API specifications (endpoints, request/response schemas)
        3. Business rules and edge cases
        Output structured JSON.

  # ┌─────────────────────────────────────────────────┐
  # PHASE 3: PLAN — Generate dev planning document    │
  # └─────────────────────────────────────────────────┘
  - id: generate-plan
    type: agent
    agent: test-planner
    input:
      requirements: "${analyze-requirements.requirements}"
      project_types: "${vars.project_types}"
      instruction: |
        Generate a detailed test planning document with:
        1. Test scenarios per project type (Spring Boot: JUnit+Cucumber,
           Flask: pytest-bdd, React: Jest+Cucumber)
        2. Step definitions outline
        3. Mock/stub requirements
        4. Test data specifications
        Output structured JSON with per-project-type sections.

  # ┌─────────────────────────────────────────────────┐
  # PHASE 4: GENERATE — Fan-out per project type      │
  # └─────────────────────────────────────────────────┘
  - id: generate-tests
    type: map
    source: "${vars.project_types}"
    concurrency: 3
    node:
      type: agent
      agent: test-generator
      input:
        project_type: "${item}"
        plan: "${generate-plan.plan}"
        instruction: |
          Generate complete Cucumber integration test code:
          - Spring Boot: .feature files + JUnit step definitions
          - Flask: .feature files + pytest-bdd step definitions
          - React: .feature files + Jest/Cucumber step definitions
          Include setup/teardown, mocks, test data, and documentation.

  # ┌─────────────────────────────────────────────────┐
  # PHASE 5: REVIEW — Multi-agent review              │
  # └─────────────────────────────────────────────────┘
  - id: review-security
    type: agent
    agent: security-reviewer

  - id: review-quality
    type: agent
    agent: quality-reviewer

  - id: review-arch
    type: agent
    agent: arch-reviewer

  # ┌─────────────────────────────────────────────────┐
  # PHASE 6: VOTE — Deterministic decision            │
  # └─────────────────────────────────────────────────┘
  - id: tribunal
    type: tribunal
    strategy:
      type: majority
    input:
      votes:
        - ${review-security.decision}
        - ${review-quality.decision}
        - ${review-arch.decision}

  # ┌─────────────────────────────────────────────────┐
  # PHASE 7: SUPERVISOR — Controlled autonomy         │
  # └─────────────────────────────────────────────────┘
  - id: supervisor-check
    type: supervisor
    agent: supervisor
    supervisor_config:
      max_retries: 3
      max_nodes: 50
      max_injections: 3
      allowed_actions: ["continue", "retry", "inject", "abort"]

  # ┌─────────────────────────────────────────────────┐
  # PHASE 8: CONDITIONAL — Route based on vote        │
  # └─────────────────────────────────────────────────┘
  - id: approved
    type: condition
    expression: "${tribunal.decision == true}"

  # ┌─────────────────────────────────────────────────┐
  # PHASE 9: COMMIT — Create branch + PR              │
  # └─────────────────────────────────────────────────┘
  - id: create-branch
    type: tool
    tool: github
    input:
      action: "create_branch"
      repo: "${item}"
      branch: "autotest/generated-tests-${timestamp}"
      base_branch: "main"

  - id: commit-tests
    type: tool
    tool: github
    input:
      action: "commit_and_push"
      repo: "${item}"
      branch: "autotest/generated-tests-${timestamp}"
      changes: "${generate-tests.results}"

  - id: create-pr
    type: tool
    tool: github
    input:
      action: "create_pull_request"
      repo: "${item}"
      title: "[AutoTest] Generated Cucumber integration tests"
      head: "autotest/generated-tests-${timestamp}"
      base: "main"
      body: "Automatically generated by Flowgent AutoTest AgentFlow"

  - id: summary-report
    type: agent
    agent: requirement-analyst
    input:
      agentflow_id: "${vars.agentflow_id}"
      run_id: "${vars.run_id}"
      test_plan: "${generate-plan.plan}"
      test_code: "${generate-tests.results}"
      pr_links: "${create-pr.pr_url}"

  # ┌─────────────────────────────────────────────────┐
  # PHASE 10: NOTIFY — Multi-channel notification     │
  # └─────────────────────────────────────────────────┘
  - id: notify-pr
    type: tool
    tool: github
    input:
      action: "create_issue_comment"
      repo: "${item}"
      pr_number: "${create-pr.pr_number}"
      body: "${summary-report.report}"

  - id: notify-email
    type: tool
    tool: github
    input:
      action: "send_email"
      to: "${vars.notify_email_to}"
      subject: "[AutoTest] Test code generation report"
      body: "${summary-report.report}"

  - id: notify-teams
    type: tool
    tool: github
    input:
      action: "webhook_notify"
      webhook_url: "${vars.notify_webhook_url}"
      title: "AutoTest Generation Report"
      body: "${summary-report.report}"

  - id: end
    type: noop

edges:
  # Fetch → Analyze → Plan
  - { from: fetch-confluence, to: analyze-requirements }
  - { from: analyze-requirements, to: generate-plan }

  # Plan → Generate (fan-out by project type)
  - { from: generate-plan, to: generate-tests }

  # Generate → Review (fan-out)
  - { from: generate-tests, to: review-security }
  - { from: generate-tests, to: review-quality }
  - { from: generate-tests, to: review-arch }

  # Review → Vote → Supervisor → Condition
  - { from: review-security, to: tribunal }
  - { from: review-quality, to: tribunal }
  - { from: review-arch, to: tribunal }
  - { from: tribunal, to: supervisor-check }
  - { from: supervisor-check, to: approved }

  # Condition → Commit (if approved) or back to Plan
  - { from: approved, to: create-branch, condition: true }
  - { from: approved, to: generate-plan, condition: false }

  # Commit chain → Report → Notify (fan-out) → End
  - { from: create-branch, to: commit-tests }
  - { from: commit-tests, to: create-pr }
  - { from: create-pr, to: summary-report }
  - { from: summary-report, to: notify-pr }
  - { from: summary-report, to: notify-email }
  - { from: summary-report, to: notify-teams }
  - { from: notify-pr, to: end }
  - { from: notify-email, to: end }
  - { from: notify-teams, to: end }
