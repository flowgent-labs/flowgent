id: security-autonomy-fixer-simple
priority: high
tenant_id: default
namespace: flowgent-rengine
description: |
  Production security fixer with SonarQube MCP, .cyberbot stateful metadata.
  PR strategy: new-pr branch per run. Rereads .cyberbot on restart.

triggers:
  - type: webhook
    provider: github
    events: [push, pull_request]

vars:
  repo: "rengine"
  repo_path: "/home/agent/rengine"

nodes:
  - id: fetch-issues
    type: tool
    tool: sonarqube
    input:
      action: "scan/get_issues"
      project_key: "rengine"
      severities: "BLOCKER"

  - id: analyze-issues
    type: agent
    agent: issue-detector
    input:
      repo: "${vars.repo}"
      sonarqube_issues: "${fetch-issues}"

  - id: generate-fixes
    type: agent
    agent: fixer-agent
    input:
      issues: "${analyze-issues.issues}"
      repo_path: "${vars.repo_path}"

  - id: review-security
    type: agent
    agent: security-reviewer
    input:
      patches: "${generate-fixes.patches}"

  - id: review-quality
    type: agent
    agent: quality-reviewer
    input:
      patches: "${generate-fixes.patches}"

  - id: review-arch
    type: agent
    agent: arch-reviewer
    input:
      patches: "${generate-fixes.patches}"

  - id: vote
    type: tribunal
    strategy:
      type: majority
    input:
      votes:
        - "${review-security.decision}"
        - "${review-quality.decision}"
        - "${review-arch.decision}"

  - id: supervisor
    type: supervisor
    agent: supervisor
    supervisor_config:
      max_retries: 3
      max_nodes: 50
      max_injections: 5
      allowed_actions: ["continue", "retry", "inject", "abort"]

  - id: is-approved
    type: condition
    expression: "${vote.decision == true}"

  - id: write-cyberbot
    type: agent
    agent: git-agent
    input:
      repo: "${vars.repo}"
      repo_path: "${vars.repo_path}"
      vote_decision: "${vote.decision}"
      patches: "${generate-fixes.patches}"
      reviewers:
        - { name: "security", decision: "${review-security.decision}" }
        - { name: "quality", decision: "${review-quality.decision}" }
        - { name: "arch", decision: "${review-arch.decision}" }
    instruction: |
      Write/update ${vars.repo_path}/.cyberbot metadata JSON for this run.
      Strategy: "new-pr" — creates fix_branch=security-bot/fix-{timestamp}.
      If .cyberbot exists from a prior run, read it and UPDATE (append to runs[]).
      Output STRICT JSON of the full .cyberbot content.

  - id: summary-report
    type: agent
    agent: issue-detector
    input:
      cyberbot_metadata: "${write-cyberbot}"
      vote_outcome: "${vote.decision}"
      repo: "${vars.repo}"

  - id: end
    type: noop

edges:
  - { from: fetch-issues, to: analyze-issues }
  - { from: analyze-issues, to: generate-fixes }
  - { from: generate-fixes, to: review-security }
  - { from: generate-fixes, to: review-quality }
  - { from: generate-fixes, to: review-arch }
  - { from: review-security, to: vote }
  - { from: review-quality, to: vote }
  - { from: review-arch, to: vote }
  - { from: vote, to: supervisor }
  - { from: supervisor, to: is-approved }
  - { from: is-approved, to: write-cyberbot, condition: true }
  - { from: is-approved, to: summary-report, condition: false }
  - { from: write-cyberbot, to: summary-report }
  - { from: summary-report, to: end }
