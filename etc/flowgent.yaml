# =============================================================================
#  Flowgent — Fully Annotated Configuration
#  Copy this file and adjust for your environment.
#
#  Key naming: snake_case (canonical). The loader (Spring Boot-style relaxed
#  binding) also accepts kebab-case and camelCase for the same key. FLOWGENT__
#  env overrides: __ separates nested levels, each key segment maps to
#  UPPER_SNAKE (yaml `jm_image` ⇄ env FLOWGENT__RUNTIME__JM_IMAGE).
# =============================================================================
service_name: flowgent

# ── REST API Server ──────────────────────────────────────────────────────────
server:
  host: 0.0.0.0
  port: 9999
  context_path: "/"
  shutdown_timeout: 15s
  max_body_bytes: 10485760   # 10 MiB
  read_timeout: 30s
  write_timeout: 60s

# ── A2A Protocol Server (Google Agent-to-Agent) ──────────────────────────────
a2a:
  enabled: true
  host: 0.0.0.0
  port: 9992

# ── Management Endpoints (pprof, OTEL, metrics) ──────────────────────────────
mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  pprof:
    enabled: true
    server_bind: "0.0.0.0:6669"
  otel:
    enabled: true
    endpoint: "localhost:4317"
    protocol: grpc                # http/protobuf | http/json | grpc
    timeout: 10000
    sample_rate: 1.0
  metrics:
    enabled: false                # prometheus metrics (otel SDK)
    prometheus: true
    export_interval: 30s
    histogram_boundaries:
      task:  [0.1, 0.5, 1, 2, 5, 10, 30, 60, 120]
      llm:   [0.5, 1, 2, 5, 10, 30, 60, 120, 300]
      queue: [0.01, 0.05, 0.1, 0.5, 1, 5, 10, 30]
    labels: {}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  mode: JSON                      # HUMAN | JSON
  level: DEBUG                    # DEBUG | INFO | WARN | ERROR

# ── Authentication ───────────────────────────────────────────────────────────
auth:
  jwt_validity_ak: 3600
  jwt_validity_rk: 86400
  jwt_algorithm: "ES256"           # ES256 | RS256 | EdDSA
  jwt_private_key: "<YOUR_PRIVATE_KEY>"
  jwt_public_key: "<YOUR_PUBLIC_KEY>"
  anonymous_paths:
    - "/public/**"
    - "/static/**"
    - "/_/healthz"
    - "/_/healthz/**"
    - "/swagger-ui/**"
    - "/.well-known/**"
    - "/a2a/**"
  oidc:
    enabled: false
    client_id: "<YOUR_OIDC_CLIENT_ID>"
    client_secret: "<YOUR_OIDC_CLIENT_SECRET>"
    issue_url: "https://iam.wl4g.com/realms/master"
    redirect_url: "http://wl4g.local:10000/serve/auth/callback/oidc"
    scope: "openid profile email"
  ldap:
    enabled: false
    url: "ldap://ad.example.com:389"               # LDAP server URL (ldap:// or ldaps://)
    base_dn: "dc=example,dc=com"                     # root base DN
    bind_dn: "cn=admin,dc=example,dc=com"            # service account DN
    bind_password: "${LDAP_BIND_PASSWORD}"           # service account password
    domains:                                         # AD multi-domain search
      - base_dn: "dc=corp,dc=example,dc=com"
        user_search_filter: "(sAMAccountName=%s)"
      - base_dn: "dc=eng,dc=example,dc=com"
        user_search_filter: "(uid=%s)"
    role_mapping:                                     # AD group/domain → Flowgent role
      - match: "cn=FlowgentAdmins,ou=groups,dc=corp,dc=example,dc=com"
        role: "admin"
      - match: "cn=FlowgentOps,ou=groups,dc=corp,dc=example,dc=com"
        role: "operator"
      - match: "dc=eng,dc=example,dc=com"
        role: "viewer"
    # ── Optional (defaults shown) ──
    user_search_filter: "(uid=%s)"                     # default: (cn=%s)
    username_attribute: "uid"                         # default: cn
    email_attribute: "mail"                           # default: mail
    display_name_attribute: "cn"                       # default: cn
    group_search_base: "ou=groups,dc=example,dc=com"   # for group→role resolution
    group_search_filter: "(member=%s)"                 # default: (member=%s)
    group_name_attribute: "cn"                         # default: cn
    insecure_skip_verify: false
  github:
    enabled: true
    client_id: "<YOUR_GITHUB_CLIENT_ID>"
    client_secret: "<YOUR_GITHUB_CLIENT_SECRET>"
    auth_url: "https://github.com/login/oauth/authorize"
    token_url: "https://github.com/login/oauth/access_token"
    redirect_url: "http://wl4g.local:10000/serve/auth/callback/github"
    scope: "user"
    user_info_url: "https://api.github.com/user"

# ── Cache ────────────────────────────────────────────────────────────────────
#    Provider: Memory (all-in-one/dev) | Redis (production/distributed)
cache:
  provider: Memory                # Memory | Redis
  memory:
    initial_capacity: 32
    max_capacity: 65535
    ttl: 3600000
    eviction_policy: LRU
  redis:
    nodes: ["redis://127.0.0.1:6379"]
    username: "default"
    password: "bitnami"
    connection_timeout: 3000
    response_timeout: 6000
    retries: 1
    max_retry_wait: 65536
    min_retry_wait: 1280
    read_from_replica: true
    use_ssl: false

# ── Storage ──────────────────────────────────────────────────────────────────
#    Type: SQLITE (all-in-one/dev) | POSTGRE (production/distributed)
storage:
  type: "SQLITE"                  # SQLITE | POSTGRE
  sqlite:
    dir: ".flowgent/sqlite"
  postgres:
    # dsn: "postgres://user:pass@host:5432/db?sslmode=disable"  # alternative to host/port/db/user/password
    host: "127.0.0.1"
    port: 5432
    database: "flowgent"
    schema: "public"
    username: postgres
    password: "changeit"
    min_connections: 2
    max_connections: 20
    use_ssl: false

# ── Messager ─────────────────────────────────────────────────────────────────
#    Inter-component message queue. All non-apiserver components (controller,
#    JM, TM, sandbox, wallet, notifier) communicate via messager.
#    Type: memory (all-in-one/dev) | mqtt (production/distributed)
messager:
  type: memory                    # memory | mqtt
  mqtt:
    broker: "tcp://127.0.0.1:1883"
    client_id: "flowgent"
    username: ""
    password: ""

# ── Distributed Lock ─────────────────────────────────────────────────────────
#    Provider: memory (all-in-one/dev) | postgres | redis
lock:
  provider: memory                # memory | postgres | redis
  redis:
    nodes: ["redis://127.0.0.1:6379"]
    password: "bitnami"

# ── Orchestration Engine ─────────────────────────────────────────────────────
#    LLM providers, MCP servers, agents, skills, and agentflows are all
#    DB-backed. Use the management console to manage them:
#
#      flowgent console
#        > import /path/to/import.yaml   # bulk-import resources
#        > export --all                  # dump all DB resources as YAML
#
#    The import/export format supports these top-level keys:
#      - llm_providers:  LLM provider definitions (model list, API keys, etc.)
#      - mcps:           MCP server definitions (command, args, env vars)
#      - agents:         Agent definitions (model, instruction, tools)
#      - skills:         Skill definitions (sub-agentflow templates)
#      - agentflows:     AgentFlow definitions (DAG of nodes + edges)
#
#    Only these 3 orchestration knobs are in the static config file:
orchestration:
  max_concurrent_flows: 10
  flow_execution_timeout: 30m
  max_node_retries: 3

# ── Sandbox — Secure Script Execution Worker ─────────────────────────────────
#    In standalone/all-in-one mode (deployment.enabled=false), sandbox runs
#    inline in the TM process. In distributed mode (deployment.enabled=true),
#    sandbox runs as independent K8s pods managed by JM's K8sRM with pod-level
#    network isolation (K8s NetworkPolicy/seccomp) plus process-level
#    seccomp-bpf filtering.
#
#    NOTE: sandbox.policy.* and sandbox.deployment.* keys map to the shared
#    model.SandboxPolicy / SandboxDeploymentConfig wire types (used over MQTT/DB),
#    which retain snake_case field names — do not rename them to camelCase.
sandbox:
  workspace: "/var/flowgent/workspace"   # shared PVC, per-{tenant}/{flow_id} subdirs
  policy:
    network:
      mode: none                   # none | allowlist | denylist
      allowed: []
      denied: []
    allowed_runtimes: [python3, bash, node]
    banned_commands: []             # e.g. ["curl", "wget"]
    default_timeout: 120s
    max_timeout: 600s
    default_resources:
      cpu: "500m"
      memory: "256Mi"
    max_resources:
      cpu: "2000m"
      memory: "1Gi"
  deployment:
    enabled: false                 # false = inline in TM (standalone/all-in-one)
                                   # true = independent K8s pods (distributed)
    image: ""                      # container image (empty = use global image)
    min_replicas: 2
    max_replicas: 10
    resources:
      cpu: "500m"
      memory: "512Mi"
    slots_per_pod: 4                 # concurrent script executions per pod

# ── Notifier Service ─────────────────────────────────────────────────────────
#    Channels are DB-managed via the management console or REST API.
#    The enabled flag controls whether the notifier process starts at all.
notifier:
  enabled: false                    # set true to enable the notifier service
  # Channels are managed via the DB CRUD API, not static config.
  # Example (for reference only — use `flowgent console` to create):
  # channels:
  #   - name: telegram-ops
  #     provider: telegram
  #     enabled: false
  #     config:
  #       bot_token: "${TELEGRAM_BOT_TOKEN}"
  #       chat_id: "-1001234567890"
  #   - name: dingtalk-ops
  #     provider: dingtalk
  #     enabled: false
  #     config:
  #       webhook_url: "${DINGTALK_WEBHOOK_URL}"
  #       secret: "${DINGTALK_SECRET}"
  #   - name: slack-ops
  #     provider: slack
  #     enabled: false
  #     config:
  #       webhook_url: "${SLACK_WEBHOOK_URL}"
  #       channel: "#flowgent-alerts"
  #   - name: email-ops
  #     provider: email
  #     enabled: false
  #     config:
  #       smtp_host: "smtp.example.com"
  #       smtp_port: 587
  #       username: "flowgent@example.com"
  #       password: "<YOUR_SMTP_PASSWORD>"
  #       from: "flowgent@example.com"
  #   - name: webhook-generic
  #     provider: webhook
  #     enabled: false
  #     config:
  #       url: "https://hooks.example.com/flowgent"
  #       headers:
  #         X-Custom: "value"

# ── Multi-Tenant ─────────────────────────────────────────────────────────────
tenant:
  default_tenant: "default"
  namespace_prefix: "flowgent-"

# ── Credential Paths ─────────────────────────────────────────────────────────
#    CSI-mounted credential files hierarchy (tenant + flow level):
#      {basePath}/{tenant}/secret/.credentials          (tenant-level)
#      {basePath}/{tenant}/{flow}/secret/.credentials   (flow-level)
#    Flow-level credentials override tenant-level.
credential_paths:
  base_path: "/var/flowgent"

# ── Runtime ──────────────────────────────────────────────────────────────────
#    Operational parameters typically set via FLOWGENT__RUNTIME__* env vars
#    rather than in the static config file.
runtime:
  api_server_url: "http://apiserver:9999"
  namespace: "default"
  # agentFlowId: ""              # set by JM at deploy time (FLOWGENT__RUNTIME__AGENT_FLOW_ID)
  # tmId: ""                     # set per TM pod (FLOWGENT__RUNTIME__TM_ID)
  tm_deploy: "flowgent-taskmanager"
  tm_slots: 4
  # controllerLabel: ""          # set per controller pod (FLOWGENT__RUNTIME__CONTROLLER_LABEL)
  # jmImage: ""                  # JM container image (FLOWGENT__RUNTIME__JM_IMAGE)
  # jmConfigMap: ""              # ConfigMap mounted into dedicated per-flow JM pods (FLOWGENT__RUNTIME__JM_CONFIG_MAP)
  # podIndex: 0                  # set by K8s downward API (FLOWGENT__RUNTIME__POD_INDEX)
  # podTotal: 1                  # set by K8s downward API (FLOWGENT__RUNTIME__POD_TOTAL)

# ── Wallet (x402) ────────────────────────────────────────────────────────────
#    Optional economic layer. Disabled by default — flowgent runs as a pure
#    orchestration engine without payment features.
#
#    Architecture: The wallet manager subscribes to unsigned x402 payment
#    messages via the messager (MQTT or local queue), signs them using the
#    EOA private key from the secret store, and publishes the signed messages
#    back. No HTTP endpoint is needed — all communication is through the
#    messager message bus.
wallet:
  enabled: false
  policies:
    max_single_payment_usd: 1
    max_daily_budget_usd: 50
    allowed_domains: ["*.googleapis.com", "*.openai.com"]
    blocked_domains: ["*.unknown.xyz"]
    require_human_approval_above_usd: 5
    allowed_assets: [USDC]
    allowed_chains: [base, solana]
  secret_store:
    provider: default                  # default | vault | csi
    master_key: ""
    master_key_file: /var/secrets/master.key
    # Vault backend (provider: vault)
    vault:
      address: ""                      # https://vault.example.com:8200
      token: ""                        # Vault token (or use tokenFile)
      token_file: ""                    # path to file containing Vault token
      mount_path: "secret"              # KV v2 mount path
      secret_path: "wallet"             # path under mount for wallet keys
      role: "flowgent"                 # Vault role for AppRole auth
  x402:
    default_facilitator: "http://localhost:8085"
    timeout: 30s
    max_retries: 3
