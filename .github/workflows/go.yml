# CI workflow — build + unit tests + integration tests

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: make build

    - name: Unit Tests
      run: make test-ut

  integration-it:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowgent
          POSTGRES_PASSWORD: flowgent
          POSTGRES_DB: flowgent_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: make build

    - name: Run Integration Tests
      run: make test-it
      env:
        FLOWGENT_TEST_PG_HOST: localhost
        FLOWGENT_TEST_PG_PORT: "15432"
