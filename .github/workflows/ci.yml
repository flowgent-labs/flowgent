# CI workflow — build + unit tests + integration tests

name: Go

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Daily build on main branch (03:07 UTC)
    - cron: "7 3 * * *"
    # Weekly full integration test on main branch (Monday 08:37 UTC)
    - cron: "37 8 * * 1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IN_CN_GFW: "false"

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: make build

    - name: Unit Tests
      run: make test-ut

  integration-it:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: flowgent
          POSTGRES_PASSWORD: flowgent
          POSTGRES_DB: flowgent_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: make build

    - name: Integration Tests
      run: make test-it
      env:
        FLOWGENT_TEST_PG_HOST: localhost
        FLOWGENT_TEST_PG_PORT: "15432"
