name: Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: flowgent-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
      packages: write
      pull-requests: write
    outputs:
      dirty_tag: ${{ steps.dirty-tag.outputs.value }}
      dirty_chart_version: ${{ steps.dirty-tag.outputs.chart_version }}
    steps:
      - name: Reclaim ephemeral runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Update PR CI comment
        env:
          GH_TOKEN: ${{ github.token }}
          FLOWGENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          FLOWGENT_COMMENT_KIND: ci
          FLOWGENT_COMMENT_PHASE: started
          FLOWGENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/upsert-pr-status-comment.mjs || \
            echo "::warning title=Flowgent PR CI comment::Could not publish the CI status comment."

      - name: Derive immutable dirty tag
        id: dirty-tag
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short_sha="${HEAD_SHA:0:8}"
          base_chart_version=$(awk '/^version:/ { print $2; exit }' deploy/helm/flowgent/Chart.yaml)
          test -n "${base_chart_version}"
          echo "value=dirty-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${base_chart_version}-dirty.${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dirty runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.core
          push: true
          build-args: BUILD_TAGS=x402
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.dirty-tag.outputs.value }}
          tags: ghcr.io/flowgent-labs/flowgent:${{ steps.dirty-tag.outputs.value }}
          cache-from: type=gha,scope=flowgent-runtime
          cache-to: type=gha,mode=max,scope=flowgent-runtime,ignore-error=true

      - name: Build and push dirty web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: deploy/docker/Dockerfile.web
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.dirty-tag.outputs.value }}
          tags: ghcr.io/flowgent-labs/flowgent-web:${{ steps.dirty-tag.outputs.value }}
          cache-from: type=gha,scope=flowgent-web
          cache-to: type=gha,mode=max,scope=flowgent-web,ignore-error=true

      - name: Drop package credentials before tests
        run: docker logout ghcr.io

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.work.sum
            pkg/*/go.sum
            tests/go.sum

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Build and run unit tests
        run: |
          make build
          make test

      - name: Run integration tests
        run: make test-it

      - name: Stop integration services
        if: always()
        run: docker compose -f deploy/docker/pgvector/docker-compose.yml down -v || true

      - name: Package dirty Helm chart
        env:
          CHART_VERSION: ${{ steps.dirty-tag.outputs.chart_version }}
          DIRTY_TAG: ${{ steps.dirty-tag.outputs.value }}
        run: |
          mkdir -p dist
          helm dependency list deploy/helm/flowgent
          helm lint deploy/helm/flowgent
          helm package deploy/helm/flowgent \
            --destination dist \
            --version "${CHART_VERSION}" \
            --app-version "${DIRTY_TAG}"
          helm show chart "dist/flowgent-${CHART_VERSION}.tgz" >/dev/null

      - name: Upload dirty Helm chart
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flowgent-chart-${{ steps.dirty-tag.outputs.value }}
          path: dist/flowgent-${{ steps.dirty-tag.outputs.chart_version }}.tgz
          if-no-files-found: error
          retention-days: 14

  comment-build:
    name: Report build result
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Update PR CI comment
        env:
          GH_TOKEN: ${{ github.token }}
          FLOWGENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          FLOWGENT_COMMENT_KIND: ci
          FLOWGENT_COMMENT_PHASE: build
          FLOWGENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLOWGENT_BUILD_RESULT: ${{ needs.build-and-test.result }}
          FLOWGENT_DIRTY_TAG: ${{ needs.build-and-test.outputs.dirty_tag }}
          FLOWGENT_DIRTY_CHART_VERSION: ${{ needs.build-and-test.outputs.dirty_chart_version }}
        run: |
          node .github/scripts/upsert-pr-status-comment.mjs || \
            echo "::warning title=Flowgent PR CI comment::Could not publish the CI status comment."

  e2e-kubernetes:
    name: Full security-autonomy Kubernetes E2E
    needs: build-and-test
    # A dedicated runner variable lets heavy E2E use a larger worker without
    # serializing it with Docker Compose on the same host.
    runs-on: ${{ vars.FLOWGENT_E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    outputs:
      summary_base64: ${{ steps.summary.outputs.base64 }}
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      FLOWGENT_E2E_PG_CONTAINER: sigbot_e2e_164364_postgres
      FLOWGENT_PG_USER: test
      FLOWGENT_PG_PASSWORD: test
      FLOWGENT_PG_DATABASE: flowgent
      GITHUB_TOKEN: ${{ secrets.FLOWGENT_E2E_GITHUB_TOKEN || github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Reclaim ephemeral runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644
          kubectl wait --for=condition=Ready node --all --timeout=180s

      - name: Install E2E Python dependencies
        run: python -m pip install --disable-pip-version-check -r use-cases/security-autonomy-fixer/e2e/requirements.txt

      - name: Start isolated PostgreSQL
        run: |
          docker run -d --name "${FLOWGENT_E2E_PG_CONTAINER}" \
            -e POSTGRES_USER="${FLOWGENT_PG_USER}" \
            -e POSTGRES_PASSWORD="${FLOWGENT_PG_PASSWORD}" \
            -e POSTGRES_DB="${FLOWGENT_PG_DATABASE}" \
            registry.cn-shenzhen.aliyuncs.com/wl4g/pgvector_pgvector:pg16
          for attempt in $(seq 1 60); do
            if docker exec "${FLOWGENT_E2E_PG_CONTAINER}" pg_isready -U "${FLOWGENT_PG_USER}" -d "${FLOWGENT_PG_DATABASE}"; then
              exit 0
            fi
            sleep 2
          done
          docker logs "${FLOWGENT_E2E_PG_CONTAINER}"
          exit 1

      - name: Pull dirty images for k3s import
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRTY_TAG: ${{ needs.build-and-test.outputs.dirty_tag }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "ghcr.io/flowgent-labs/flowgent:${DIRTY_TAG}"
          docker pull "ghcr.io/flowgent-labs/flowgent-web:${DIRTY_TAG}"
          docker tag "ghcr.io/flowgent-labs/flowgent:${DIRTY_TAG}" localhost/flowgent:latest
          docker tag "ghcr.io/flowgent-labs/flowgent-web:${DIRTY_TAG}" localhost/flowgent-web:latest
          docker logout ghcr.io

      - name: Build console binary
        run: make build:core

      - name: Run complete Kubernetes E2E against dirty images
        run: python -u use-cases/security-autonomy-fixer/e2e/runner.py --deployer k8s --skip-build --clean-after-run

      - name: Capture Kubernetes E2E summary
        id: summary
        if: always()
        run: |
          summary=use-cases/security-autonomy-fixer/e2e/reports/00_summary.md
          if [[ -s "${summary}" ]]; then
            echo "base64=$(base64 -w 0 "${summary}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Kubernetes E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-autonomy-fixer-kubernetes-${{ needs.build-and-test.outputs.dirty_tag }}
          path: use-cases/security-autonomy-fixer/e2e/reports/
          if-no-files-found: warn
          retention-days: 14

  e2e-docker:
    name: Full security-autonomy Docker Compose E2E
    needs: build-and-test
    # This job intentionally runs in parallel with e2e-kubernetes on a
    # separate VM, preventing databases, browsers, and image caches from
    # competing for one runner's CPU, memory, and disk.
    runs-on: ${{ vars.FLOWGENT_E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    outputs:
      summary_base64: ${{ steps.summary.outputs.base64 }}
    env:
      FLOWGENT_PG_USER: test
      FLOWGENT_PG_PASSWORD: test
      FLOWGENT_PG_DATABASE: flowgent
      GITHUB_TOKEN: ${{ secrets.FLOWGENT_E2E_GITHUB_TOKEN || github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Reclaim ephemeral runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Verify Docker Compose
        run: docker compose version

      - name: Install E2E Python dependencies
        run: python -m pip install --disable-pip-version-check -r use-cases/security-autonomy-fixer/e2e/requirements.txt

      - name: Pull dirty images for Docker Compose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRTY_TAG: ${{ needs.build-and-test.outputs.dirty_tag }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "ghcr.io/flowgent-labs/flowgent:${DIRTY_TAG}"
          docker pull "ghcr.io/flowgent-labs/flowgent-web:${DIRTY_TAG}"
          docker tag "ghcr.io/flowgent-labs/flowgent:${DIRTY_TAG}" localhost/flowgent:latest
          docker tag "ghcr.io/flowgent-labs/flowgent-web:${DIRTY_TAG}" localhost/flowgent-web:latest
          docker logout ghcr.io

      - name: Build console binary
        run: make build:core

      - name: Run complete Docker Compose E2E against dirty images
        run: python -u use-cases/security-autonomy-fixer/e2e/runner.py --deployer docker --skip-build --clean-after-run

      - name: Capture Docker Compose E2E summary
        id: summary
        if: always()
        run: |
          summary=use-cases/security-autonomy-fixer/e2e/reports/00_summary.md
          if [[ -s "${summary}" ]]; then
            echo "base64=$(base64 -w 0 "${summary}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Docker Compose E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-autonomy-fixer-docker-${{ needs.build-and-test.outputs.dirty_tag }}
          path: use-cases/security-autonomy-fixer/e2e/reports/
          if-no-files-found: warn
          retention-days: 14

  comment-final:
    name: Report PR CI result
    needs: [build-and-test, comment-build, e2e-kubernetes, e2e-docker]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Update PR CI comment
        env:
          GH_TOKEN: ${{ github.token }}
          FLOWGENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          FLOWGENT_COMMENT_KIND: ci
          FLOWGENT_COMMENT_PHASE: final
          FLOWGENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLOWGENT_BUILD_RESULT: ${{ needs.build-and-test.result }}
          FLOWGENT_E2E_KUBERNETES_RESULT: ${{ needs.e2e-kubernetes.result }}
          FLOWGENT_E2E_KUBERNETES_SUMMARY_BASE64: ${{ needs.e2e-kubernetes.outputs.summary_base64 }}
          FLOWGENT_E2E_DOCKER_RESULT: ${{ needs.e2e-docker.result }}
          FLOWGENT_E2E_DOCKER_SUMMARY_BASE64: ${{ needs.e2e-docker.outputs.summary_base64 }}
          FLOWGENT_DIRTY_TAG: ${{ needs.build-and-test.outputs.dirty_tag }}
          FLOWGENT_DIRTY_CHART_VERSION: ${{ needs.build-and-test.outputs.dirty_chart_version }}
        run: |
          node .github/scripts/upsert-pr-status-comment.mjs || \
            echo "::warning title=Flowgent PR CI comment::Could not publish the CI status comment."
