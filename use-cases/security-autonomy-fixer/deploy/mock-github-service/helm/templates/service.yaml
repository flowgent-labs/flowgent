{{- $name := .Values.name | default .Release.Name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: {{ $name }}
    {{- with .Values.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- with .Values.labels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.volumes }}
      volumes: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ required "image must be supplied by E2EImagesDefinitions or Helm values" .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          {{- with .Values.command }}
          command: {{ toJson . }}
          {{- end }}
          {{- with .Values.args }}
          args: {{ toJson . }}
          {{- end }}
          ports: [{name: service, containerPort: {{ .Values.port | default 8080 }}}]
          readinessProbe:
            tcpSocket: {port: service}
            periodSeconds: 3
          {{- with .Values.env }}
          env: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts: {{ toYaml . | nindent 12 }}
          {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  selector: {app: {{ $name }}}
  ports: [{name: service, port: {{ .Values.port | default 8080 }}, targetPort: service}]

{{- with .Values.secretData }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.secretName }}
  namespace: {{ $.Values.namespace | default $.Release.Namespace }}
stringData: {{ toYaml . | nindent 2 }}
{{- end }}

{{- with .Values.configData }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.configName }}
  namespace: {{ $.Values.namespace | default $.Release.Namespace }}
data: {{ toYaml . | nindent 2 }}
{{- end }}

{{- if and .Values.persistence .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "2Gi" }}
{{- end }}
