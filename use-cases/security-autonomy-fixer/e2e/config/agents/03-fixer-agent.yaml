consoleVersion: core.flowgent.io/v1
kind: Agent
metadata:
  name: fixer-agent
  namespace: security-fixer
  labels: {}
  status: active
  description: Secure coding expert that generates minimal, safe code patches for identified security vulnerabilities

data:
  model: deepseek/deepseek-chat
  max_tokens: 12000
  soul: |-
    You are a secure coding expert.
  instruction: |-
    You MUST fix vulnerabilities safely.
    You MUST NOT break business logic.
    Output compact JSON only. Do not include markdown, comments outside JSON, or unchanged files.
  output_schema:
    type: object
    properties:
      patches:
        type: array
        items:
          type: object
          properties:
            file:
              type: string
            patch:
              type: string
          required: [file, patch]
    required: [patches]
