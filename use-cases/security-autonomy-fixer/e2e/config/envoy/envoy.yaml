static_resources:
  listeners:
    - name: e2e-flowgent-edge
      address:
        socket_address: {address: 0.0.0.0, port_value: 8080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: e2e_flowgent_edge
                route_config:
                  name: e2e-flowgent-routes
                  virtual_hosts:
                    - name: flowgent
                      domains: ["*"]
                      routes:
                        - match: {path: "/auth/login"}
                          route: {cluster: authguard_web}
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: {path: "/auth/account/security"}
                          route: {cluster: authguard_web}
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: {prefix: "/auth/assets/"}
                          route: {cluster: authguard_web}
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: {prefix: "/auth/"}
                          route: {cluster: authn}
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: {prefix: "/.well-known/"}
                          route: {cluster: authn}
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: {prefix: "/api/"}
                          route: {cluster: flowgent}
                        - match: {prefix: "/"}
                          route: {cluster: flowgent_web}
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        authguard:
                          issuer: urn:authguard:e2e-flowgent:authn
                          audiences: [flowgent]
                          from_headers:
                            - name: authorization
                              value_prefix: "Bearer "
                          from_cookies: [authguard_token]
                          forward: true
                          remote_jwks:
                            http_uri:
                              uri: http://authguard-authn:8082/.well-known/jwks.json
                              cluster: authn
                              timeout: 2s
                            cache_duration: 300s
                      rules:
                        - match: {prefix: "/"}
                          requires: {provider_name: authguard}
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc: {cluster_name: authz}
                        timeout: 2s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: authn
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: authn
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: authguard-authn, port_value: 8082}}}}]}]
    - name: authz
      type: STRICT_DNS
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: {http2_protocol_options: {}}
      load_assignment:
        cluster_name: authz
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: authguard-authz, port_value: 8080}}}}]}]
    - name: authguard_web
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: authguard_web
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: authguard-web, port_value: 8080}}}}]}]
    - name: flowgent
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: flowgent
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: flowgent, port_value: 9999}}}}]}]
    - name: flowgent_web
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: flowgent_web
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: web, port_value: 8080}}}}]}]
