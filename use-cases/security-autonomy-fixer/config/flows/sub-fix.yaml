apiVersion: core.flowgent.io/v1
kind: Flow
metadata:
  name: sub-fix
  tenant: default
  labels: {}
  status: active
  description: Sub-flow for individual security issue analysis, patching, and validation per finding

spec:
  id: sub-fix
  nodes:
    - id: analyze
      kind: agent
      spec:
        agent: fixer-agent
      instruction: |
        Analyze the issue only. DO NOT patch.
    - id: patch
      kind: agent
      spec:
        agent: fixer-agent
      instruction: |
        Generate secure patch.
    - id: validate
      kind: tool
      spec:
        tool: sonarqube
  edges:
    - { from: analyze, to: patch }
    - { from: patch, to: validate }
