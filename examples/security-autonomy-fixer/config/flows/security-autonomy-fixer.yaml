# ═══════════════════════════════════════════════════════════════════════════════
# Security Autonomy Fixer — SonarQube-Only E2E Remediation Pipeline
#
# This is the canonical security remediation flow for SonarQube SAST findings.
# It triggers from a GitHub PR webhook (SonarQube CI scan job), fetches issues
# via the SonarQube MCP, and executes the full fix→review→vote→approve→commit
# pipeline.
#
# No SonatypeIQ license is required — this flow is SonarQube-only.
#
# Pipeline phases (11 phases):
#   1. DISCOVERY  — Get latest commit SHA, fetch SonarQube SAST issues
#   2. ANALYZE    — Parse, normalize, deduplicate, assign severity
#   3. FIX        — Generate minimal secure patches per issue
#   4. REVIEW     — Security, quality, architecture review in parallel
#   5. VOTE       — Deterministic majority vote
#   6. SUPERVISOR — Safety gate (retry/inject/abort)
#   7. CONDITION  — Route: approved → human approval, rejected → loop to fix
#   8. HUMAN      — Async approval gate (24h timeout)
#   9. COMMIT+PR  — Create branch, push patches, open pull request
#   10. RE-SCAN   — SonarQube re-analysis, compare pre/post, loop if needed
#   11. REPORT    — Final summary → notify via PR comment + email + webhook
#
# Design decisions: docs/01-L1-Engine-Architecture.md §13 (Skills = Sub-AgentFlow)
# E2E verification:  e2e-verification/E2E-security-fixer.md
# ═══════════════════════════════════════════════════════════════════════════════

id: security-autonomy-fixer
priority: high
tenant_id: default
description: |
  SonarQube-only developer remediation agentflow for security vulnerabilities:

  1. DISCOVERY — Fetch latest commit; query SonarQube SAST issues via MCP.
  2. ANALYZE — issue-detector agent parses, normalizes, deduplicates, and
     assigns severity to all SonarQube findings.
  3. FIX — fixer-agent analyzes root cause and generates minimal secure patches.
  4. REVIEW — Three agents (security, quality, architecture) review in parallel.
  5. VOTE — Deterministic majority vote decides whether to proceed.
  6. SUPERVISOR — Safety gate with bounded retries, injection limits, abort.
  7. CONDITIONAL — Based on vote: proceed to human approval or loop back to fix.
  8. HUMAN APPROVAL — Async approval gate (24h timeout) before code push.
  9. COMMIT & PR — Create branch, push patches, open pull request.
  10. RE-SCAN — Trigger SonarQube re-analysis, poll for completion, compare
      pre/post results. If unresolved issues remain → loop back to fix
      (max 3 iterations).
  11. REPORT — Compile final summary, notify via PR comment + email + webhook.

triggers:
  - type: schedule
    cron: 0 */6 * * *
  - type: webhook
    provider: github
    events: [push, pull_request]
  - type: webhook
    provider: gitlab
    events: [push, merge_request]

vars:
  repo: "rengine"
  repo_path: "/home/agent/rengine"
  max_iterations: 3
  target_severities: "BLOCKER,CRITICAL,MAJOR"
  notify_email_to: "security-team@company.com"
  notify_webhook_url: "https://outlook.office.com/webhook/xxxxx"

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: DISCOVERY — Get commit SHA + SonarQube issues
  # ═══════════════════════════════════════════════════════════════

  - id: get-commit
    type: tool
    tool: github
    input:
      action: get_latest_commit
      repo: "${vars.repo}"
      branch: main

  - id: scan-sonarqube
    type: tool
    tool: sonarqube
    input:
      action: "scan/get_issues"
      project_key: "${vars.repo}"
      severities: "${vars.target_severities}"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: ANALYZE — Parse, normalize, deduplicate findings
  # ═══════════════════════════════════════════════════════════════

  - id: aggregate-issues
    type: agent
    agent: issue-detector
    input:
      repo: "${vars.repo}"
      sonarqube_issues: "${scan-sonarqube}"
    instruction: |
      Parse the SonarQube scan results. For each issue extract:
      - Source (sonarqube), rule ID, severity
      - File path, line number, message
      - Deduplicate by file+rule (keep highest severity)
      - Sort by severity (BLOCKER > CRITICAL > MAJOR)
      - Select top 10 issues to fix (prioritize BLOCKER/CRITICAL)
      Output STRICT JSON: {"issues":[{"source":"...","rule":"...","severity":"...","file":"...","line":N,"message":"..."}]}

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: FIX — Generate minimal secure patches
  # ═══════════════════════════════════════════════════════════════

  - id: generate-fixes
    type: agent
    agent: fixer-agent
    input:
      issues: "${aggregate-issues.issues}"
      repo_path: "${vars.repo_path}"
    instruction: |
      For each issue, read the source file at the reported line,
      understand the root cause, and generate a minimal secure patch.
      Do NOT change business logic. Prefer targeted fixes.
      Output STRICT JSON: {"patches":[{"file":"...","rule":"...","patch":"unified diff"}]}

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: REVIEW — Multi-agent review board (parallel)
  # ═══════════════════════════════════════════════════════════════

  - id: review-security
    type: agent
    agent: security-reviewer
    input:
      patches: "${generate-fixes.patches}"
    instruction: |
      Review each patch for security correctness. Does it fix the root cause?
      Could it introduce new vulnerabilities?
      Output STRICT JSON: {"decision":true|false,"confidence":0-1,"risk_level":"low|medium|high","reason":"..."}

  - id: review-quality
    type: agent
    agent: quality-reviewer
    input:
      patches: "${generate-fixes.patches}"
    instruction: |
      Review each patch for code quality. Is it minimal? Does it follow best practices?
      Output STRICT JSON: {"decision":true|false,"confidence":0-1,"reason":"..."}

  - id: review-arch
    type: agent
    agent: arch-reviewer
    input:
      patches: "${generate-fixes.patches}"
    instruction: |
      Review each patch for architectural impact. Does it break design patterns?
      Could it affect system behavior?
      Output STRICT JSON: {"decision":true|false,"confidence":0-1,"reason":"..."}

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5: VOTE — Deterministic majority vote
  # ═══════════════════════════════════════════════════════════════

  - id: tribunal
    type: tribunal
    strategy:
      type: majority
    input:
      votes:
        - "${review-security.decision}"
        - "${review-quality.decision}"
        - "${review-arch.decision}"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 6: SUPERVISOR — Safety gate
  # ═══════════════════════════════════════════════════════════════

  - id: supervisor-check
    type: supervisor
    agent: supervisor
    supervisor_config:
      max_retries: 3
      max_nodes: 50
      max_injections: 5
      allowed_actions: ["continue", "retry", "inject", "abort"]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 7: CONDITION — Vote outcome routing
  # ═══════════════════════════════════════════════════════════════

  - id: is-approved
    type: condition
    expression: "${tribunal.decision == true}"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 8: HUMAN APPROVAL — Async approval gate
  # ═══════════════════════════════════════════════════════════════

  - id: human-approval
    type: human
    approval:
      timeout: 24h
      on_approve: continue
      on_reject: "to: generate-fixes"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 9: COMMIT & PR — Push patches to repository
  # ═══════════════════════════════════════════════════════════════

  - id: create-branch
    type: tool
    tool: github
    input:
      action: create_branch
      repo: "${vars.repo}"
      branch: "security-bot/fix-${run_id}"
      base_branch: main

  - id: commit-fixes
    type: tool
    tool: github
    input:
      action: commit_and_push
      repo: "${vars.repo}"
      branch: "security-bot/fix-${run_id}"
      changes: "${generate-fixes.patches}"
      message: |
        [Security Fix] Auto-generated security fix

        Issues addressed:
        ${aggregate-issues.issues}

        Reviewed by: security, quality, architecture
        Vote: ${tribunal.decision}

  - id: create-pr
    type: tool
    tool: github
    input:
      action: create_pull_request
      repo: "${vars.repo}"
      title: "[Security Fix] Auto-generated security remediation"
      head: "security-bot/fix-${run_id}"
      base: main
      body: |
        ## Security Fix Summary
        Automatically generated by Flowgent Security Autonomy Fixer.

        ### Issues Found
        ${aggregate-issues.issues}

        ### Review Results
        - Security: ${review-security.decision} (${review-security.reason})
        - Quality: ${review-quality.decision} (${review-quality.reason})
        - Architecture: ${review-arch.decision} (${review-arch.reason})

        ### Vote
        Tribunal majority decision: **${tribunal.decision}**

  # ═══════════════════════════════════════════════════════════════
  # PHASE 10: RE-SCAN — SonarQube iterative fix verification
  #
  # After committing fixes, trigger SonarQube re-analysis and check
  # whether target issues are resolved. If not, loop back to
  # generate-fixes (max 3 iterations).
  # ═══════════════════════════════════════════════════════════════

  - id: trigger-rescan
    type: tool
    tool: sonarqube
    input:
      action: "scan/trigger_analysis"
      project_key: "${vars.repo}"

  - id: wait-rescan
    type: sandbox
    runtime: bash
    timeout: 120s
    retry:
      max: 12
      initial: 10s
      max_delay: 10s
      factor: 1.0
    script: |
      #!/bin/bash
      SQ_URL="${SONARQUBE_URL:-http://172.29.235.101:9000}"
      SQ_TOKEN="${SONARQUBE_TOKEN}"
      PROJECT_KEY="${vars.repo}"
      STATUS=$(curl -s --noproxy '*' -u "${SQ_TOKEN}:" \
        "$SQ_URL/api/ce/activity?type=REPORT&component=$PROJECT_KEY&ps=1" \
        2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('tasks',[{}])[0].get('status','PENDING'))" 2>/dev/null || echo "PENDING")
      if [ "$STATUS" = "SUCCESS" ]; then echo '{"status":"completed"}'; exit 0; fi
      echo '{"status":"pending"}'; exit 1
    network_policy:
      mode: allowlist
      allowed:
        - "172.29.235.101:9000"
        - "localhost:9000"

  - id: check-resolved
    type: tool
    tool: sonarqube
    input:
      action: "scan/get_issues"
      project_key: "${vars.repo}"
      severities: "${vars.target_severities}"

  - id: compare-results
    type: agent
    agent: issue-detector
    input:
      before_issues: "${aggregate-issues.issues}"
      after_issues: "${check-resolved}"
      iteration: "${vars.iteration}"
      max_iterations: "${vars.max_iterations}"
    instruction: |
      Compare pre-fix and post-fix SonarQube issue lists.
      Count how many of the original issues are now resolved.
      - ALL resolved → resolution="complete"
      - SOME resolved → resolution="partial"
      - NONE resolved → resolution="none"
      - iteration >= max_iterations → resolution="max_iterations_reached"
      Output STRICT JSON: {"resolution":"complete|partial|none|max_iterations_reached","resolved_count":N,"remaining_count":N,"resolved_issues":["rule1"],"remaining_issues":["rule2"]}

  - id: fix-complete
    type: condition
    expression: "${compare-results.resolution == complete || compare-results.resolution == max_iterations_reached}"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 11: REPORT — Final summary + multi-channel notify
  # ═══════════════════════════════════════════════════════════════

  - id: summary-report
    type: agent
    agent: issue-detector
    input:
      repo: "${vars.repo}"
      original_issues: "${aggregate-issues.issues}"
      patches: "${generate-fixes.patches}"
      vote_decision: "${tribunal.decision}"
      pr_url: "${create-pr.pr_url}"
      compare_result: "${compare-results}"
      scan_results:
        sonarqube: "${scan-sonarqube}"
    instruction: |
      Generate a final summary report in markdown format.
      Include: total issues found, patches applied, review votes,
      fix resolution status, PR link, scan result summaries.
      Output STRICT JSON: {"report":"markdown summary...","status":"completed|partial|failed","issues_found":N,"issues_fixed":N}

  - id: notify-pr
    type: tool
    tool: github
    input:
      action: create_issue_comment
      repo: "${vars.repo}"
      pr_number: "${create-pr.pr_number}"
      body: "${summary-report.report}"

  - id: notify-email
    type: tool
    tool: github
    input:
      action: send_email
      to: "${vars.notify_email_to}"
      subject: "[Security Fix] Remediation report — ${vars.repo}"
      body: "${summary-report.report}"

  - id: notify-teams
    type: tool
    tool: github
    input:
      action: webhook_notify
      webhook_url: "${vars.notify_webhook_url}"
      title: "Security Fix Report — ${vars.repo}"
      body: "${summary-report.report}"

  - id: end
    type: noop

edges:
  # Discovery → Analyze
  - { from: get-commit, to: scan-sonarqube }
  - { from: scan-sonarqube, to: aggregate-issues }

  # Analyze → Fix
  - { from: aggregate-issues, to: generate-fixes }

  # Fix → Review (parallel fan-out)
  - { from: generate-fixes, to: review-security }
  - { from: generate-fixes, to: review-quality }
  - { from: generate-fixes, to: review-arch }

  # Review → Vote
  - { from: review-security, to: tribunal }
  - { from: review-quality, to: tribunal }
  - { from: review-arch, to: tribunal }

  # Vote → Supervisor → Condition
  - { from: tribunal, to: supervisor-check }
  - { from: supervisor-check, to: is-approved }

  # If approved → Human → Commit → PR
  - { from: is-approved, to: human-approval, condition: true }
  - { from: human-approval, to: create-branch }
  - { from: create-branch, to: commit-fixes }
  - { from: commit-fixes, to: create-pr }

  # If vote rejected → Loop back to Fix
  - { from: is-approved, to: generate-fixes, condition: false }

  # PR → Re-scan → Compare → Loop or Complete
  - { from: create-pr, to: trigger-rescan }
  - { from: trigger-rescan, to: wait-rescan }
  - { from: wait-rescan, to: check-resolved }
  - { from: check-resolved, to: compare-results }
  - { from: compare-results, to: fix-complete }

  # Fix complete → Report → Notify → End
  - { from: fix-complete, to: summary-report, condition: true }
  - { from: summary-report, to: notify-pr }
  - { from: summary-report, to: notify-email }
  - { from: summary-report, to: notify-teams }
  - { from: notify-pr, to: end }
  - { from: notify-email, to: end }
  - { from: notify-teams, to: end }

  # Fix NOT complete → Loop back to Fix
  - { from: fix-complete, to: generate-fixes, condition: false }
