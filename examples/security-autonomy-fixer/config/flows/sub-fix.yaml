apiVersion: console.flowgent.io/v1
kind: Flow
metadata:
  name: sub-fix
  tenant: default
  labels: {}
  status: active
  description: Sub-flow for individual security issue analysis, patching, and validation per finding

spec:
  id: sub-fix
  nodes:
    - id: analyze
      type: agent
      agent: fixer-agent
      instruction: |
        Analyze the issue only. DO NOT patch.
    - id: patch
      type: agent
      agent: fixer-agent
      instruction: |
        Generate secure patch.
    - id: validate
      type: tool
      tool: sonarqube
  edges:
    - { from: analyze, to: patch }
    - { from: patch, to: validate }
