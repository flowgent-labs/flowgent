# Flowgent E2E Scenario: All-in-One Mode
# Storage=SQLite  Cache=Memory  Queue=Memory
# Usage: flowgent daemon start -c examples/scenario-e2e-allinone.yaml

service-name: flowgent

server:
  host: 0.0.0.0
  port: 9999
  context-path: "/"
  shutdown-timeout: 15s
  max-body-bytes: 10485760
  read-timeout: 30s
  write-timeout: 60s

a2a:
  enabled: true
  host: 0.0.0.0
  port: 9992

mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  pprof:
    enabled: true
    server-bind: "0.0.0.0:6669"
  # Notice: More OTEL custom configuration use to env: OTEL_SPAN_xxx
  otel:
    enabled: true
    endpoint: "http://localhost:4317"
    protocol: grpc # Optional: http/protobuf,http/json,grpc
    timeout: 10000

logging:
  mode: JSON # Options: HUMAN|JSON
  level: DEBUG

auth:
  jwt-validity-ak: 3600
  jwt-validity-rk: 86400
  jwt-algorithm: "ES256"
  jwt-private-key: "<YOUR_PRIVATE_KEY>"
  jwt-public-key: "<YOUR_PUBLIC_KEY>"
  anonymous-paths:
    - "/public/**"
    - "/static/**"
    - "/_/healthz"
    - "/_/healthz/**"
    - "/swagger-ui/**"
    - "/.well-known/**"
    - "/a2a/**"
  oidc:
    enabled: false
    client-id: "<YOUR_OIDC_CLIENT_ID>"
    issue-url: "https://iam.wl4g.com/realms/master"
    redirect-url: "http://wl4g.local:10000/serve/auth/callback/oidc"
    scope: "openid profile email"
  github:
    enabled: true
    auth-url: "https://github.com/login/oauth/authorize"
    token-url: "https://github.com/login/oauth/access_token"
    redirect-url: "http://wl4g.local:10000/serve/auth/callback/github"
    scope: "user"
    user-info-url: "https://api.github.com/user"

cache:
  provider: Memory # Memory|Redis Cluster
  memory:
    initial-capacity: 32
    max-capacity: 65535
    ttl: 3600000
    eviction-policy: LRU
  redis:
    nodes: ["redis://127.0.0.1:6379"]
    username: "default"
    password: "bitnami"
    connection-timeout: 3000
    response-timeout: 6000
    retries: 1
    max-retry-wait: 65536
    min-retry-wait: 1280
    read-from-replica: true

storage:
  type: "SQLITE" # SQLITE|POSTGRE
  sqlite:
    dir: ".flowgent/sqlite"
  postgres:
    host: "127.0.0.1"
    port: 5432
    database: "flowgent"
    schema: "public"
    username: postgres
    password: "changeit"
    min-connections: 2
    max-connections: 20
    use-ssl: false

llm:
  # Default timeout for LLM API calls
  request-timeout: 120s
  # Rate limiting: max requests per minute per provider
  rate-limit:
    bailian-codeplan: 60
  providers:
    bailian-codeplan:
      endpoint: https://coding.dashscope.aliyuncs.com/apps/xxxx
      credentials:
        api-key: sk-sp-dbb57d8b574c4dfc82baf767eac7b391
        #api-key-file: /home/agent/.github_token
      models:
        - name: qwen3.6-plus
          temperature: 0.3
          topk: 5
          modalities:
            input: [text]
            output: [text]
          thinking:
            enabled: true
            budget-tokens: 8192

        - name: qwen3.5-coder
          temperature: 0.3
          topk: 5
          modalities:
            input: [text]
            output: [text]
          thinking:
            enabled: true
            budget-tokens: 8192

orchestration:
  max-concurrent-flows: 10
  flow-execution-timeout: 30m
  max-node-retries: 3
  mcps:
    - name: github
      enabled: true
      type: local
      command: ["sh", "-c", "/bin/github-mcp"]
      args: ["--transport", "stdio", "-v", "10"]
      env:
        #MCP_UPSTREAM_TOKEN: Xxx
        MCP_UPSTREAM_TOKEN_FILE: /home/agent/.github_token

    - name: sonarqube
      enabled: true
      type: local
      command: ["sh", "-c", "/bin/sonarqube-mcp"]
      args: ["--transport", "stdio", "-v", "10"]
      env:
        #MCP_UPSTREAM_TOKEN: Xxx
        MCP_UPSTREAM_TOKEN_FILE: /home/agent/.github_token

    - name: sonatype-iq
      enabled: true
      type: local
      command: ["sh", "-c", "/bin/sonatype-iq-mcp"]
      args: ["--transport", "stdio", "-v", "10"]
      env:
        #MCP_UPSTREAM_TOKEN: Xxx
        MCP_UPSTREAM_TOKEN_FILE: /home/agent/.github_token
        
    - name: sonatype-nexus3
      enabled: true
      type: local
      command: ["sh", "-c", "/bin/sonatype-nexus3-mcp"]
      args: ["--transport", "stdio", "-v", "10"]
      env:
        #MCP_UPSTREAM_TOKEN: Xxx
        MCP_UPSTREAM_TOKEN_FILE: /home/agent/.github_token

    - name: confluence
      enabled: true
      type: local
      command: ["sh", "-c", "/bin/confluence-mcp"]
      args: ["--transport", "stdio", "-v", "10"]
      env:
        CONFLUENCE_BASE_URL: "https://your-domain.atlassian.net/wiki"
        CONFLUENCE_API_TOKEN: "<YOUR_ATLASSIAN_API_TOKEN>"
        CONFLUENCE_USER_EMAIL: "<YOUR_EMAIL>"

    - name: test
      enabled: true
      type: local
      command: ["sh", "-c", "/bin/test-mcp"]
      args: ["--transport", "stdio", "-v", "10"]
      env:
        TEST_WORKSPACE: "/workspace"

  # ── Agent definitions — static dir + future DB ──
  agents:
    static:
      enabled: true
      load-dir: "agents/"
      refresh: 30s
    standard:
      enabled: false  # DB-backed agents (future Flowgent UI)

  # ── Skill definitions — static dir ──
  skills:
    static:
      enabled: true
      load-dir: "skills/"
      refresh: 30s
    standard:
      enabled: false

  # ── AgentFlow definitions — static dir + future DB ──
  agentflows:
    static:
      enabled: true
      load-dir: "flows/"
      refresh: 1m
    standard:
      enabled: false  # DB-backed agentflows (future Flowgent UI)

# ── Notification Service ──────────────────────────────────────
notification:
  enabled: true
  channels:
    - name: telegram-ops
      type: telegram
      enabled: false
      config:
        bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "-1001234567890"
    - name: dingtalk-ops
      type: dingtalk
      enabled: false
      config:
        webhook_url: "${DINGTALK_WEBHOOK_URL}"
        secret: "${DINGTALK_SECRET}"
    - name: slack-ops
      type: slack
      enabled: false
      config:
        webhook_url: "${SLACK_WEBHOOK_URL}"
        channel: "#flowgent-alerts"

# ── Multi-Tenant Configuration ────────────────────────────────
tenant:
  default_tenant: "default"
  namespace_prefix: "flowgent-"
