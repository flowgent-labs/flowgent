# Flowgent E2E Scenario: Production Mode
# Storage=PostgreSQL  Cache=Redis  Queue=MQTT/EMQX
# Usage: flowgent daemon start -c examples/scenario-e2e-production.yaml

service-name: flowgent-prod
server:
  host: 0.0.0.0
  port: 9999
  context-path: /
  shutdown-timeout: 15s
  max-body-bytes: 10485760
  read-timeout: 30s
  write-timeout: 60s
a2a:
  enabled: false
mgmt:
  enabled: false
logging:
  mode: JSON
  level: DEBUG
auth:
  anonymous-paths:
  - /**
cache:
  provider: Redis
  redis:
    nodes:
    - redis://127.0.0.1:6379
    username: default
    password: bitnami
storage:
  type: POSTGRE
  postgres:
    host: 127.0.0.1
    port: 5432
    database: flowgent
    username: test
    password: test
llm:
  request-timeout: 60s
  providers:
    bailian:
      endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      credentials:
        api-key: sk-d223dbece7644b7f8b319799960d8936
      models:
      - name: qwen-plus
        temperature: 0.3
    deepseek:
      endpoint: https://api.deepseek.com/v1/chat/completions
      credentials:
        api-key: sk-4b3196a4b84f4ccabdc05cefa8c5974c
      models:
      - name: deepseek-chat
        temperature: 0.3
orchestration:
  max-concurrent-flows: 10
  flow-execution-timeout: 5m
  max-node-retries: 3
  mcps:
  - name: sonarqube
    enabled: true
    type: local
    command:
    - sh
    - -c
    - /tmp/sonarqube-mcp-wrapper
    args: []
    env:
      ALL_PROXY: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
  agents:
    static:
      enabled: true
      load-dir: ../examples/agents/
      refresh: 30s
    standard:
      enabled: false
  agentflows:
    static:
      enabled: true
      load-dir: ../examples/flows/
      refresh: 1m
    standard:
      enabled: false
  skills:
    static:
      enabled: false
      load-dir: skills/
    standard:
      enabled: false
notification:
  enabled: false
tenant:
  default_tenant: default
  namespace_prefix: flowgent-
