# ═══════════════════════════════════════════════════════════════════════════════
# Security Autonomy Fixer V2 — V1 Baseline with GitHub Webhook Commented Out
#
# This file is IDENTICAL to V1 (01-security-autonomy-fix-v1.yaml) except the
# GitHub PR webhook trigger is commented out (pending webhook→SonarQube
# integration deployment).
#
# V2 adds a SonarQube pre-check gate before commit (vs V1 which commits first):
#   DISCOVERY → ANALYZE → FIX → REVIEW → VOTE → SUPERVISOR → CONDITION →
#   HUMAN APPROVAL → PRE-CHECK (scanner + quality gate) →
#     pass → COMMIT & PR → RE-SCAN → REPORT → NOTIFY
#     fail → loop back to FIX (max 3 iterations)
#
# Once webhook→SonarQube integration is complete, this file can be removed —
# V1 becomes the single source of truth. Until then, V2 is what you deploy.
#
# Design decisions documented here:
#   docs/01-L1-Engine-Architecture.md §13 (Skills = Sub-AgentFlow)
#   docs/11-L2-E2E-security-fixer-v2.md §5 (White-Box Verification)
#
# Key design note — Skill vs MCP Tool for dependency checking:
#   The "fetch-safe-deps" node uses `type: skill` instead of `type: tool`
#   (tool: sonatype-nexus3) because Nexus3 open-source / personal deployments
#   cannot integrate with SonatypeIQ (requires paid license). The Nexus3 UI
#   won't show firewall status, and the Nexus3 REST API swagger won't return
#   firewall.status in component listings.
#
#   In the user's internal network, a copilot skill wraps gh + nexus3 web API
#   + gcloud CLI commands to fetch the latest top-3 non-quarantined Maven
#   dependency versions directly. Flowgent's skill concept is exactly a
#   sub-AgentFlow — no new abstraction needed. See §13 in architecture doc.
#
#   When running Flowgent in an environment WITH SonatypeIQ license, simply
#   swap this node back to `type: tool, tool: sonatype-nexus3`.
#
# V2 difference:
#   V2 is identical to V1 except the GitHub PR webhook trigger is commented
#   out (pending webhook→SonarQube integration). All core fix phases remain.
# ═══════════════════════════════════════════════════════════════════════════════

id: security-autonomy-fixer
priority: high
tenant_id: default
description: |
  Complete developer remediation agentflow for security vulnerabilities:

  1. DISCOVERY — Fetch latest commit; run SonarQube (SAST), Sonatype IQ (FOSS
     dependency vulns), and skill-based Nexus3 dependency firewall check.
  2. ANALYZE — issue-detector agent parses, normalizes, deduplicates, and
     assigns severity to all findings.
  3. FIX — fixer-agent analyzes root cause and generates minimal secure patches.
  4. REVIEW — Three agents (security, quality, architecture) review in parallel,
     simulating multi-expert peer review.
  5. VOTE — Deterministic majority vote decides whether to proceed.
  6. SUPERVISOR — Safety gate with bounded retries, injection limits, abort.
  7. CONDITIONAL — Based on vote: proceed to human approval or loop back to fix.
  8. HUMAN APPROVAL — Async approval gate (24h timeout) before code push.
  9. COMMIT & PR — Create branch, push patches, open pull request.
  10. RE-SCAN — Trigger SonarQube re-analysis, poll for completion, compare
      pre/post results. If unresolved issues remain → loop back to fix
      (max 3 iterations).
  11. REPORT — Compile final summary with issues found, fixes applied, PR links.
  12. NOTIFY — Multi-channel: PR comment, email, webhook (Teams/Slack).

triggers:
  - type: schedule
    cron: 0 */6 * * *
  # GitHub PR webhook trigger — commented out until webhook→SonarQube
  # integration is complete. Uncomment when the webhook receiver is deployed:
  # - type: webhook
  #   provider: github
  #   events: [push, pull_request]
  - type: webhook
    provider: gitlab
    events: [push, merge_request]

vars:
  repo: "rengine"
  repo_path: "/home/agent/rengine"
  max_iterations: 3
  target_severities: "BLOCKER,CRITICAL,MAJOR"
  notify_email_to: "security-team@company.com"
  notify_webhook_url: "https://outlook.office.com/webhook/xxxxx"

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: DISCOVERY — Scan the target repository
  # ═══════════════════════════════════════════════════════════════

  - id: get-commit
    type: tool
    tool: github
    input:
      action: get_latest_commit
      repo: "${vars.repo}"
      branch: main

  - id: scan-sonarqube
    type: tool
    tool: sonarqube
    input:
      action: "scan/get_issues"
      project_key: "${vars.repo}"
      severities: "${vars.target_severities}"

  - id: scan-sonatypeiq
    type: tool
    tool: sonatype-iq
    input:
      action: get_jobs_by_commit
      repo: "${vars.repo}"
      commit_sha: "${get-commit.commit_sha}"

  # ═══════════════════════════════════════════════════════════════
  # Skill-based Nexus3 dependency firewall check.
  #
  # Replaces `type: tool, tool: sonatype-nexus3` because:
  #   Nexus3 open-source / personal deployment lacks SonatypeIQ license
  #   integration. The Nexus3 UI shows no firewall status, and the REST
  #   API swagger doesn't return firewall.status in component listings.
  #
  # This skill wraps copilot scripts using gh + nexus3 web API + gcloud
  # CLI to fetch the latest top-3 non-quarantined Maven dependency
  # versions directly. In Flowgent, a "skill" IS a sub-AgentFlow
  # (see docs/01-L1-Engine-Architecture.md §13).
  #
  # If running with a licensed SonatypeIQ+Nexus3, swap to:
  #   type: tool
  #   tool: sonatype-nexus3
  #   input:
  #     action: get_foss_solution
  #     repo: "${vars.repo}"
  # ═══════════════════════════════════════════════════════════════
  - id: fetch-safe-deps
    type: skill
    skill: nexus3-retrieval
    input:
      repo: "${vars.repo}"
      maven_coordinates: "${scan-sonatypeiq.maven_coords}"
      top_n: 3

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: ANALYZE — Parse, normalize, deduplicate findings
  # ═══════════════════════════════════════════════════════════════

  - id: aggregate-issues
    type: agent
    agent: issue-detector
    input:
      repo: "${vars.repo}"
      sonarqube_issues: "${scan-sonarqube}"
      sonatypeiq_issues: "${scan-sonatypeiq}"
      safe_deps: "${fetch-safe-deps}"
    instruction: |
      Parse all scan results. For each issue extract:
      - Source (sonarqube / sonatypeiq / dependency), rule ID, severity
      - File path, line number, message
      - Deduplicate by file+rule (keep highest severity)
      - Sort by severity (BLOCKER > CRITICAL > MAJOR)
      - Select top 10 issues to fix (prioritize BLOCKER/CRITICAL)
      Output STRICT JSON: {"issues":[{"source":"...","rule":"...","severity":"...","file":"...","line":N,"message":"..."}]}

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: FIX — Generate minimal secure patches
  # ═══════════════════════════════════════════════════════════════

  - id: generate-fixes
    type: agent
    agent: fixer-agent
    input:
      issues: "${aggregate-issues.issues}"
      repo_path: "${vars.repo_path}"
    instruction: |
      For each issue, read the source file at the reported line,
      understand the root cause, and generate a minimal secure patch.
      Do NOT change business logic. Prefer targeted fixes.
      Output STRICT JSON: {"patches":[{"file":"...","rule":"...","patch":"unified diff"}]}

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: REVIEW — Multi-agent review board (parallel)
  # ═══════════════════════════════════════════════════════════════

  - id: review-security
    type: agent
    agent: security-reviewer
    input:
      patches: "${generate-fixes.patches}"
    instruction: |
      Review each patch for security correctness. Does it fix the root cause?
      Could it introduce new vulnerabilities?
      Output STRICT JSON: {"decision":true|false,"confidence":0-1,"risk_level":"low|medium|high","reason":"..."}

  - id: review-quality
    type: agent
    agent: quality-reviewer
    input:
      patches: "${generate-fixes.patches}"
    instruction: |
      Review each patch for code quality. Is it minimal? Does it follow best practices?
      Output STRICT JSON: {"decision":true|false,"confidence":0-1,"reason":"..."}

  - id: review-arch
    type: agent
    agent: arch-reviewer
    input:
      patches: "${generate-fixes.patches}"
    instruction: |
      Review each patch for architectural impact. Does it break design patterns?
      Could it affect system behavior?
      Output STRICT JSON: {"decision":true|false,"confidence":0-1,"reason":"..."}

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5: VOTE — Deterministic majority vote
  # ═══════════════════════════════════════════════════════════════

  - id: tribunal
    type: tribunal
    strategy:
      type: majority
    input:
      votes:
        - "${review-security.decision}"
        - "${review-quality.decision}"
        - "${review-arch.decision}"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 6: SUPERVISOR — Safety gate
  # ═══════════════════════════════════════════════════════════════

  - id: supervisor-check
    type: supervisor
    agent: supervisor
    supervisor_config:
      max_retries: 3
      max_nodes: 50
      max_injections: 5
      allowed_actions: ["continue", "retry", "inject", "abort"]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 7: CONDITION — Vote outcome routing
  # ═══════════════════════════════════════════════════════════════

  - id: is-approved
    type: condition
    expression: "${tribunal.decision == true}"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 8: HUMAN APPROVAL — Async approval gate
  # ═══════════════════════════════════════════════════════════════

  - id: human-approval
    type: human
    approval:
      timeout: 24h
      on_approve: continue
      on_reject: "to: generate-fixes"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 9: PRE-CHECK — SonarQube scanner pre-upload + quality gate
  #
  # Before committing, run sonar-scanner to pre-upload results and check
  # if the quality gate passes. This avoids wasting CI time on commits
  # that would fail. If the gate fails, loop back to get latest issues
  # and re-iterate fixes until the gate passes or max_iterations is hit.
  # ═══════════════════════════════════════════════════════════════

  - id: precheck-scanner
    type: tool
    tool: github
    input:
      action: "scan/trigger_analysis"
      project_key: "${vars.repo}"

  - id: precheck-wait
    type: sandbox
    runtime: bash
    timeout: 120s
    retry:
      max: 12
      initial: 10s
      max_delay: 10s
      factor: 1.0
    script: |
      #!/bin/bash
      SQ_URL="${SONARQUBE_URL:-http://localhost:9000}"
      SQ_TOKEN="${SONARQUBE_TOKEN}"
      PROJECT_KEY="${vars.repo}"
      STATUS=$(curl -s --noproxy '*' -u "${SQ_TOKEN}:" \
        "$SQ_URL/api/ce/activity?type=REPORT&component=$PROJECT_KEY&ps=1" \
        2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('tasks',[{}])[0].get('status','PENDING'))" 2>/dev/null || echo "PENDING")
      if [ "$STATUS" = "SUCCESS" ]; then echo '{"status":"completed"}'; exit 0; fi
      echo '{"status":"pending"}'; exit 1
    network_policy:
      mode: allowlist
      allowed: ["localhost:9000", "sonarqube:9000"]

  - id: precheck-gate
    type: tool
    tool: sonarqube
    input:
      action: "scan/get_status"
      project_key: "${vars.repo}"

  - id: gate-passed
    type: condition
    expression: "${precheck-gate.status == success}"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 10: COMMIT & PR — Push patches to repository
  # ═══════════════════════════════════════════════════════════════

  - id: create-branch
    type: tool
    tool: github
    input:
      action: create_branch
      repo: "${vars.repo}"
      branch: "security-bot/fix-${run_id}"
      base_branch: main

  - id: commit-fixes
    type: tool
    tool: github
    input:
      action: commit_and_push
      repo: "${vars.repo}"
      branch: "security-bot/fix-${run_id}"
      changes: "${generate-fixes.patches}"
      message: |
        [Security Fix] Auto-generated security fix

        Issues addressed:
        ${aggregate-issues.issues}

        Reviewed by: security, quality, architecture
        Vote: ${tribunal.decision}

  - id: create-pr
    type: tool
    tool: github
    input:
      action: create_pull_request
      repo: "${vars.repo}"
      title: "[Security Fix] Auto-generated security remediation"
      head: "security-bot/fix-${run_id}"
      base: main
      body: |
        ## Security Fix Summary
        Automatically generated by Flowgent Security Autonomy Fixer.

        ### Issues Found
        ${aggregate-issues.issues}

        ### Review Results
        - Security: ${review-security.decision} (${review-security.reason})
        - Quality: ${review-quality.decision} (${review-quality.reason})
        - Architecture: ${review-arch.decision} (${review-arch.reason})

        ### Vote
        Tribunal majority decision: **${tribunal.decision}**

  # ═══════════════════════════════════════════════════════════════
  # PHASE 11: RE-SCAN — SonarQube iterative fix verification
  #
  # After committing fixes, trigger SonarQube re-analysis and check
  # whether target issues are resolved. If not, loop back to
  # generate-fixes (max 3 iterations). This ensures fixes actually
  # resolve the reported issues before reporting success.
  # ═══════════════════════════════════════════════════════════════

  - id: trigger-rescan
    type: tool
    tool: sonarqube
    input:
      action: "scan/trigger_analysis"
      project_key: "${vars.repo}"

  - id: wait-rescan
    type: sandbox
    runtime: bash
    timeout: 120s
    retry:
      max: 12
      initial: 10s
      max_delay: 10s
      factor: 1.0
    script: |
      #!/bin/bash
      SQ_URL="${SONARQUBE_URL:-http://localhost:9000}"
      SQ_TOKEN="${SONARQUBE_TOKEN}"
      PROJECT_KEY="${vars.repo}"
      STATUS=$(curl -s --noproxy '*' -u "${SQ_TOKEN}:" \
        "$SQ_URL/api/ce/activity?type=REPORT&component=$PROJECT_KEY&ps=1" \
        2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('tasks',[{}])[0].get('status','PENDING'))" 2>/dev/null || echo "PENDING")
      if [ "$STATUS" = "SUCCESS" ]; then echo '{"status":"completed"}'; exit 0; fi
      echo '{"status":"pending"}'; exit 1
    network_policy:
      mode: allowlist
      allowed:
        - "localhost:9000"

  - id: check-resolved
    type: tool
    tool: sonarqube
    input:
      action: "scan/get_issues"
      project_key: "${vars.repo}"
      severities: "${vars.target_severities}"

  - id: compare-results
    type: agent
    agent: issue-detector
    input:
      before_issues: "${aggregate-issues.issues}"
      after_issues: "${check-resolved}"
      iteration: "${vars.iteration}"
      max_iterations: "${vars.max_iterations}"
    instruction: |
      Compare pre-fix and post-fix SonarQube issue lists.
      Count how many of the original issues are now resolved (no longer appear).
      - ALL target issues resolved → resolution="complete"
      - SOME resolved but not all → resolution="partial"
      - NONE resolved → resolution="none"
      - iteration >= max_iterations → resolution="max_iterations_reached"
      Output STRICT JSON: {"resolution":"complete|partial|none|max_iterations_reached","resolved_count":N,"remaining_count":N,"resolved_issues":["rule1"],"remaining_issues":["rule2"]}

  - id: fix-complete
    type: condition
    expression: "${compare-results.resolution == complete || compare-results.resolution == max_iterations_reached}"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 12: REPORT — Final summary
  # ═══════════════════════════════════════════════════════════════

  - id: summary-report
    type: agent
    agent: issue-detector
    input:
      repo: "${vars.repo}"
      original_issues: "${aggregate-issues.issues}"
      patches: "${generate-fixes.patches}"
      vote_decision: "${tribunal.decision}"
      pr_url: "${create-pr.pr_url}"
      compare_result: "${compare-results}"
      scan_results:
        sonarqube: "${scan-sonarqube}"
        sonatypeiq: "${scan-sonatypeiq}"
        safe_deps: "${fetch-safe-deps}"
    instruction: |
      Generate a final summary report in markdown format.
      Include: total issues found, patches applied, review votes,
      fix resolution status, PR link, scan result summaries.
      Output STRICT JSON: {"report":"markdown summary...","status":"completed|partial|failed","issues_found":N,"issues_fixed":N}

  # ═══════════════════════════════════════════════════════════════
  # PHASE 12: NOTIFY — Multi-channel parallel notification
  # ═══════════════════════════════════════════════════════════════

  - id: notify-pr
    type: tool
    tool: github
    input:
      action: create_issue_comment
      repo: "${vars.repo}"
      pr_number: "${create-pr.pr_number}"
      body: "${summary-report.report}"

  - id: notify-email
    type: tool
    tool: github
    input:
      action: send_email
      to: "${vars.notify_email_to}"
      subject: "[Security Fix] Remediation report — ${vars.repo}"
      body: "${summary-report.report}"

  - id: notify-teams
    type: tool
    tool: github
    input:
      action: webhook_notify
      webhook_url: "${vars.notify_webhook_url}"
      title: "Security Fix Report — ${vars.repo}"
      body: "${summary-report.report}"

  - id: end
    type: noop

edges:
  # Discovery → Analyze (all scans run in parallel before analyze)
  - { from: get-commit, to: scan-sonatypeiq }
  - { from: scan-sonarqube, to: aggregate-issues }
  - { from: scan-sonatypeiq, to: fetch-safe-deps }
  - { from: fetch-safe-deps, to: aggregate-issues }

  # Analyze → Fix
  - { from: aggregate-issues, to: generate-fixes }

  # Fix → Review (parallel fan-out)
  - { from: generate-fixes, to: review-security }
  - { from: generate-fixes, to: review-quality }
  - { from: generate-fixes, to: review-arch }

  # Review → Vote
  - { from: review-security, to: tribunal }
  - { from: review-quality, to: tribunal }
  - { from: review-arch, to: tribunal }

  # Vote → Supervisor → Condition
  - { from: tribunal, to: supervisor-check }
  - { from: supervisor-check, to: is-approved }

  # If approved → Human → Pre-check → Gate decision
  - { from: is-approved, to: human-approval, condition: true }
  - { from: human-approval, to: precheck-scanner }
  - { from: precheck-scanner, to: precheck-wait }
  - { from: precheck-wait, to: precheck-gate }
  - { from: precheck-gate, to: gate-passed }
  # Gate passed → Commit → PR → Re-scan → Report
  - { from: gate-passed, to: create-branch, condition: true }
  - { from: create-branch, to: commit-fixes }
  - { from: commit-fixes, to: create-pr }
  # Gate failed → Loop back to Fix
  - { from: gate-passed, to: generate-fixes, condition: false }
  - { from: create-pr, to: trigger-rescan }
  - { from: trigger-rescan, to: wait-rescan }
  - { from: wait-rescan, to: check-resolved }
  - { from: check-resolved, to: compare-results }
  - { from: compare-results, to: fix-complete }

  # If fix complete → Report → Notify → End
  - { from: fix-complete, to: summary-report, condition: true }
  - { from: summary-report, to: notify-pr }
  - { from: summary-report, to: notify-email }
  - { from: summary-report, to: notify-teams }
  - { from: notify-pr, to: end }
  - { from: notify-email, to: end }
  - { from: notify-teams, to: end }

  # If fix NOT complete AND iteration < max → Loop back to Fix
  - { from: fix-complete, to: generate-fixes, condition: false }

  # If vote rejected → Loop back to Fix
  - { from: is-approved, to: generate-fixes, condition: false }
