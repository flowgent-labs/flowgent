id: e2e-sonarqube-real
priority: high
tenant_id: default

vars:
  repo: "rengine"

nodes:
  - id: fetch-sq
    type: tool
    tool: sonarqube
    input:
      action: "scan/get_issues"
      project_key: "rengine"
      severities: "BLOCKER"

  - id: analyze
    type: agent
    agent: issue-detector
    input:
      sq_issues: "${fetch-sq}"
    instruction: |
      Output ONLY this exact JSON, nothing else:
      {"total_issues":<count from sq_issues>,"summary":"<brief analysis>"}

  - id: end
    type: noop

edges:
  - { from: fetch-sq, to: analyze }
  - { from: analyze, to: end }
