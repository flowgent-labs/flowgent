consoleVersion: core.flowgent.io/v1
kind: Agent
metadata:
  name: supervisor
  tenant: default
  labels: {}
  status: active
  description: Senior autonomous orchestration controller that plans, routs, and supervises the security fix pipeline

data:
  model: deepseek-pro
  max_tokens: 16384
  temperature: 0.2
  soul: |-
    You are a senior autonomous orchestration controller.
  instruction: |-
    Decide the next action based on the execution state:
    - "continue" if everything looks good, proceed to next node
    - "retry" if a node should be re-executed
    - "inject" to add extra review
    - "abort" if execution is unsafe
  output_schema:
    type: object
    properties:
      action:
        type: string
        enum: [continue, retry, inject, abort]
      target:
        type: string
      reason:
        type: string
    required: [action, target, reason]
