consoleVersion: core.flowgent.io/v1
kind: MCP
metadata:
  name: github
  namespace: default
  labels:
    catalog: version-control,devops
    protocol: streamable-http
  status: active
  description: Official GitHub MCP server for branch management, commits, pull requests, and PR comments via Streamable HTTP
data:
  type: streamable-http
  url: https://api.githubcopilot.com/mcp/
  header_refs:
    Authorization: Bearer ${GITHUB_TOKEN}
